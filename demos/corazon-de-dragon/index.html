<!DOCTYPE html>
<html lang="es">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Corazón de Dragón — La Balada de Denzel y Leslie</title>
<style>
:root{ --void:#07040e; --gold:#ffce6a; --rose:#d46a8c; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;background:#000;overflow:hidden;
  font-family:"Segoe UI",system-ui,sans-serif;color:#ffeccf;
  -webkit-user-select:none;user-select:none;touch-action:none;
}
body{display:flex;align-items:center;justify-content:center}
#frame{position:relative;line-height:0;filter:drop-shadow(0 0 60px rgba(120,60,160,.35))}
canvas#game{
  display:block;image-rendering:pixelated;image-rendering:crisp-edges;
  background:#07040e;
}
#vignette,#scanlines{position:absolute;inset:0;pointer-events:none}
#vignette{background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(4,2,8,.55) 100%)}
#scanlines{
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
  opacity:.35;mix-blend-mode:multiply;
}
#boot{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(ellipse at 50% 40%,#1b0f2c,#07040e 70%);
  cursor:pointer;line-height:1.4;z-index:20;
}
#boot.gone{opacity:0;pointer-events:none;transition:opacity .7s ease}
.sigil{
  width:54px;height:54px;border:2px solid var(--gold);transform:rotate(45deg);
  box-shadow:0 0 22px rgba(255,206,106,.5),inset 0 0 18px rgba(255,206,106,.25);
  animation:pulse 2.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.55;transform:rotate(45deg) scale(.92)}50%{opacity:1;transform:rotate(45deg) scale(1.06)}}
.boot-title{font-size:26px;letter-spacing:.34em;color:var(--gold);text-shadow:0 0 18px rgba(255,138,92,.6)}
.boot-hint{font-size:12px;letter-spacing:.22em;color:#a98fc0;animation:blink 1.9s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
#touch{display:none;position:absolute;inset:auto 0 0 0;padding:10px;justify-content:space-between;z-index:15}
#touch.on{display:flex}
.pad,.acts{display:flex;gap:8px}
.tb{
  width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,206,106,.45);
  background:rgba(30,16,48,.5);color:#ffce6a;font-size:19px;backdrop-filter:blur(3px);
}
.tb:active{background:rgba(212,106,140,.5)}

</style>
</head>
<body>
<div id="frame">
  <canvas id="game" width="480" height="270"></canvas>
  <div id="vignette"></div>
  <div id="scanlines"></div>
  <div id="boot">
    <div class="sigil"></div>
    <p class="boot-title">CORAZÓN DE DRAGÓN</p>
    <p class="boot-hint">Haz clic o toca para comenzar</p>
  </div>
  <div id="touch">
    <div class="pad">
      <button class="tb" data-k="left">◀</button>
      <button class="tb" data-k="right">▶</button>
    </div>
    <div class="acts">
      <button class="tb" data-k="power3">◇</button>
      <button class="tb" data-k="power2">✦</button>
      <button class="tb" data-k="attack">⚔</button>
      <button class="tb" data-k="jump">▲</button>
    </div>
  </div>
</div>
<script>
/* ===== 00-core.js ===== */
/* =========================================================================
   CORAZÓN DE DRAGÓN — 00-core.js
   Núcleo: matemáticas, entrada, audio sintetizado, guardado y bucle fijo.
   ========================================================================= */
'use strict';

const TAU = Math.PI * 2;
const W = 480, H = 270;           // resolución interna (pixel art)

/* ---------------------------------------------------------- utilidades -- */
const U = {
  clamp: (v, a, b) => v < a ? a : (v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  // aproxima a -> b como máximo `step` por llamada (movimiento sin rebotes)
  approach: (a, b, step) => a < b ? Math.min(a + step, b) : Math.max(a - step, b),
  rand: (a = 1, b = 0) => b + Math.random() * (a - b),
  randi: (a, b = 0) => Math.floor(b + Math.random() * (a - b)),
  choose: arr => arr[Math.floor(Math.random() * arr.length)],
  sign: v => v < 0 ? -1 : (v > 0 ? 1 : 0),
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  aabb: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  // suavizado exponencial independiente del framerate
  damp: (a, b, lambda, dt) => U.lerp(a, b, 1 - Math.exp(-lambda * dt)),
  ease: {
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inCubic: t => t * t * t,
    inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    outBack: t => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2),
    outElastic: t => (t === 0 || t === 1) ? t
      : Math.pow(2, -9 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1
  },
  // ruido de valor 1D suave — usado por viento, antorchas y oleaje
  noise1: (x, seed = 0) => {
    const i = Math.floor(x), f = x - i;
    const h = n => { const s = Math.sin(n * 127.1 + seed * 311.7) * 43758.5453; return s - Math.floor(s); };
    const u = f * f * (3 - 2 * f);
    return U.lerp(h(i), h(i + 1), u) * 2 - 1;
  }
};

/* =========================================================================
   ENTRADA — teclado, mando Xbox One (y compatibles) y controles táctiles.
   Los tres esquemas conviven: el último dispositivo usado decide qué iconos
   muestra la interfaz.
   ========================================================================= */
const Input = {
  /* --- teclado: cada acción admite varias teclas --- */
  map: {
    left:   ['ArrowLeft', 'KeyA'],
    right:  ['ArrowRight', 'KeyD'],
    up:     ['ArrowUp', 'KeyW'],
    down:   ['ArrowDown', 'KeyS'],
    jump:   ['Space', 'KeyW', 'ArrowUp'],
    attack: ['KeyJ', 'KeyZ'],
    power2: ['KeyK', 'KeyX'],
    power3: ['KeyL', 'KeyC'],
    dash:   ['ShiftLeft', 'ShiftRight'],
    dragon: ['KeyQ', 'KeyE'],
    pause:  ['Escape', 'KeyP'],
    confirm:['Enter', 'Space', 'KeyJ', 'KeyZ'],
    back:   ['Escape', 'Backspace']
  },

  /* --- mando Xbox One: índices del mapeo estándar del navegador ---
     0 A · 1 B · 2 X · 3 Y · 4 LB · 5 RB · 6 LT · 7 RT
     8 Ver · 9 Menú · 10 L3 · 11 R3 · 12-15 cruceta                     */
  padMap: {
    jump:   [0],            // A
    attack: [2],            // X
    power2: [3],            // Y
    power3: [1],            // B
    dash:   [5, 7],         // RB / RT
    dragon: [4, 6],         // LB / LT
    pause:  [9],            // Menú
    confirm:[0, 2, 9],      // A / X / Menú
    back:   [1, 8],         // B / Ver
    left:   [14], right: [15], up: [12], down: [13]
  },
  /* etiquetas para la pantalla de controles y los avisos en pantalla */
  padLabel: {
    jump: 'A', attack: 'X', power2: 'Y', power3: 'B',
    dash: 'RB', dragon: 'LB', pause: 'MENÚ', confirm: 'A', back: 'B',
    left: '◀', right: '▶', up: '▲', down: '▼'
  },
  keyLabel: {
    jump: 'ESPACIO', attack: 'J', power2: 'K', power3: 'L',
    dash: 'SHIFT', dragon: 'Q', pause: 'ESC', confirm: 'ENTER', back: 'ESC',
    left: 'A / ←', right: 'D / →', up: 'W / ↑', down: 'S / ↓'
  },

  deadzone: .35,
  down: {}, pressed: {}, released: {}, anyPressed: false,
  padDown: {}, padPrev: {}, _touch: {},
  padIndex: -1, padConnected: false, padName: '',
  lastDevice: 'kb',          // 'kb' | 'pad' | 'touch'
  rumbleOn: true,

  init() {
    addEventListener('keydown', e => {
      if (e.repeat) return;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      this.lastDevice = 'kb';
      this._set(e.code, true);
    });
    addEventListener('keyup', e => this._set(e.code, false));
    addEventListener('blur', () => { this.down = {}; this._touch = {}; this.padDown = {}; });

    // conexión y desconexión del mando
    addEventListener('gamepadconnected', e => {
      this.padIndex = e.gamepad.index;
      this.padConnected = true;
      this.padName = e.gamepad.id || 'Mando';
      this.lastDevice = 'pad';
      if (window.Game && Game.toast) Game.toast('Mando conectado', PAL.leaf2);
    });
    addEventListener('gamepaddisconnected', e => {
      if (e.gamepad.index === this.padIndex) {
        this.padConnected = false; this.padIndex = -1; this.padDown = {};
        this.lastDevice = 'kb';
        if (window.Game && Game.toast) Game.toast('Mando desconectado', PAL.blush);
      }
    });

    // controles táctiles (móvil/tableta)
    const pane = document.getElementById('touch');
    if (matchMedia('(pointer: coarse)').matches) pane.classList.add('on');
    pane.querySelectorAll('.tb').forEach(btn => {
      const k = btn.dataset.k;
      const on  = e => { e.preventDefault(); this.lastDevice = 'touch'; this._touch[k] = true; this._vpress(k); };
      const off = e => { e.preventDefault(); this._touch[k] = false; };
      btn.addEventListener('pointerdown', on);
      btn.addEventListener('pointerup', off);
      btn.addEventListener('pointerleave', off);
      btn.addEventListener('pointercancel', off);
    });
    // tocar/hacer clic en el lienzo cuenta como "confirmar" en menús y cinemáticas
    document.getElementById('game').addEventListener('pointerdown', () => this._vpress('confirm'));
  },

  _set(code, v) {
    for (const act in this.map) {
      if (!this.map[act].includes(code)) continue;
      if (v && !this.down[act]) this.pressed[act] = true;
      if (!v && this.down[act]) this.released[act] = true;
      this.down[act] = v;
    }
    if (v) this.anyPressed = true;
  },
  _vpress(k) {
    this.pressed[k] = true; this.anyPressed = true;
    if (k === 'attack' || k === 'jump') this.pressed.confirm = true;
  },

  /* --- sondeo del mando: se llama al principio de cada paso --- */
  poll() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let gp = this.padIndex >= 0 ? pads[this.padIndex] : null;
    if (!gp) {                                   // busca cualquier mando activo
      for (let i = 0; i < pads.length; i++) {
        if (pads[i] && pads[i].connected) {
          gp = pads[i]; this.padIndex = i;
          this.padConnected = true; this.padName = gp.id || 'Mando';
          break;
        }
      }
    }
    this.padPrev = this.padDown;
    this.padDown = {};
    if (!gp) { this.padConnected = false; return; }

    const B = i => !!(gp.buttons[i] && (gp.buttons[i].pressed || gp.buttons[i].value > .5));
    for (const act in this.padMap) {
      if (this.padMap[act].some(B)) this.padDown[act] = true;
    }
    // palanca izquierda como cruceta analógica
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (ax < -this.deadzone) this.padDown.left = true;
    if (ax >  this.deadzone) this.padDown.right = true;
    if (ay < -this.deadzone) { this.padDown.up = true; }
    if (ay >  this.deadzone) this.padDown.down = true;
    this.padAxisX = Math.abs(ax) > this.deadzone ? ax : 0;
    this.padAxisY = Math.abs(ay) > this.deadzone ? ay : 0;

    // flanco de subida -> pulsación, y el mando pasa a ser el dispositivo activo
    for (const act in this.padDown) {
      if (!this.padPrev[act]) {
        this.pressed[act] = true;
        this.anyPressed = true;
        this.lastDevice = 'pad';
      }
    }
  },

  /* --- vibración del mando (Xbox One admite los dos motores) --- */
  rumble(strong = .5, weak = .3, ms = 140) {
    if (!this.rumbleOn || !this.padConnected) return;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = pads[this.padIndex];
    if (!gp) return;
    const act = gp.vibrationActuator || (gp.hapticActuators && gp.hapticActuators[0]);
    if (!act) return;
    try {
      if (act.playEffect) act.playEffect('dual-rumble',
        { startDelay: 0, duration: ms, strongMagnitude: strong, weakMagnitude: weak });
      else if (act.pulse) act.pulse(strong, ms);
    } catch (e) { /* el navegador puede no permitirlo */ }
  },

  held(a) { return !!this.down[a] || !!this.padDown[a] || !!this._touch[a]; },
  hit(a)  { return !!this.pressed[a]; },
  /* eje analógico real cuando se usa la palanca; digital en teclado/cruceta */
  axisX() {
    if (this.padAxisX) return this.padAxisX;
    return (this.held('right') ? 1 : 0) - (this.held('left') ? 1 : 0);
  },

  /* etiqueta de una acción según el dispositivo en uso — la UI la consulta */
  label(act) {
    return this.lastDevice === 'pad' ? (this.padLabel[act] || '?') : (this.keyLabel[act] || '?');
  },

  // se llama al final de cada paso de simulación
  flush() {
    this.pressed = {}; this.released = {}; this.anyPressed = false;
  }
};

/* ---------------------------------------------------------------- audio -- */
/* Sintetizador WebAudio: sin ficheros externos, todo generado en vivo.      */
const Audio_ = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  enabled: true, musicVol: .34, sfxVol: .40,
  _track: null, _trackName: null, _step: 0, _nextTime: 0, _timer: null,

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.enabled = false; return; }
    this.ctx = new AC();
    this.master    = this.ctx.createGain(); this.master.gain.value = .9;
    this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = this.musicVol;
    this.sfxGain   = this.ctx.createGain(); this.sfxGain.gain.value = this.sfxVol;
    // reverberación de bosque/torre para dar profundidad al conjunto
    this.verb = this.ctx.createConvolver();
    this.verb.buffer = this._impulse(1.7, 2.6);
    this.verbGain = this.ctx.createGain(); this.verbGain.gain.value = .26;
    this.musicGain.connect(this.master); this.sfxGain.connect(this.master);
    this.musicGain.connect(this.verbGain); this.sfxGain.connect(this.verbGain);
    this.verbGain.connect(this.verb); this.verb.connect(this.master);
    this.master.connect(this.ctx.destination);
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

  _impulse(dur, decay) {
    const sr = this.ctx.sampleRate, len = Math.floor(sr * dur);
    const buf = this.ctx.createBuffer(2, len, sr);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  },
  _noiseBuf(dur) {
    const sr = this.ctx.sampleRate, len = Math.max(1, Math.floor(sr * dur));
    const b = this.ctx.createBuffer(1, len, sr), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return b;
  },

  /* tono con envolvente simple */
  tone(freq, dur, opt) {
    opt = opt || {};
    if (!this.enabled || !this.ctx) return;
    const t = opt.at || this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = opt.type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (opt.slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, opt.slide), t + dur);
    const vol = (opt.vol == null ? .3 : opt.vol);
    const atk = (opt.atk == null ? .006 : opt.atk);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002, vol), t + atk);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    let node = o;
    if (opt.filter) {
      const f = this.ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.setValueAtTime(opt.filter, t);
      if (opt.filterTo) f.frequency.exponentialRampToValueAtTime(opt.filterTo, t + dur);
      node.connect(f); node = f;
    }
    node.connect(g);
    g.connect(opt.bus || this.sfxGain);
    o.start(t); o.stop(t + dur + .02);
  },

  /* ráfaga de ruido filtrado: impactos, fuego, viento, aleteos */
  noise(dur, opt) {
    opt = opt || {};
    if (!this.enabled || !this.ctx) return;
    const t = opt.at || this.ctx.currentTime;
    const s = this.ctx.createBufferSource(); s.buffer = this._noiseBuf(dur + .05);
    const f = this.ctx.createBiquadFilter();
    f.type = opt.type || 'bandpass';
    f.frequency.setValueAtTime(opt.freq || 900, t);
    if (opt.to) f.frequency.exponentialRampToValueAtTime(Math.max(40, opt.to), t + dur);
    f.Q.value = (opt.q == null ? 1.2 : opt.q);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002, opt.vol == null ? .3 : opt.vol), t + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(opt.bus || this.sfxGain);
    s.start(t); s.stop(t + dur + .05);
  },

  /* --- efectos de sonido con nombre --- */
  sfx(name) {
    if (!this.enabled || !this.ctx) return;
    const c = this.ctx.currentTime;
    switch (name) {
      case 'jump':  this.tone(320, .17, { type: 'square', slide: 660, vol: .17, filter: 2200 }); break;
      case 'land':  this.noise(.10, { freq: 420, to: 120, vol: .18, q: .8 }); break;
      case 'dash':  this.noise(.26, { freq: 2600, to: 380, vol: .20, q: 1.6 }); break;
      case 'swing': this.noise(.16, { freq: 3200, to: 900, vol: .22, q: 2.2 });
                    this.tone(520, .10, { type: 'triangle', slide: 240, vol: .10 }); break;
      case 'hit':   this.noise(.14, { freq: 1500, to: 200, vol: .30, q: .9 });
                    this.tone(150, .13, { type: 'square', slide: 60, vol: .20 }); break;
      case 'crit':  this.noise(.22, { freq: 2400, to: 160, vol: .34, q: .7 });
                    this.tone(180, .20, { type: 'sawtooth', slide: 50, vol: .22 }); break;
      case 'cast':  [660, 880, 1320].forEach((f, i) =>
                      this.tone(f, .30, { type: 'triangle', vol: .13, at: c + i * .035, filter: 4000 })); break;
      case 'rune':  this.tone(900, .28, { type: 'sine', slide: 1500, vol: .16 });
                    this.noise(.20, { freq: 3000, to: 1200, vol: .10, q: 3 }); break;
      case 'aura':  [330, 494, 660, 988].forEach((f, i) =>
                      this.tone(f, .90, { type: 'sine', vol: .12, at: c + i * .06, filter: 2600 })); break;
      case 'hurt':  this.tone(220, .26, { type: 'sawtooth', slide: 70, vol: .24, filter: 1400 });
                    this.noise(.20, { freq: 700, to: 140, vol: .18 }); break;
      case 'heal':  [523, 659, 784, 1046].forEach((f, i) =>
                      this.tone(f, .40, { type: 'sine', vol: .12, at: c + i * .07 })); break;
      case 'pickup':[784, 1047, 1319].forEach((f, i) =>
                      this.tone(f, .16, { type: 'square', vol: .10, at: c + i * .05 })); break;
      case 'check': [392, 523, 659, 784, 1047].forEach((f, i) =>
                      this.tone(f, .60, { type: 'triangle', vol: .11, at: c + i * .09, filter: 3200 })); break;
      case 'die':   [440, 330, 247, 165].forEach((f, i) =>
                      this.tone(f, .50, { type: 'square', vol: .16, at: c + i * .13, filter: 1600 })); break;
      case 'roar':  this.noise(1.15, { freq: 260, to: 55, vol: .42, q: .5, type: 'lowpass' });
                    this.tone(70, 1.10, { type: 'sawtooth', slide: 34, vol: .30, filter: 500 });
                    this.tone(105, .95, { type: 'square', slide: 48, vol: .16, filter: 700 }); break;
      case 'fire':  this.noise(.55, { freq: 1100, to: 260, vol: .30, q: .6, type: 'lowpass' }); break;
      case 'quake': this.noise(.75, { freq: 150, to: 40, vol: .40, q: .4, type: 'lowpass' }); break;
      case 'wing':  this.noise(.26, { freq: 520, to: 180, vol: .16, q: .7, type: 'lowpass' }); break;
      case 'menu':  this.tone(880, .07, { type: 'square', vol: .10 }); break;
      case 'select':this.tone(660, .10, { type: 'square', vol: .13, slide: 1320 }); break;
      case 'page':  this.noise(.14, { freq: 2200, to: 700, vol: .10, q: 2 }); break;
      case 'crystal':
        [1047, 1319, 1568, 2093].forEach((f, i) =>
          this.tone(f, 1.30, { type: 'sine', vol: .15, at: c + i * .12 }));
        this.tone(261, 1.80, { type: 'triangle', vol: .12 }); break;
      case 'transform':
        this.tone(110, 2.20, { type: 'sawtooth', slide: 880, vol: .26, filter: 400, filterTo: 6000 });
        [262, 330, 392, 523, 659, 784, 1047].forEach((f, i) =>
          this.tone(f, 1.60, { type: 'sine', vol: .12, at: c + i * .10 }));
        this.noise(1.70, { freq: 400, to: 4000, vol: .20, q: .8 }); break;
      case 'victory':
        [523, 659, 784, 1047, 1319].forEach((f, i) =>
          this.tone(f, .90, { type: 'triangle', vol: .16, at: c + i * .16, filter: 4000 })); break;
    }
  },

  /* --- música procedural por pistas --- */
  TRACKS: {
    title:  { root: -3, bpm: 74,  wave: 'triangle', arp: [0, 7, 12, 16, 12, 7],
              bass: [0, 0, 5, 7], pad: true, lead: [12, 16, 19, 16, 14, 12, 9, 7] },
    story:  { root: -5, bpm: 62,  wave: 'sine',     arp: [0, 5, 12, 17, 12, 5],
              bass: [0, -5, 3, 5], pad: true, lead: [12, 14, 17, 19, 17, 14, 12, 10] },
    forest: { root: 0,  bpm: 104, wave: 'square',   arp: [0, 3, 7, 10, 12, 10, 7, 3],
              bass: [0, 0, 3, 5, 7, 5, 3, 0], pad: true, lead: [12, 15, 19, 22, 19, 15, 12, 10] },
    boss:   { root: -1, bpm: 138, wave: 'sawtooth', arp: [0, 3, 6, 3, 0, -2, 0, 3],
              bass: [0, 0, 0, 3, 0, 0, -2, -2], pad: true, lead: [12, 13, 15, 18, 15, 13, 12, 8], drums: true },
    dragon: { root: 4,  bpm: 132, wave: 'square',   arp: [0, 4, 7, 12, 16, 12, 7, 4],
              bass: [0, 0, 5, 7, 9, 7, 5, 0], pad: true, lead: [16, 19, 24, 19, 21, 19, 16, 12], drums: true },
    ending: { root: -3, bpm: 66,  wave: 'sine',     arp: [0, 7, 12, 19, 12, 7],
              bass: [0, 0, -3, 4], pad: true, lead: [19, 16, 12, 14, 16, 12, 7, 5] }
  },

  playMusic(name) {
    if (!this.enabled || !this.ctx || this._trackName === name) return;
    this.stopMusic();
    this._trackName = name;
    this._track = this.TRACKS[name];
    if (!this._track) return;
    this._step = 0;
    this._nextTime = this.ctx.currentTime + .06;
    this._timer = setInterval(() => this._schedule(), 45);
  },
  stopMusic() {
    if (this._timer) clearInterval(this._timer);
    this._timer = null; this._track = null; this._trackName = null;
  },
  _freq(semi) { return 110 * Math.pow(2, semi / 12); },

  _schedule() {
    const t = this._track; if (!t || !this.ctx) return;
    const spb = 60 / t.bpm / 2;                     // corcheas
    while (this._nextTime < this.ctx.currentTime + .35) {
      const s = this._step, at = this._nextTime, bar = Math.floor(s / 8);
      const root = t.root;
      // bajo
      const bn = t.bass[s % t.bass.length];
      if (s % 2 === 0)
        this.tone(this._freq(root + bn - 12), spb * 2.1,
          { type: 'triangle', vol: .17, at, bus: this.musicGain, filter: 620 });
      // arpegio
      const an = t.arp[s % t.arp.length];
      this.tone(this._freq(root + an + 12), spb * 1.15,
        { type: t.wave, vol: .052, at, bus: this.musicGain, filter: 2400 });
      // melodía (alternando compases para que respire)
      if (s % 2 === 1 && bar % 2 === 0) {
        const ln = t.lead[Math.floor(s / 2) % t.lead.length];
        this.tone(this._freq(root + ln + 12), spb * 1.9,
          { type: 'triangle', vol: .085, at, bus: this.musicGain, filter: 3400 });
      }
      // colchón armónico
      if (t.pad && s % 8 === 0) {
        [0, 7, 12].forEach(iv => this.tone(this._freq(root + iv), spb * 8.5,
          { type: 'sine', vol: .045, at, atk: .5, bus: this.musicGain, filter: 900 }));
      }
      // percusión
      if (t.drums) {
        if (s % 4 === 0) this.noise(.13, { freq: 110, to: 45, vol: .20, q: .6, type: 'lowpass', at, bus: this.musicGain });
        if (s % 4 === 2) this.noise(.10, { freq: 3200, vol: .10, q: 1.4, at, bus: this.musicGain });
      }
      this._nextTime += spb; this._step++;
    }
  },

  duck(amount = .4, time = .5) {                     // baja la música en cinemáticas
    if (!this.ctx) return;
    this.musicGain.gain.cancelScheduledValues(this.ctx.currentTime);
    this.musicGain.gain.linearRampToValueAtTime(this.musicVol * amount, this.ctx.currentTime + time);
  },
  unduck(time = .8) {
    if (!this.ctx) return;
    this.musicGain.gain.cancelScheduledValues(this.ctx.currentTime);
    this.musicGain.gain.linearRampToValueAtTime(this.musicVol, this.ctx.currentTime + time);
  },
  setMusicVol(v) { this.musicVol = v; if (this.musicGain) this.musicGain.gain.value = v; },
  setSfxVol(v)   { this.sfxVol = v;   if (this.sfxGain)   this.sfxGain.gain.value = v; }
};

/* --------------------------------------------------------------- guardado */
const Save = {
  KEY: 'corazon-de-dragon-v1',
  data: null,
  _fallback: null,           // memoria viva si localStorage está bloqueado (file://)

  def() {
    return {
      checkpoint: 0,          // índice del farol de memoria alcanzado
      lives: 3,
      maxHp: 6, hp: 6,
      maxMp: 100, mp: 100,
      memories: [],           // ecos de memoria recogidos
      bossBeaten: false,
      finished: false,
      deaths: 0,
      time: 0,
      seenIntro: false,
      music: .34, sfx: .40, rumble: true
    };
  },
  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      this.data = raw ? Object.assign(this.def(), JSON.parse(raw)) : this.def();
    } catch (e) { this.data = this._fallback || this.def(); }
    Audio_.setMusicVol(this.data.music); Audio_.setSfxVol(this.data.sfx);
    Input.rumbleOn = this.data.rumble !== false;
    return this.data;
  },
  write() {
    this._fallback = this.data;
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { /* file:// sin permisos */ }
  },
  has() {
    try { return !!localStorage.getItem(this.KEY); } catch (e) { return !!this._fallback; }
  },
  wipe() {
    this.data = this.def(); this._fallback = null;
    try { localStorage.removeItem(this.KEY); } catch (e) {}
  }
};

/* ------------------------------------------------------------ bucle base -- */
/* Paso fijo de 60 Hz con acumulador. El detalle importante es el recorte del
   acumulador: si un fotograma tarda mucho (pestaña en segundo plano, una
   alerta del sistema), el tiempo sobrante se DESCARTA en lugar de acumularse.
   Sin eso el bucle entra en espiral: cada fotograma llega con más retraso del
   que puede recuperar y el juego responde a la entrada con segundos de
   demora.                                                                   */
const Loop = {
  last: 0, acc: 0, fixed: 1 / 60, maxSteps: 5, raf: 0, running: false,
  start(update, render) {
    this.running = true; this.last = performance.now();
    // al volver de segundo plano el reloj se reinicia en vez de ponerse al día
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { this.last = performance.now(); this.acc = 0; }
    });
    const frame = now => {
      if (!this.running) return;
      let dt = (now - this.last) / 1000;
      this.last = now;
      if (dt > .25) dt = .25;
      this.acc += dt;
      // nunca guardes más trabajo del que puedes hacer en un fotograma
      const cap = this.fixed * this.maxSteps;
      if (this.acc > cap) this.acc = cap;
      let steps = 0;
      while (this.acc >= this.fixed && steps++ < this.maxSteps) {
        Input.poll();              // mando antes de simular
        update(this.fixed);
        Input.flush();             // pulsaciones consumidas
        this.acc -= this.fixed;
      }
      render(this.acc / this.fixed);
      this.raf = requestAnimationFrame(frame);
    };
    this.raf = requestAnimationFrame(frame);
  },
  stop() { this.running = false; cancelAnimationFrame(this.raf); }
};

  glyph(ch) { return this.G[ch] || this.MISSING; },
  charWidth(ch) {
    const g = this.glyph(ch);
    return g[1] ? g[1].length : 3;
  },

  /* ancho de una cadena en píxeles del lienzo interno */
  measure(text, scale, extra) {
    scale = scale || 1; extra = extra || 0;
    let w = 0;
    for (const ch of text) w += (this.charWidth(ch) + this.GAP + extra) * scale;
    return Math.max(0, w - (this.GAP + extra) * scale);
  },

  /* --- caché de líneas ya compuestas ---
     Redibujar cada píxel de cada letra en cada fotograma sería costoso, así
     que cada combinación de texto/color/escala se compone una vez en un
     lienzo aparte y luego se estampa de golpe.                             */
  _cache: new Map(),
  _MAXCACHE: 320,

  _render(text, scale, color, extra) {
    const key = text + '|' + scale + '|' + color + '|' + extra;
    const hit = this._cache.get(key);
    if (hit) return hit;

    const w = Math.max(1, this.measure(text, scale, extra));
    const h = (this.LINE + 2) * scale;                 // margen para tildes altas
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    c.fillStyle = color;

    let x = 0;
    const top = 2 * scale;                             // origen de la fila 0
    for (const ch of text) {
      const g = this.glyph(ch);
      const off = g[0];
      for (let r = 1; r < g.length; r++) {
        const row = g[r];
        const py = top + (off + r - 1) * scale;
        for (let i = 0; i < row.length; i++) {
          if (row[i] !== '#') continue;
          c.fillRect(x + i * scale, py, scale, scale);
        }
      }
      x += (this.charWidth(ch) + this.GAP + extra) * scale;
    }

    if (this._cache.size >= this._MAXCACHE) this._cache.clear();
    const entry = { cv, w, h, baseline: top + 7 * scale };
    this._cache.set(key, entry);
    return entry;
  },

  /* Dibuja `text` con la línea base en `y` (como el texto normal del lienzo).
     o = { scale, col, align, extra, shadow, shadowCol, glow, glowSize }     */
  draw(c, text, x, y, o) {
    o = o || {};
    text = String(text);
    if (!text) return 0;
    const scale = Math.max(1, Math.round(o.scale || 1));
    const extra = o.extra || 0;
    const col = o.col || '#ffffff';
    const img = this._render(text, scale, col, extra);

    let px = Math.round(x);
    if (o.align === 'center') px = Math.round(x - img.w / 2);
    else if (o.align === 'right') px = Math.round(x - img.w);
    const py = Math.round(y) - img.baseline;

    if (o.glow) {
      c.save();
      c.shadowColor = o.glow;
      c.shadowBlur = o.glowSize || 8;
      c.drawImage(img.cv, px, py);
      c.drawImage(img.cv, px, py);
      c.restore();
    }
    if (o.shadow !== false) {
      const sh = this._render(text, scale, o.shadowCol || 'rgba(8,4,14,.9)', extra);
      c.drawImage(sh.cv, px + scale, py + scale);
    }
    c.drawImage(img.cv, px, py);
    return img.w;
  }
};

/* =========================================================================
   CORAZÓN DE DRAGÓN — 01-art.js
   Paleta, fábrica de sprites pixel art y dibujo de personajes por partes.
   Todo se genera por código: ni un solo fichero de imagen.
   ========================================================================= */
'use strict';

const PAL = {
  // noche y mundo
  void: '#07040e', deep: '#120b1e', night: '#1c1230', dusk: '#2a1a42', mauve: '#3d2558',
  plum: '#57306e', orchid: '#7a3f86', rose: '#a8497f', blush: '#d46a8c', pink: '#f294b4',
  // luz y fuego
  ember: '#ff8a5c', flame: '#ff5a3c', gold: '#ffce6a', sun: '#ffe9a8', cream: '#fff3d6', white: '#ffffff',
  // naturaleza
  bark: '#3b2a33', bark2: '#553b45', moss: '#2f5a45', leaf: '#4a8f5c', leaf2: '#6fbf72', grass: '#3e7a4e',
  // agua
  deepsea: '#16304e', sea: '#245c7a', aqua: '#3f9fb5', ice: '#a8e6f0',
  // metal
  iron: '#3a3550', iron2: '#5b5674', steel: '#8e8bab', silver: '#d3d1e6',
  // piel
  skin: '#e0a578', skin2: '#c07f56', skinL: '#f3c79a',
  // Leslie
  hairL: '#e8c98b', hairL2: '#c99e5e', hairD: '#6b4a33',
  dress: '#f5e6c8', dress2: '#d9c4a0', terra: '#c9713f',
  // oscuridad
  blood: '#8a1f38', shadow: '#0a0714', vio: '#8b3bd6', vio2: '#c07ff0',
  // cielo diurno (pantalla de título)

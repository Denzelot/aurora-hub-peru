/* =========================================================================
   CORAZÓN DE DRAGÓN — 05-boss.js
   MALAKOR, Señor Dragón Caballero Oscuro.
   Fase 1: caballero. Fase 2: Gran Dragón Oscuro. Fase 3: duelo de dragones.
   Y Leslie, esperando en lo alto de la torre.
   ========================================================================= */
'use strict';

const BOSS_C = {
  armor: '#241a33', armorL: '#3d2b52', armorD: '#140d1e',
  trim: '#8b3bd6', trimL: '#c07ff0',
  cape: '#5a1226', capeL: '#8a1f38', capeD: '#360a17',
  eye: '#ff3a4a', ember: '#c07ff0',
  scale: '#2a1a40', scaleL: '#452a66', scaleD: '#160d24',
  wing: '#3a1d4a', wingL: '#5e2f72', membrane: '#7a2f50',
  horn: '#d8c8e8', claw: '#e8dcf0', belly: '#4a3560'
};

/* =========================================================================
   LESLIE EN LA TORRE — la ves desde el primer instante de la batalla.
   Reacciona a lo que pasa abajo: se lleva las manos al pecho, golpea el
   cristal contra los barrotes, y al final invoca el poder que te salva.
   ========================================================================= */
class TowerLeslie {
  constructor(x, y) {
    this.x = x; this.y = y; this.t = 0;
    this.mood = 'wait';           // wait | worry | hope | summon | free
    this.crystal = false;
    this.glowT = 0;
  }
  update(dt, game) {
    this.t += dt;
    this.glowT = Math.max(0, this.glowT - dt);
    if (this.mood === 'summon' && Math.random() < .5)
      FX.spawn({ x: this.x + U.rand(14, -14), y: this.y - 20 + U.rand(14, -14),
        vx: 0, vy: -20, life: 1, size: 2, col: PAL.gold, col2: PAL.sun, kind: 'holy', glow: 6 });
    else if (Math.random() < .12)
      FX.spawn({ x: this.x + U.rand(10, -10), y: this.y - 16, vx: U.rand(8, -8), vy: -14,
        life: 1.2, size: 1, col: PAL.blush, kind: 'magic', glow: 3 });
  }
  draw(c, camx) {
    // se engancha a la torre del fondo, que crece según avanzas
    const T = World.towerScreen(camx);
    const s = T.s;
    const x = Math.round(T.x);
    const y = Math.round(T.baseY - 150 * s + 46 * s);   // balcón del tercio alto
    if (x < -80 || x > W + 80) return;
    this.sx = x; this.sy = y;                           // lo usa la cinemática del cristal

    // balcón de la torre
    R(c, x - 26 * s, y, 52 * s, 5 * s, '#2a1526');
    R(c, x - 26 * s, y, 52 * s, 1, '#4a2840');
    R(c, x - 22 * s, y - 26 * s, 44 * s, 26 * s, '#1a0d18');            // hueco oscuro
    for (let i = 0; i < 6; i++) R(c, x - 20 * s + i * 8 * s, y - 26 * s, 2 * s, 26 * s, '#3a1f34');
    // arco superior
    R(c, x - 26 * s, y - 32 * s, 52 * s, 7 * s, '#31182c');
    for (let i = 0; i < 7; i++) R(c, x - 26 * s + i * 8 * s, y - 38 * s, 5 * s, 7 * s, '#3a1f34');

    // ella, al otro lado de los barrotes
    c.save();
    c.translate(x, y);
    const st = {
      t: this.t, dir: -1, scale: .8 * s, floating: this.mood === 'summon',
      casting: this.mood === 'summon', crystal: this.crystal, hat: true
    };
    Leslie.draw(c, st);
    c.restore();

    // luz que la envuelve según su estado de ánimo
    const col = this.mood === 'summon' ? 'rgba(255,206,106,.55)'
              : this.mood === 'hope' ? 'rgba(242,148,180,.4)'
              : 'rgba(212,106,140,.28)';
    const r = (this.mood === 'summon' ? 54 + Math.sin(this.t * 5) * 10 : 30 + Math.sin(this.t * 2) * 5) * s;
    glow(c, x, y - 16 * s, r, col, .6);
    if (this.glowT > 0) {
      c.save(); c.globalAlpha = this.glowT;
      c.strokeStyle = PAL.gold; c.lineWidth = 2;
      c.beginPath(); c.arc(x, y - 16 * s, (1 - this.glowT) * 90, 0, TAU); c.stroke();
      c.restore();
    }
  }
}

/* =========================================================================
   MALAKOR — el jefe.
   ========================================================================= */
class Boss {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.phase = 1;
    this.maxHp = 46; this.hp = this.maxHp;
    this.phase2Hp = 60;
    this.w = 30; this.h = 52;
    this.vx = 0; this.vy = 0;
    this.dir = -1; this.t = 0;
    this.alive = true;
    this.state = 'idle'; this.stateT = 0; this.cd = 1.4;
    this.hurtT = 0; this.invT = 0;
    this.onGround = false;
    this.telegraph = 0;          // aviso previo al ataque
    this.transforming = false; this.transformT = 0;
    this.deathT = 0; this.dying = false;
    this.entrance = true; this.entranceT = 0;
    this.attackName = '';
    this.combo = 0;
    this.stagger = 0;            // aturdimiento tras encajar mucho daño
    this.dmgWindow = 0;
    this.leslieCallDone = false;
  }

  get box() {
    if (this.phase === 1) return { x: this.x - this.w / 2, y: this.y - this.h, w: this.w, h: this.h };
    return { x: this.x - 46, y: this.y - 76, w: 92, h: 76 };
  }
  get cx() { return this.x; }
  get cy() { return this.y - (this.phase === 1 ? this.h / 2 : 40); }
  get hpPct() { return this.hp / (this.phase === 1 ? this.maxHp : this.phase2Hp); }

  /* ------------------------------------------------------------- daño --- */
  hurt(dmg, fromX, game) {
    if (!this.alive || this.invT > 0 || this.transforming || this.entrance) return;
    this.hp -= dmg;
    this.hurtT = .14;
    this.dmgWindow += dmg;
    FX.text(this.cx, this.y - this.h - 10, String(dmg), PAL.sun, 8);
    FX.sparks(fromX < this.cx ? this.box.x + 4 : this.box.x + this.box.w - 4, this.cy, fromX < this.cx ? 1 : -1, 8);
    Audio_.sfx('hit');

    // acumular daño lo hace tambalearse: recompensa la agresividad
    if (this.dmgWindow >= 9) {
      this.dmgWindow = 0;
      this.stagger = 1.1;
      this.state = 'stagger'; this.stateT = 0;
      FX.ring(this.cx, this.cy, { col: BOSS_C.trimL, speed: 260, life: .5, width: 2 });
      Cam.shake(3, .3);
    }

    if (this.hp <= 0) {
      if (this.phase === 1) game.beginBossTransformation();
      else this.beginDeath(game);
    }
  }

  beginDeath(game) {
    this.dying = true; this.deathT = 0;
    this.state = 'dying';
    this.invT = 99;
    Audio_.sfx('roar');
    Cam.shake(6, 1.2);
    Screen.flash('#fff', .4);
    game.onBossDefeated();
  }

  /* ------------------------------------------------- cambio de fase ----- */
  startPhase2() {
    this.phase = 2;
    this.hp = this.phase2Hp;
    this.transforming = true; this.transformT = 0;
    this.state = 'transform';
    this.invT = 99;
    this.y = Math.min(this.y, 196);
    Audio_.sfx('roar');
  }
  finishPhase2() {
    this.transforming = false;
    this.invT = 0;
    this.state = 'fly'; this.stateT = 0; this.cd = 1.2;
    this.dmgWindow = 0;
  }

  /* ------------------------------------------------------ actualización -- */
  update(dt, game) {
    if (!this.alive) return;
    this.t += dt;
    this.hurtT = Math.max(0, this.hurtT - dt);
    if (this.invT < 90) this.invT = Math.max(0, this.invT - dt);
    this.stateT += dt;
    this.telegraph = Math.max(0, this.telegraph - dt);
    this.stagger = Math.max(0, this.stagger - dt);

    if (this.dying) { this.updateDying(dt, game); return; }
    if (this.entrance) { this.updateEntrance(dt, game); return; }
    if (this.transforming) { this.updateTransform(dt, game); return; }

    const p = game.player;
    const dx = p.cx - this.cx, dy = p.cy - this.cy;
    if (!this.dying && Math.abs(dx) > 6) this.dir = U.sign(dx);

    if (this.phase === 1) this.updateKnight(dt, game, dx, dy);
    else this.updateDragon(dt, game, dx, dy);

    // el cuerpo daña al contacto
    if (!p.dead && !p.dragonForm && U.aabb(this.box, p.box) && this.state !== 'stagger')
      p.hurt(this.phase === 1 ? 1 : 2, this.cx, game);
  }

  /* ---------------------------------------------------- entrada épica --- */
  updateEntrance(dt, game) {
    this.entranceT += dt;
    if (this.entranceT < 1.2) {
      this.y = U.lerp(-60, 200, U.ease.inCubic(this.entranceT / 1.2));
    } else if (this.entranceT < 1.35) {
      if (!this._landed) {
        this._landed = true;
        this.y = 200;
        Cam.shake(7, .8);
        Screen.flash('rgba(139,59,214,.5)', .3);
        Audio_.sfx('quake');
        FX.ring(this.cx, this.y, { col: BOSS_C.trimL, speed: 520, life: .8, width: 4, squash: .35 });
        FX.burst(this.cx, this.y, 34, { col: BOSS_C.armorL, col2: BOSS_C.trim, life: 1, speed: 220, lift: 60 });
        FX.gore(this.cx, this.y, 16, '#3a2a20');
      }
    } else if (this.entranceT > 2.6) {
      this.entrance = false;
      this.state = 'idle'; this.cd = .9;
      Audio_.sfx('roar');
    }
  }

  /* ================================================= FASE 1 · CABALLERO -- */
  updateKnight(dt, game, dx, dy) {
    const dist = Math.abs(dx);

    // gravedad y suelo
    this.vy = Math.min(this.vy + GRAV * dt, MAXFALL);
    this.y += this.vy * dt;
    const s = World.solidAt(this.box);
    if (s && this.vy > 0) { this.y = s.y - .01; this.vy = 0; this.onGround = true; }
    else this.onGround = false;
    this.x = U.clamp(this.x + this.vx * dt, game.arenaLock.x + 24, game.arenaLock.x + game.arenaLock.w - 24);

    if (this.state === 'stagger') {
      this.vx = U.approach(this.vx, 0, 400 * dt);
      if (this.stateT > 1.1) { this.state = 'idle'; this.cd = .5; }
      return;
    }

    this.cd -= dt;

    switch (this.state) {
      case 'idle': {
        // se acerca caminando, con paso pesado
        this.vx = U.approach(this.vx, dist > 56 ? this.dir * 54 : 0, 300 * dt);
        if (this.onGround && Math.abs(this.vx) > 30 && Math.random() < .06)
          FX.dust(this.x, this.y, 2, '#4a3a55');
        if (this.cd <= 0) this.pickKnightAttack(game, dist, dy);
        break;
      }
      case 'slash': {            // tajo pesado en dos tiempos
        this.vx = U.approach(this.vx, 0, 500 * dt);
        if (this.stateT > .55 && !this._did) {
          this._did = true;
          const hb = { x: this.dir > 0 ? this.x : this.x - 46, y: this.y - 44, w: 46, h: 44 };
          if (U.aabb(hb, game.player.box)) game.player.hurt(2, this.cx, game);
          FX.ring(this.x + this.dir * 24, this.y - 22, { col: BOSS_C.trimL, speed: 300, life: .35, width: 3 });
          FX.burst(this.x + this.dir * 24, this.y - 22, 14, { col: BOSS_C.trim, life: .5, speed: 170, glow: 6 });
          Cam.shake(3, .25); Audio_.sfx('crit');
          // onda rasante que recorre el suelo
          game.projectiles.push(new Projectile(this.x + this.dir * 28, this.y - 8, this.dir * 220, 0,
            { team: 'enemy', dmg: 1, kind: 'darkfire', life: 1.6, w: 14, h: 14 }));
        }
        if (this.stateT > .95) { this.state = 'idle'; this.cd = .75; this._did = false; }
        break;
      }
      case 'lunge': {            // estocada veloz
        if (this.stateT < .45) this.vx = U.approach(this.vx, 0, 600 * dt);
        else if (this.stateT < .75) {
          this.vx = this.dir * 330;
          if (Math.random() < .6)
            FX.spawn({ x: this.cx, y: this.cy + U.rand(18, -18), vx: -this.dir * 40, vy: 0,
              life: .3, size: 3, col: 'rgba(139,59,214,.7)', kind: 'smoke' });
          const hb = { x: this.x - 16, y: this.y - 46, w: 32, h: 46 };
          if (U.aabb(hb, game.player.box)) game.player.hurt(2, this.cx, game);
        } else this.vx = U.approach(this.vx, 0, 700 * dt);
        if (this.stateT > 1.05) { this.state = 'idle'; this.cd = .8; }
        break;
      }
      case 'volley': {           // tres lanzas de fuego oscuro
        this.vx = U.approach(this.vx, 0, 500 * dt);
        if (this.stateT > .5 && this._shots < 3 && this.stateT > .5 + this._shots * .18) {
          this._shots++;
          const a = Math.atan2(game.player.cy - this.cy, game.player.cx - this.cx);
          game.projectiles.push(new Projectile(this.cx + this.dir * 16, this.cy - 6,
            Math.cos(a) * 240, Math.sin(a) * 240,
            { team: 'enemy', dmg: 1, kind: 'darkfire', life: 2.2, w: 10, h: 10 }));
          Audio_.sfx('fire');
          FX.magic(this.cx + this.dir * 16, this.cy - 6, 6, BOSS_C.trimL);
        }
        if (this.stateT > 1.25) { this.state = 'idle'; this.cd = .9; this._shots = 0; }
        break;
      }
      case 'leap': {             // salto y golpe sísmico
        if (this.stateT < .35) this.vx = 0;
        else if (this.stateT < .4 && !this._jumped) {
          this._jumped = true;
          this.vy = -380; this.vx = this.dir * 120;
        } else if (this._jumped && this.onGround && this.stateT > .5) {
          this._jumped = false;
          this.state = 'idle'; this.cd = 1;
          Cam.shake(6, .5); Audio_.sfx('quake');
          Screen.flash('rgba(139,59,214,.3)', .18);
          FX.ring(this.x, this.y, { col: BOSS_C.trimL, speed: 480, life: .6, width: 3, squash: .3 });
          FX.dust(this.x, this.y, 18, '#5a4a66');
          // dos ondas que se alejan por el suelo
          [-1, 1].forEach(d => game.projectiles.push(
            new Projectile(this.x + d * 20, this.y - 8, d * 200, 0,
              { team: 'enemy', dmg: 1, kind: 'darkfire', life: 1.5, w: 13, h: 13 })));
          if (Math.abs(game.player.x - this.x) < 60 && game.player.onGround)
            game.player.hurt(1, this.cx, game);
        }
        if (this.stateT > 3) { this.state = 'idle'; this.cd = 1; this._jumped = false; }
        break;
      }
      case 'summon': {           // llama a sus siervos
        this.vx = 0;
        if (this.stateT > .6 && !this._did) {
          this._did = true;
          for (let i = 0; i < 2; i++) {
            const ex = this.x + (i === 0 ? -70 : 70);
            const e = new Enemy(U.clamp(ex, game.arenaLock.x + 20, game.arenaLock.x + game.arenaLock.w - 20), 190, 'imp');
            e.awake = true;
            game.enemies.push(e);
            FX.burst(e.x, e.y - 10, 16, { col: BOSS_C.trim, life: .6, speed: 140, glow: 6, kind: 'magic' });
            FX.ring(e.x, e.y, { col: BOSS_C.trimL, speed: 260, life: .4, width: 2, squash: .4 });
          }
          Audio_.sfx('cast');
        }
        if (this.stateT > 1.2) { this.state = 'idle'; this.cd = 1.1; this._did = false; }
        break;
      }
    }
  }

  pickKnightAttack(game, dist, dy) {
    this.stateT = 0; this._did = false; this._shots = 0; this._jumped = false;
    const low = this.hpPct < .45;
    const pool = [];
    if (dist < 64) pool.push('slash', 'slash', 'leap');
    if (dist >= 50 && dist < 170) pool.push('lunge', 'volley');
    if (dist >= 140) pool.push('volley', 'leap');
    if (low) pool.push('summon', 'volley', 'lunge');
    if (game.enemies.filter(e => e.alive).length > 2) {
      const i = pool.indexOf('summon'); if (i >= 0) pool.splice(i, 1);
    }
    this.state = pool.length ? U.choose(pool) : 'slash';
    this.telegraph = .45;
    this.attackName = { slash: 'TAJO DE CENIZA', lunge: 'ESTOCADA DEL OCASO',
      volley: 'LANZAS DE FUEGO OSCURO', leap: 'IMPACTO SÍSMICO', summon: 'LLAMADA DE SIERVOS' }[this.state];
    Audio_.sfx(this.state === 'summon' ? 'cast' : 'swing');
  }

  /* ============================= TRANSFORMACIÓN A GRAN DRAGÓN OSCURO ==== */
  updateTransform(dt, game) {
    this.transformT += dt;
    const T = this.transformT;
    this.vx = 0;
    if (T < 2.4) {
      // la armadura se resquebraja y el cuerpo crece
      if (Math.random() < .8) {
        const a = U.rand(TAU);
        FX.spawn({ x: this.cx + Math.cos(a) * 20, y: this.cy + Math.sin(a) * 26,
          vx: Math.cos(a) * 90, vy: Math.sin(a) * 90 - 40, life: .8, size: 3,
          col: BOSS_C.armorL, col2: BOSS_C.trim, grav: 200, kind: 'shard', spin: U.rand(10, -10) });
      }
      if (Math.random() < .25) FX.bolt(this.cx + U.rand(50, -50), this.cy - 60, this.cx, this.cy,
        { col: BOSS_C.trimL, col2: PAL.white, width: 2, life: .2 });
      Cam.shake(1.6 + T, .2);
      if (T > 1.2 && !this._roar) { this._roar = true; Audio_.sfx('roar'); }
    } else if (T < 3.1) {
      if (!this._flash) {
        this._flash = true;
        Screen.flash('rgba(200,150,255,.85)', .5);
        Cam.shake(8, 1);
        Audio_.sfx('roar');
        FX.ring(this.cx, this.cy, { col: PAL.white, speed: 700, life: 1, width: 5 });
        FX.ring(this.cx, this.cy, { col: BOSS_C.trimL, speed: 480, life: 1.2, width: 3 });
        FX.burst(this.cx, this.cy, 60, { col: BOSS_C.trim, col2: PAL.vio2, life: 1.4, speed: 320, glow: 8 });
      }
    } else {
      this.finishPhase2();
      this._flash = false; this._roar = false;
    }
  }

  /* ================================================= FASE 2 · DRAGÓN ---- */
  updateDragon(dt, game, dx, dy) {
    const p = game.player;
    const dist = Math.hypot(dx, dy);
    this.cd -= dt;

    if (this.state === 'stagger') {
      this.vx = U.approach(this.vx, 0, 300 * dt);
      this.vy = U.approach(this.vy, 30, 200 * dt);
      this.x += this.vx * dt; this.y = U.clamp(this.y + this.vy * dt, 110, 208);
      if (this.stateT > 1.1) { this.state = 'fly'; this.cd = .5; }
      return;
    }

    switch (this.state) {
      case 'fly': {
        // planea sobre la arena buscando posición
        const ty = 150 + Math.sin(this.t * .9) * 26;
        this.vy = U.damp(this.vy, (ty - this.y) * 2, 3, dt);
        const want = p.cx + (this.dir > 0 ? -90 : 90);
        this.vx = U.damp(this.vx, U.clamp((want - this.x) * 1.6, -110, 110), 2.5, dt);
        if (Math.random() < .02) Audio_.sfx('wing');
        if (this.cd <= 0) this.pickDragonAttack(game, dist, dx);
        break;
      }
      case 'breath': {           // aliento de fuego oscuro en abanico
        this.vx = U.approach(this.vx, 0, 300 * dt);
        this.vy = U.approach(this.vy, 0, 200 * dt);
        if (this.stateT > .7 && this.stateT < 1.9) {
          if (!this._bt || this._bt <= 0) {
            this._bt = .05;
            const mx = this.x + this.dir * 44, my = this.y - 52;
            const spread = Math.sin(this.stateT * 5) * .45;
            const a = Math.atan2(p.cy - my, p.cx - mx) + spread;
            game.projectiles.push(new Projectile(mx, my, Math.cos(a) * U.rand(330, 260), Math.sin(a) * U.rand(330, 260),
              { team: 'enemy', dmg: 1, kind: 'darkfire', life: 1.1, w: 11, h: 11 }));
            if (Math.random() < .3) Audio_.sfx('fire');
            FX.burst(mx, my, 2, { col: PAL.vio2, col2: PAL.vio, life: .4, speed: 90, glow: 6, kind: 'fire' });
          }
          this._bt -= dt;
        }
        if (this.stateT > 2.2) { this.state = 'fly'; this.cd = 1.1; }
        break;
      }
      case 'swoop': {            // embestida rasante
        if (this.stateT < .6) {
          this.vy = U.damp(this.vy, -70, 3, dt);
          this.vx = U.approach(this.vx, 0, 200 * dt);
        } else if (this.stateT < 1.5) {
          const a = Math.atan2(p.cy - this.cy, p.cx - this.cx);
          this.vx = U.damp(this.vx, Math.cos(a) * 300, 4, dt);
          this.vy = U.damp(this.vy, Math.sin(a) * 300, 4, dt);
          if (Math.random() < .5)
            FX.spawn({ x: this.cx + U.rand(30, -30), y: this.cy + U.rand(24, -24), vx: 0, vy: 0,
              life: .35, size: 4, col: 'rgba(90,40,120,.55)', kind: 'smoke' });
        } else { this.state = 'fly'; this.cd = .9; }
        break;
      }
      case 'meteor': {           // lluvia de brasas desde lo alto
        this.vy = U.damp(this.vy, (110 - this.y) * 2, 3, dt);
        this.vx = U.approach(this.vx, 0, 200 * dt);
        if (this.stateT > .8 && this.stateT < 2.6) {
          if (!this._mt || this._mt <= 0) {
            this._mt = .17;
            const mx = game.arenaLock.x + U.rand(game.arenaLock.w - 40, 40);
            game.projectiles.push(new Projectile(mx, 60, U.rand(30, -30), 200,
              { team: 'enemy', dmg: 1, kind: 'darkfire', life: 2.4, w: 11, h: 11, grav: 120 }));
            // marca de aviso en el suelo
            FX.ring(mx, 198, { col: PAL.vio2, speed: -40, r0: 18, life: .8, width: 1, squash: .3, alpha: .5 });
          }
          this._mt -= dt;
        }
        if (this.stateT > 3) { this.state = 'fly'; this.cd = 1.2; }
        break;
      }
      case 'roar': {             // rugido que empuja y aturde
        this.vx = U.approach(this.vx, 0, 400 * dt);
        if (this.stateT > .6 && !this._did) {
          this._did = true;
          Audio_.sfx('roar');
          Cam.shake(5, .8);
          Screen.flash('rgba(139,59,214,.28)', .25);
          for (let i = 0; i < 4; i++)
            setTimeout(() => FX.ring(this.cx, this.cy, { col: PAL.vio2, speed: 380, life: .7, width: 2 }), i * 90);
          if (Math.abs(p.cx - this.cx) < 150) {
            p.vx = U.sign(p.cx - this.cx) * 260; p.vy = -140;
            p.hurt(1, this.cx, game);
          }
        }
        if (this.stateT > 1.5) { this.state = 'fly'; this.cd = 1; this._did = false; }
        break;
      }
      case 'claw': {             // barrido de garra
        const a = Math.atan2(p.cy - this.cy, p.cx - this.cx);
        if (this.stateT < .5) { this.vx = U.approach(this.vx, 0, 300 * dt); }
        else if (this.stateT < .8) {
          this.vx = Math.cos(a) * 200; this.vy = Math.sin(a) * 120;
          const hb = { x: this.x + this.dir * 20 - 30, y: this.y - 70, w: 60, h: 60 };
          if (U.aabb(hb, p.box) && !this._did) { this._did = true; p.hurt(2, this.cx, game); }
          if (Math.random() < .7) FX.sparks(this.x + this.dir * 40, this.y - 40, this.dir, 3);
        } else { this.state = 'fly'; this.cd = .8; this._did = false; }
        break;
      }
    }

    this.x = U.clamp(this.x + this.vx * dt, game.arenaLock.x + 50, game.arenaLock.x + game.arenaLock.w - 50);
    this.y = U.clamp(this.y + this.vy * dt, 96, 210);
  }

  pickDragonAttack(game, dist, dx) {
    this.stateT = 0; this._did = false; this._bt = 0; this._mt = 0;
    const low = this.hpPct < .5;
    const pool = ['breath', 'swoop', 'claw'];
    if (low) pool.push('meteor', 'roar', 'breath');
    if (dist > 140) pool.push('breath', 'meteor');
    if (dist < 80) pool.push('claw', 'roar');
    this.state = U.choose(pool);
    this.telegraph = .6;
    this.attackName = { breath: 'ALIENTO DEL OCASO', swoop: 'CAÍDA DEL TIRANO',
      meteor: 'LLUVIA DE CENIZAS', roar: 'RUGIDO DEVASTADOR', claw: 'GARRA NEGRA' }[this.state];
  }

  /* --------------------------------------------------------- agonía ----- */
  updateDying(dt, game) {
    this.deathT += dt;
    this.vy += GRAV * .4 * dt;
    this.y = Math.min(this.y + this.vy * dt, 206);
    if (Math.random() < .9) {
      const a = U.rand(TAU);
      FX.spawn({ x: this.cx + Math.cos(a) * U.rand(50), y: this.cy + Math.sin(a) * U.rand(40),
        vx: Math.cos(a) * 60, vy: -U.rand(90, 20), life: U.rand(1.4, .5), size: 3,
        col: BOSS_C.trim, col2: PAL.vio2, kind: 'magic', glow: 6 });
    }
    if (Math.random() < .12) {
      Cam.shake(2, .2);
      FX.burst(this.cx + U.rand(50, -50), this.cy + U.rand(30, -30), 10,
        { col: PAL.white, col2: BOSS_C.trimL, life: .5, speed: 150, glow: 7 });
    }
    if (this.deathT > 3.2) {
      this.alive = false;
      Screen.flash('#fff', .9);
      FX.ring(this.cx, this.cy, { col: PAL.white, speed: 900, life: 1.4, width: 6 });
      FX.burst(this.cx, this.cy, 80, { col: PAL.cream, col2: PAL.gold, life: 2, speed: 340, glow: 9 });
      Cam.shake(9, 1.4);
    }
  }

  /* ============================================================ dibujo == */
  draw(c, camx) {
    if (!this.alive) return;
    const x = Math.round(this.x - camx), y = Math.round(this.y);

    // sombra
    c.save(); c.globalAlpha = .32;
    ell(c, x, 200, this.phase === 1 ? 16 : 40, this.phase === 1 ? 3 : 5, '#000');
    c.restore();

    // aviso de ataque: aura que pulsa antes de golpear
    if (this.telegraph > 0) {
      const k = this.telegraph / .6;
      glow(c, x, y - (this.phase === 1 ? 26 : 40), (this.phase === 1 ? 44 : 80) * (1 + (1 - k) * .3),
        'rgba(255,60,80,' + (.35 * k) + ')', .8);
    }

    c.save();
    c.translate(x, y);
    if (this.transforming) {
      const k = U.clamp(this.transformT / 2.4, 0, 1);
      c.scale(1 + k * .5, 1 + k * .5);
      c.globalAlpha = this.transformT > 2.4 ? Math.max(0, 1 - (this.transformT - 2.4) * 3) : 1;
    }
    if (this.dying) c.globalAlpha = Math.max(0, 1 - this.deathT / 3.4);

    if (this.phase === 1 || this.transforming) this.drawKnight(c);
    else this.drawDarkDragon(c);
    c.restore();

    // destello al recibir daño
    if (this.hurtT > 0) {
      const b = this.box;
      c.save();
      c.globalAlpha = this.hurtT / .14 * .55;
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = 'rgba(255,200,210,.9)';
      c.fillRect(Math.round(b.x - camx), Math.round(b.y), b.w, b.h);
      c.restore();
    }
  }

  /* --- Caballero Oscuro: armadura, capa carmesí y espadón --- */
  drawKnight(c) {
    const C = BOSS_C, t = this.t, dir = this.dir;
    c.save(); c.scale(dir, 1);
    const breath = Math.sin(t * 2) * .7;
    const walk = Math.abs(this.vx) > 20 ? 1 : 0;
    const ph = t * 8;

    /* capa desgarrada */
    for (let i = 0; i < 16; i++) {
      const p = i / 15;
      const sway = Math.sin(t * 4 - p * 3) * (2 + p * 6) + this.vx * .02;
      const wid = 12 - p * 7;
      R(c, -9 - sway * .5 - wid * .3, -46 + i * 2.6, wid, 3,
        i < 3 ? C.capeL : (i > 12 ? C.capeD : C.cape));
      if (i > 12 && i % 2) R(c, -9 - sway * .5, -46 + i * 2.6, 2, 3, C.capeD);
    }

    /* piernas acorazadas */
    const la = walk ? Math.sin(ph) * .6 : .12;
    const lb = walk ? Math.sin(ph + Math.PI) * .6 : -.12;
    limb(c, -4, -24, 16, Math.PI / 2 + lb, 5, C.armorD);
    limb(c, 3, -24, 16, Math.PI / 2 + la, 5, C.armor);
    R(c, -8, -4, 9, 4, C.armorD);
    R(c, 1, -4, 9, 4, C.armorL);

    /* torso enorme */
    R(c, -10, -46, 20, 24, C.armor);
    R(c, -10, -46, 20, 3, C.armorL);
    R(c, -10, -25, 20, 3, C.armorD);
    R(c, 6, -44, 4, 20, C.armorD);
    // emblema de dragón en el peto
    R(c, -3, -40, 6, 9, C.trim);
    R(c, -2, -38, 4, 5, C.armorD);
    R(c, -1, -42, 2, 3, C.trimL);
    glow(c, 0, -36, 13, 'rgba(139,59,214,.45)', .55);
    // cinturón y faldón
    R(c, -11, -26, 22, 4, C.armorD);
    R(c, -9, -23, 18, 5, C.armor);

    /* hombreras con púas */
    R(c, -15, -48, 8, 8, C.armorL);
    R(c, -15, -48, 8, 2, C.trim);
    tri(c, -15, -48, -19, -56, -11, -49, C.armorD);
    R(c, 7, -48, 8, 8, C.armorL);
    R(c, 7, -48, 8, 2, C.trim);
    tri(c, 15, -48, 19, -56, 11, -49, C.armorD);

    /* brazo izquierdo (fondo) */
    limb(c, -9, -42, 14, Math.PI / 2 + (walk ? Math.sin(ph + Math.PI) * .5 : .2), 4, C.armorD);

    /* yelmo con cuernos de dragón */
    const hy = -60 + breath * .4;
    R(c, -7, hy, 14, 14, C.armor);
    R(c, -7, hy, 14, 3, C.armorL);
    R(c, -7, hy + 6, 14, 3, C.armorD);          // visera
    R(c, -5, hy + 6, 4, 2, C.eye);              // ojos ardientes
    R(c, 1, hy + 6, 4, 2, C.eye);
    glow(c, 0, hy + 7, 16, 'rgba(255,58,74,.6)', .7);
    R(c, -7, hy + 10, 14, 4, C.armorL);         // mentonera
    for (let i = 0; i < 5; i++) R(c, -6 + i * 3, hy + 11, 2, 3, C.armorD);
    // cuernos
    tri(c, -7, hy + 2, -17, hy - 12, -4, hy - 1, C.armorD);
    tri(c, -6, hy + 1, -14, hy - 9, -4, hy - 1, C.armorL);
    tri(c, 7, hy + 2, 17, hy - 12, 4, hy - 1, C.armorD);
    tri(c, 6, hy + 1, 14, hy - 9, 4, hy - 1, C.armorL);
    // cresta
    for (let i = 0; i < 4; i++) tri(c, -2 + i, hy - 1, 1 + i, hy - 1, -1 + i, hy - 6 - i, C.trim);

    /* brazo derecho + espadón */
    let arm = Math.PI / 2 - .3, sw = -.7;
    if (this.state === 'slash') {
      const p = U.clamp(this.stateT / .95, 0, 1);
      if (p < .55) { arm = U.lerp(Math.PI / 2 - .3, -1.7, p / .55); sw = U.lerp(-.7, -2.5, p / .55); }
      else { arm = U.lerp(-1.7, 1.0, (p - .55) / .45); sw = U.lerp(-2.5, 1.1, (p - .55) / .45); }
    } else if (this.state === 'lunge') {
      arm = -.15; sw = -.15;
    } else if (this.state === 'volley' || this.state === 'summon') {
      arm = -1.5; sw = -1.6;
    } else if (this.state === 'leap') {
      arm = -1.9; sw = -2.1;
    } else if (this.state === 'stagger') {
      arm = Math.PI / 2 + .5; sw = 1.2;
    }
    limb(c, 6, -42, 14, arm, 4, C.armorL, C.armorD);
    const hx = 6 + Math.cos(arm) * 14, hhy = -42 + Math.sin(arm) * 14;
    R(c, Math.round(hx) - 2, Math.round(hhy) - 2, 5, 5, C.armorD);
    this.greatsword(c, hx, hhy, sw);

    c.restore();
  }

  /* espadón con brasas violetas */
  greatsword(c, x, y, ang) {
    const C = BOSS_C;
    R(c, Math.round(x) - 4, Math.round(y) - 2, 9, 4, C.armorD);       // guarda
    limb(c, x, y, 30, ang, 4, C.armorL);
    limb(c, x + Math.cos(ang) * 2, y + Math.sin(ang) * 2, 28, ang, 2, C.trim);
    limb(c, x + Math.cos(ang) * 3, y + Math.sin(ang) * 3, 26, ang, 1, C.trimL);
    const tx = x + Math.cos(ang) * 30, ty = y + Math.sin(ang) * 30;
    glow(c, tx, ty, 14, 'rgba(139,59,214,.5)', .6);
    if (Math.random() < .3)
      FX.spawn({ x: this.x + tx * this.dir, y: this.y + ty, vx: U.rand(20, -20), vy: -25,
        life: .6, size: 2, col: PAL.vio2, kind: 'fire', glow: 5 });
  }

  /* --- Gran Dragón Oscuro: la forma verdadera --- */
  drawDarkDragon(c) {
    const C = BOSS_C, t = this.t, dir = this.dir;
    c.save(); c.scale(dir, 1);
    const flap = Math.sin(t * 4.5);
    const hover = Math.sin(t * 1.6) * 2;
    const y0 = hover;
    const atk = this.state === 'breath' || this.state === 'claw';

    /* ala trasera */
    const wa = -.5 + flap * .8;
    const wr = 66;
    tri(c, -14, y0 - 58, -14 - Math.cos(wa) * wr, y0 - 58 + Math.sin(wa) * wr * .85, -8, y0 - 22, C.wing);
    tri(c, -14, y0 - 58, -14 - Math.cos(wa + .3) * wr * .7, y0 - 52 + Math.sin(wa + .3) * wr * .6, -8, y0 - 30, C.membrane);

    /* cola con púas */
    for (let i = 0; i < 18; i++) {
      const p = i / 17;
      const tx = -22 - i * 4.2;
      const ty = y0 - 48 + Math.sin(t * 3 - p * 4) * 10 * p + p * 22;
      const s = 7 - p * 5.6;
      ell(c, tx, ty, s, s, p > .6 ? C.scaleD : C.scale);
      if (i % 3 === 0 && i > 3) tri(c, tx, ty - s, tx + 3, ty - s, tx + 1, ty - s - 6 + p * 4, C.horn);
    }

    /* cuerpo */
    ell(c, -4, y0 - 46, 26, 20, C.scale);
    ell(c, -2, y0 - 40, 20, 13, C.belly);
    ell(c, -8, y0 - 54, 22, 12, C.scaleD);
    // placas del vientre
    for (let i = 0; i < 6; i++) R(c, -14 + i * 6, y0 - 36, 5, 3, C.scaleL);

    /* patas traseras y garras */
    limb(c, -12, y0 - 30, 24, Math.PI / 2 + .35, 7, C.scaleD);
    limb(c, 10, y0 - 30, 24, Math.PI / 2 - .12, 7, C.scale);
    R(c, -22, y0 - 6, 13, 5, C.claw);
    R(c, 6, y0 - 6, 13, 5, C.claw);
    for (let i = 0; i < 3; i++) {
      tri(c, -22 + i * 4, y0 - 1, -20 + i * 4, y0 - 1, -21 + i * 4, y0 + 4, C.claw);
      tri(c, 6 + i * 4, y0 - 1, 8 + i * 4, y0 - 1, 7 + i * 4, y0 + 4, C.claw);
    }

    /* cuello largo */
    const neck = Math.sin(t * 2.2) * 3 + (atk ? 5 : 0);
    for (let i = 0; i < 10; i++) {
      const p = i / 9;
      ell(c, 16 + i * 3.1, y0 - 58 - i * 2.6 + neck * p, 8 - p * 3.5, 7 - p * 3, C.scale);
      if (i % 2 === 0) tri(c, 14 + i * 3.1, y0 - 64 - i * 2.6 + neck * p,
        18 + i * 3.1, y0 - 64 - i * 2.6 + neck * p, 16 + i * 3.1, y0 - 72 - i * 2.6 + neck * p, C.horn);
    }

    /* cabeza */
    const hx = 48, hy = y0 - 84 + neck;
    ell(c, hx, hy, 14, 9, C.scale);
    R(c, hx + 6, hy - 2, 14, 7, C.scaleL);          // hocico
    R(c, hx + 17, hy, 5, 4, C.scaleD);
    // dientes
    for (let i = 0; i < 5; i++) tri(c, hx + 7 + i * 3, hy + 4, hx + 9 + i * 3, hy + 4, hx + 8 + i * 3, hy + 9, C.horn);
    // ojo carmesí
    R(c, hx + 1, hy - 5, 6, 3, C.eye);
    R(c, hx + 3, hy - 5, 2, 2, PAL.white);
    glow(c, hx + 3, hy - 4, 16, 'rgba(255,58,74,.65)', .75);
    // cuernos coronados
    tri(c, hx - 5, hy - 7, hx - 20, hy - 30, hx - 1, hy - 8, C.horn);
    tri(c, hx - 10, hy - 5, hx - 28, hy - 22, hx - 6, hy - 7, C.horn);
    tri(c, hx - 2, hy - 8, hx - 6, hy - 24, hx + 2, hy - 8, C.scaleD);
    // brasas en la garganta al preparar el aliento
    if (this.state === 'breath' && this.stateT > .3 && this.stateT < .75) {
      const k = (this.stateT - .3) / .45;
      glow(c, hx + 14, hy + 1, 8 + k * 16, 'rgba(192,127,240,.8)', .85);
      R(c, hx + 12, hy - 1, 6, 4, PAL.vio2);
    }

    /* ala delantera */
    const wf = -.65 + flap * .95;
    const wr2 = 78;
    tri(c, 4, y0 - 62, 4 - Math.cos(wf) * wr2, y0 - 62 + Math.sin(wf) * wr2 * .9, 14, y0 - 20, C.wingL);
    tri(c, 4, y0 - 62, 4 - Math.cos(wf + .25) * wr2 * .72, y0 - 56 + Math.sin(wf + .25) * wr2 * .65, 12, y0 - 30, C.membrane);
    // varillas del ala
    for (let i = 0; i < 4; i++) {
      const a = wf + i * .22;
      limb(c, 4, y0 - 62, wr2 * (1 - i * .12), a, 1, C.scaleD);
    }
    c.restore();
    glow(c, 0, -50, 70, 'rgba(139,59,214,.22)', .5);
  }
}

/* ===== 06-ui.js ===== */
/* =========================================================================
   CORAZÓN DE DRAGÓN — 06-ui.js
   HUD, menús, pantallas de carga, diálogos, retratos y mapa de controles.
   ========================================================================= */
'use strict';

/* ------------------------------------------------------------ tipografía */
/* Todo el texto pasa por la fuente de mapa de bits (00b-font.js): a esta
   resolución una fuente vectorial se emborrona al escalar el lienzo.
   `size` se conserva como medida cómoda y se traduce a una escala entera,
   porque media escala volvería a producir píxeles desiguales.              */
function fontScale(size) {
  if (size >= 25) return 4;
  if (size >= 16) return 3;
  if (size >= 11) return 2;
  return 1;
}
/* alto de línea recomendado para un tamaño dado */
function lineH(size) { return fontScale(size) * Font.LINE + 2; }

function txt(c, s, x, y, o) {
  o = o || {};
  Font.draw(c, s, x, y, {
    scale: o.pxScale || fontScale(o.size || 8),
    col: o.col || PAL.cream,
    align: o.align,
    extra: o.letterSpacing ? Math.round(o.letterSpacing) : 0,
    shadow: o.shadow,
    shadowCol: o.shadowCol,
    glow: o.glow,
    glowSize: o.glowSize
  });
}
function textWidth(c, s, size, bold) {
  return Font.measure(String(s), fontScale(size || 8), 0);
}
/* Envuelve un párrafo a un ancho dado y devuelve las líneas. */
function wrap(c, s, maxW, size) {
  const words = String(s).split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (textWidth(c, test, size) > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

/* ------------------------------------------------------- marcos y cajas -- */
function panel(c, x, y, w, h, o) {
  o = o || {};
  const a = o.alpha == null ? .88 : o.alpha;
  c.save();
  c.globalAlpha = a;
  c.fillStyle = o.fill || 'rgba(18,10,28,.95)';
  c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  c.globalAlpha = 1;
  // doble filete dorado con esquinas marcadas
  c.strokeStyle = o.border || PAL.gold;
  c.lineWidth = 1;
  c.strokeRect(Math.round(x) + .5, Math.round(y) + .5, Math.round(w) - 1, Math.round(h) - 1);
  c.strokeStyle = o.border2 || 'rgba(255,206,106,.3)';
  c.strokeRect(Math.round(x) + 2.5, Math.round(y) + 2.5, Math.round(w) - 5, Math.round(h) - 5);
  const cs = 4;
  c.fillStyle = o.border || PAL.gold;
  [[x, y], [x + w - cs, y], [x, y + h - cs], [x + w - cs, y + h - cs]].forEach(p => {
    c.fillRect(Math.round(p[0]), Math.round(p[1]), cs, cs);
  });
  c.restore();
}

/* =========================================================================
   RETRATOS — cabezas grandes para los diálogos.
   ========================================================================= */
const Portrait = {
  denzel(c, x, y, s, t) {
    c.save(); c.translate(x, y); c.scale(s, s);
    const C = Denzel.C;
    const b = Math.sin(t * 2) * .5;
    R(c, -9, -2 + b, 18, 22, C.mail);                    // hombros
    R(c, -9, -2 + b, 18, 2, C.mailL);
    R(c, -3, 2 + b, 6, 8, C.trim);                       // emblema
    R(c, -7, -18 + b, 14, 18, C.skin);                   // rostro
    R(c, 4, -16 + b, 3, 14, C.skin2);
    R(c, -7, -19 + b, 14, 5, C.hair);                    // cabello
    R(c, -9, -16 + b, 3, 10, C.hair);
    R(c, 6, -16 + b, 3, 10, C.hair);
    R(c, -6, -5 + b, 12, 5, C.hair);                     // barba
    R(c, -4, -4 + b, 8, 2, C.hairL);
    R(c, 7, -12 + b, 5, 3, C.skinL);                     // oreja élfica
    R(c, 11, -12 + b, 2, 2, C.skin);
    R(c, -10, -12 + b, 5, 3, C.skinL);
    R(c, -4, -10 + b, 3, 2, PAL.leaf2);                  // ojos
    R(c, 2, -10 + b, 3, 2, PAL.leaf2);
    R(c, -3, -10 + b, 1, 1, PAL.cream);
    R(c, 3, -10 + b, 1, 1, PAL.cream);
    R(c, -9, -21 + b, 18, 2, C.trim);                    // diadema
    R(c, -2, -23 + b, 4, 2, C.trim);
    c.restore();
    glow(c, x, y - 8 * s, 30 * s, 'rgba(110,190,120,.25)', .5);
  },

  leslie(c, x, y, s, t) {
    c.save(); c.translate(x, y); c.scale(s, s);
    const C = Leslie.C;
    const b = Math.sin(t * 1.8) * .5;
    // cabello largo detrás
    for (let i = 0; i < 9; i++) {
      const p = i / 8, sw = Math.sin(t * 2.2 - p * 2.6) * (1 + p * 3);
      R(c, -13 + sw, -14 + i * 3.4 + b, 6, 4, i % 3 ? C.hair : C.hairD);
      R(c, 8 + sw, -14 + i * 3.4 + b, 6, 4, i % 3 === 1 ? C.hair : C.hairD);
    }
    R(c, -9, -1 + b, 18, 22, C.dress);                   // hombros
    R(c, -9, -1 + b, 18, 2, C.dressL);
    R(c, -9, 6 + b, 18, 2, C.terra);
    R(c, -7, -18 + b, 14, 18, C.skin);                   // rostro
    R(c, 4, -16 + b, 3, 14, C.skinD);
    R(c, -8, -20 + b, 16, 6, C.root);                    // raíz oscura
    R(c, -8, -17 + b, 16, 3, C.hair);
    R(c, -4, -10 + b, 3, 2, '#4a3328');                  // ojos
    R(c, 2, -10 + b, 3, 2, '#4a3328');
    R(c, -3, -10 + b, 1, 1, PAL.white);
    R(c, 3, -10 + b, 1, 1, PAL.white);
    R(c, -2, -5 + b, 4, 1, '#c9748a');                   // sonrisa
    R(c, -6, -7 + b, 2, 1, '#e0a0a8');                   // rubor
    R(c, 4, -7 + b, 2, 1, '#e0a0a8');
    // sombrero
    R(c, -16, -22 + b, 32, 3, C.hat);
    R(c, -16, -20 + b, 32, 2, C.hatD);
    for (let i = 0; i < 8; i++) {
      const p = i / 7, bend = Math.sin(t * 1.6 - p * 2) * (1 + p * 4);
      R(c, -7 + p * 8 + bend, -24 - i * 2.6 + b, 12 - p * 8, 3, i > 4 ? C.hatD : C.hat);
    }
    R(c, -9, -24 + b, 18, 2, C.terra);
    c.restore();
    glow(c, x, y - 8 * s, 30 * s, 'rgba(242,148,180,.28)', .5);
  },

  malakor(c, x, y, s, t) {
    c.save(); c.translate(x, y); c.scale(s, s);
    const C = BOSS_C;
    R(c, -12, -2, 24, 24, C.armor);
    R(c, -12, -2, 24, 3, C.armorL);
    R(c, -16, 0, 6, 8, C.armorL);
    R(c, 10, 0, 6, 8, C.armorL);
    R(c, -9, -20, 18, 20, C.armor);                      // yelmo
    R(c, -9, -20, 18, 3, C.armorL);
    R(c, -9, -11, 18, 4, C.armorD);                      // visera
    R(c, -6, -10, 5, 2, C.eye);
    R(c, 2, -10, 5, 2, C.eye);
    R(c, -9, -6, 18, 5, C.armorL);
    for (let i = 0; i < 6; i++) R(c, -8 + i * 3, -5, 2, 4, C.armorD);
    tri(c, -9, -17, -24, -34, -5, -19, C.armorD);        // cuernos
    tri(c, -8, -18, -19, -29, -5, -19, C.armorL);
    tri(c, 9, -17, 24, -34, 5, -19, C.armorD);
    tri(c, 8, -18, 19, -29, 5, -19, C.armorL);
    for (let i = 0; i < 5; i++) tri(c, -3 + i * 1.5, -20, 0 + i * 1.5, -20, -2 + i * 1.5, -27 - i, C.trim);
    c.restore();
    glow(c, x, y - 10 * s, 34 * s, 'rgba(255,58,74,' + (.2 + Math.sin(t * 3) * .1) + ')', .6);
  }
};

/* =========================================================================
   HUD — vida, maná, vidas, poderes, zona y jefe.
   ========================================================================= */
const HUD = {
  zoneT: 0, zoneName: '', toastT: 0, toastMsg: '', toastCol: PAL.cream,
  bossShow: 0,

  showZone(name) { this.zoneName = name; this.zoneT = 3.4; },
  toast(msg, col) { this.toastMsg = msg; this.toastCol = col || PAL.cream; this.toastT = 2.6; },

  update(dt) {
    this.zoneT = Math.max(0, this.zoneT - dt);
    this.toastT = Math.max(0, this.toastT - dt);
  },

  /* --- corazón ornamentado del marcador de vida --- */
  heart(c, x, y, fill) {
    // fill: 1 lleno, .5 medio, 0 vacío
    const base = fill > 0 ? PAL.blush : '#2a1a2e';
    const hi = fill > 0 ? PAL.pink : '#3a2640';
    R(c, x, y + 1, 3, 3, base); R(c, x + 4, y + 1, 3, 3, base);
    R(c, x, y + 3, 7, 3, base);
    R(c, x + 1, y + 6, 5, 2, base);
    R(c, x + 2, y + 8, 3, 1, base);
    R(c, x + 1, y + 2, 2, 2, hi);
    if (fill === .5) {                       // mitad derecha vacía
      R(c, x + 4, y + 1, 3, 3, '#2a1a2e');
      R(c, x + 4, y + 3, 3, 3, '#2a1a2e');
      R(c, x + 4, y + 6, 2, 2, '#2a1a2e');
    }
    if (fill > 0) glow(c, x + 3, y + 4, 7, 'rgba(212,106,140,.4)', .4);
  },

  draw(c, game) {
    const p = game.player;

    /* --- vida en corazones (cada corazón = 2 puntos) --- */
    const hearts = Math.ceil(p.maxHp / 2);
    for (let i = 0; i < hearts; i++) {
      const v = p.hp - i * 2;
      this.heart(c, 10 + i * 11, 9, v >= 2 ? 1 : (v === 1 ? .5 : 0));
    }

    /* --- vidas restantes --- */
    const lx = 10 + hearts * 11 + 6;
    R(c, lx, 11, 5, 5, PAL.leaf2);                    // icono: hoja del bosque
    R(c, lx + 1, 10, 3, 1, PAL.leaf);
    txt(c, '×' + p.lives, lx + 8, 17, { size: 9, col: PAL.cream, bold: true });

    /* --- barra de maná --- */
    const mx = 10, my = 22, mw = 84, mh = 5;
    R(c, mx - 1, my - 1, mw + 2, mh + 2, '#0d0716');
    R(c, mx, my, mw, mh, '#1d2a3e');
    const mp = p.mp / p.maxMp;
    R(c, mx, my, Math.round(mw * mp), mh, PAL.aqua);
    R(c, mx, my, Math.round(mw * mp), 1, PAL.ice);
    // marcas de coste de cada poder
    [14, 34].forEach(cost => {
      const cxp = mx + mw * (cost / p.maxMp);
      R(c, cxp, my - 1, 1, mh + 2, 'rgba(255,255,255,.35)');
    });
    txt(c, 'MANÁ', mx + mw + 5, my + 5, { size: 6, col: '#7fb8c8' });

    /* --- iconos de poderes con estado --- */
    const px0 = 10, py0 = 34;
    const powers = [
      { key: 'attack', name: 'Filo del Alba',   cost: 0,  ready: true, col: PAL.sun },
      { key: 'power2', name: 'Lanza Rúnica',    cost: 14, ready: p.mp >= 14, col: PAL.ice },
      { key: 'power3', name: 'Aura del Bosque', cost: 34, ready: p.mp >= 34 && p.auraCD <= 0, col: PAL.leaf2, cd: p.auraCD / 2.4 },
      { key: 'dragon', name: 'Corazón de Dragón', cost: 0, ready: p.dragonUnlocked, col: PAL.gold, locked: !p.dragonUnlocked }
    ];
    powers.forEach((pw, i) => {
      const x = px0 + i * 22, y = py0;
      R(c, x - 1, y - 1, 20, 20, '#0d0716');
      R(c, x, y, 18, 18, pw.locked ? '#191026' : 'rgba(30,18,44,.9)');
      c.strokeStyle = pw.ready ? pw.col : '#3a2a4a';
      c.lineWidth = 1;
      c.strokeRect(x + .5, y + .5, 17, 17);
      // glifo de cada poder
      c.save(); c.translate(x + 9, y + 9);
      const gc = pw.locked ? '#43304f' : pw.col;
      if (pw.key === 'attack') { R(c, -1, -6, 2, 10, gc); R(c, -3, 3, 6, 2, gc); R(c, -1, 5, 2, 2, gc); }
      else if (pw.key === 'power2') { R(c, -5, -1, 10, 2, gc); R(c, -1, -5, 2, 10, gc); R(c, -2, -2, 4, 4, gc); }
      else if (pw.key === 'power3') {
        c.strokeStyle = gc; c.lineWidth = 1;
        c.beginPath(); c.arc(0, 0, 5, 0, TAU); c.stroke();
        R(c, -1, -2, 2, 4, gc); R(c, -2, -1, 4, 2, gc);
      } else {
        // pequeña cabeza de dragón
        R(c, -5, -2, 8, 4, gc); R(c, 2, -1, 4, 2, gc);
        tri(c, -3, -2, -6, -7, -1, -3, gc);
        R(c, -2, -1, 2, 1, pw.locked ? '#43304f' : PAL.leaf2);
      }
      c.restore();
      // enfriamiento
      if (pw.cd > 0) {
        c.save(); c.globalAlpha = .6; c.fillStyle = '#000';
        c.fillRect(x, y, 18, Math.round(18 * pw.cd)); c.restore();
      }
      if (pw.locked) {
        R(c, x + 7, y + 8, 4, 5, '#6a5a75');            // candado
        R(c, x + 8, y + 6, 2, 2, '#6a5a75');
      }
      // tecla o botón asignado, según el dispositivo en uso
      txt(c, Input.label(pw.key), x + 9, y + 25, { size: 6, col: pw.ready ? '#b9a8cc' : '#5e4d70', align: 'center' });
      if (pw.key === 'dragon' && pw.ready) {
        const fl = .5 + Math.sin(game.t * 6) * .5;
        glow(c, x + 9, y + 9, 16, 'rgba(255,206,106,' + (.4 * fl) + ')', .7);
      }
    });

    /* --- escudo activo --- */
    if (p.shieldT > 0) {
      txt(c, 'AURA ' + p.shieldT.toFixed(1) + 's', 10, 76, { size: 7, col: PAL.leaf2 });
    }

    /* --- ecos de memoria recogidos --- */
    txt(c, '✦ ' + game.save.memories.length + '/5', W - 12, 16,
      { size: 8, col: PAL.blush, align: 'right' });
    txt(c, 'ECOS', W - 12, 25, { size: 6, col: '#8a6a80', align: 'right' });

    /* --- nombre de zona al entrar (bajo el HUD, que ocupa la esquina) --- */
    if (this.zoneT > 0) {
      const k = this.zoneT > 3 ? (3.4 - this.zoneT) / .4 : Math.min(1, this.zoneT / .6);
      c.save(); c.globalAlpha = U.clamp(k, 0, 1);
      const nom = this.zoneName.toUpperCase();
      txt(c, nom, W / 2, 96,
        { size: 13, col: PAL.gold, align: 'center', glow: 'rgba(255,138,92,.8)', letterSpacing: 2 });
      const anc = textWidth(c, nom, 13) + nom.length * 2;
      R(c, W / 2 - anc / 2, 102, anc, 1, 'rgba(255,206,106,.5)');
      c.restore();
    }

    /* --- avisos breves --- */
    if (this.toastT > 0) {
      c.save(); c.globalAlpha = Math.min(1, this.toastT / .5);
      // por debajo del nombre de zona, que puede estar en pantalla a la vez
      txt(c, this.toastMsg, W / 2, this.zoneT > 0 ? 136 : 118,
        { size: 12, col: this.toastCol, align: 'center' });
      c.restore();
    }

    /* --- barra del jefe (el cuadro de diálogo ocupa ese mismo sitio) --- */
    if (game.boss && game.boss.alive && !game.boss.entrance && !Dialog.active)
      this.drawBossBar(c, game.boss, game);
  },

  drawBossBar(c, boss, game) {
    const w = 260, x = (W - w) / 2, y = H - 30;
    const pct = U.clamp(boss.hpPct, 0, 1);
    // marco
    R(c, x - 2, y - 2, w + 4, 12, 'rgba(10,5,16,.9)');
    c.strokeStyle = boss.phase === 1 ? '#7a2f50' : BOSS_C.trim;
    c.lineWidth = 1;
    c.strokeRect(x - 1.5, y - 1.5, w + 3, 11);
    // relleno con degradado
    const g = c.createLinearGradient(x, 0, x + w, 0);
    if (boss.phase === 1) { g.addColorStop(0, '#8a1f38'); g.addColorStop(1, '#d4425e'); }
    else { g.addColorStop(0, '#5a189a'); g.addColorStop(.5, '#8b3bd6'); g.addColorStop(1, '#c07ff0'); }
    c.fillStyle = g;
    c.fillRect(Math.round(x), Math.round(y), Math.round(w * pct), 8);
    R(c, x, y, Math.round(w * pct), 1, 'rgba(255,255,255,.35)');
    // separadores
    for (let i = 1; i < 10; i++) R(c, x + (w / 10) * i, y, 1, 8, 'rgba(0,0,0,.45)');
    // nombre y fase
    txt(c, boss.phase === 1 ? 'MALAKOR · SEÑOR DRAGÓN CABALLERO OSCURO' : 'MALAKOR · GRAN DRAGÓN OSCURO',
      W / 2, y - 5, { size: 8, col: boss.phase === 1 ? '#ff8a9c' : PAL.vio2, align: 'center', bold: true });
    // nombre del ataque en curso
    if (boss.telegraph > 0 && boss.attackName) {
      c.save(); c.globalAlpha = boss.telegraph / .6;
      txt(c, '¡' + boss.attackName + '!', W / 2, y - 16,
        { size: 9, col: '#ff5a6a', align: 'center', bold: true, glow: 'rgba(255,60,80,.8)' });
      c.restore();
    }
    if (boss.state === 'stagger') {
      txt(c, '¡TAMBALEÁNDOSE! ATACA', W / 2, y - 16, { size: 8, col: PAL.sun, align: 'center', bold: true });
    }
  }
};

/* =========================================================================
   CUADRO DE DIÁLOGO — texto que se escribe letra a letra, con retrato.
   ========================================================================= */
const Dialog = {
  active: false, lines: [], idx: 0, chars: 0, speed: 42, t: 0, done: false,
  onEnd: null,

  start(lines, onEnd) {
    this.active = true; this.lines = lines; this.idx = 0;
    this.chars = 0; this.t = 0; this.done = false; this.onEnd = onEnd || null;
    Audio_.duck(.45);
  },
  skip() {
    const cur = this.lines[this.idx];
    if (!cur) return;
    if (this.chars < cur.text.length) { this.chars = cur.text.length; return; }
    this.next();
  },
  next() {
    this.idx++;
    this.chars = 0;
    if (this.idx >= this.lines.length) {
      this.active = false;
      Audio_.unduck();
      if (this.onEnd) this.onEnd();
    } else Audio_.sfx('page');
  },
  update(dt) {
    if (!this.active) return;
    this.t += dt;
    const cur = this.lines[this.idx];
    if (!cur) { this.active = false; return; }
    if (this.chars < cur.text.length) {
      const before = Math.floor(this.chars);
      this.chars = Math.min(cur.text.length, this.chars + this.speed * dt);
      if (Math.floor(this.chars) > before && Math.floor(this.chars) % 3 === 0)
        Audio_.tone(600 + Math.random() * 200, .03, { type: 'square', vol: .04 });
    }
    if (Input.hit('confirm') || Input.hit('attack') || Input.hit('jump')) this.skip();
  },
  draw(c, t) {
    if (!this.active) return;
    const cur = this.lines[this.idx];
    if (!cur) return;
    // cuadro alto: el texto va al doble de escala para que se lea de lejos
    const bx = 20, by = H - 104, bw = W - 40, bh = 96;
    panel(c, bx, by, bw, bh);

    // retrato
    const who = cur.who;
    if (who && who !== 'narrador') {
      R(c, bx + 7, by + 7, 52, 52, 'rgba(8,4,14,.8)');
      c.strokeStyle = 'rgba(255,206,106,.4)'; c.lineWidth = 1;
      c.strokeRect(bx + 7.5, by + 7.5, 51, 51);
      c.save();
      c.beginPath(); c.rect(bx + 7, by + 7, 52, 52); c.clip();
      const px = bx + 33, py = by + 56;
      if (who === 'denzel') Portrait.denzel(c, px, py, 1.45, t);
      else if (who === 'leslie') Portrait.leslie(c, px, py, 1.30, t);
      else if (who === 'malakor') Portrait.malakor(c, px, py, 1.25, t);
      c.restore();
    }
    const tx = (who && who !== 'narrador') ? bx + 68 : bx + 14;
    const tw = bw - (tx - bx) - 14;

    // nombre
    if (cur.name) {
      txt(c, cur.name, tx, by + 20, { size: 12, col: cur.col || PAL.gold });
      R(c, tx, by + 24, textWidth(c, cur.name, 12), 1, 'rgba(255,206,106,.35)');
    }
    // texto progresivo
    const shown = cur.text.slice(0, Math.floor(this.chars));
    const lines = wrap(c, shown, tw, 12);
    lines.slice(0, 4).forEach((ln, i) => {
      txt(c, ln, tx, by + (cur.name ? 44 : 30) + i * 18,
        { size: 12, col: cur.textCol || '#e8dcf0' });
    });
    // indicador de continuar
    if (this.chars >= cur.text.length) {
      if (Math.sin(t * 6) > 0)
        txt(c, '▼', bx + bw - 16, by + bh - 9, { size: 10, col: PAL.gold });
      txt(c, Input.label('confirm') + ' continuar', bx + bw - 28, by + bh - 9,
        { size: 8, col: '#9d8ab0', align: 'right' });
    }
  }
};

/* =========================================================================

   ========================================================================= */
const Loading = {
  t: 0, progress: 0, target: 1, tip: '', label: '', done: false, minTime: 1.5,

  TIPS: [
    'El Aura del Bosque absorbe un golpe completo: úsala justo antes del impacto.',
    'El tercer tajo del combo lanza una media luna de luz que atraviesa la distancia.',
    'Enciende los Faroles de Memoria: son el único modo de no volver al principio.',
    'Los Ecos de Memoria guardan cómo conociste a Leslie. Ninguno está en tu camino: hay que buscarlos.',
    'El impulso te vuelve intangible un instante. Atraviesa el fuego en lugar de saltarlo.',
    'Los Golems de Raíz protegen su frente. Golpéalos tras esquivar su piedra.',
    'El doble salto deja una rueda de hojas: sirve para alcanzar los salientes más altos.',
    'Malakor avisa antes de cada golpe. Aprende su respiración y tendrás la victoria.',
    'Si acumulas daño rápido, hasta un dragón se tambalea. Entonces es tuyo.',
    'Leslie te mira desde la torre. Nunca dejó de creer que llegarías.'
  ],

  start(label) {
    this.t = 0; this.progress = 0; this.target = 0; this.done = false;
    this.label = label || 'Cargando';
    this.tip = U.choose(this.TIPS);
  },
  setTarget(v) { this.target = v; },
  update(dt) {
    this.t += dt;
    this.progress = U.damp(this.progress, this.target, 5, dt);
    if (this.progress > .995 && this.t > this.minTime) this.done = true;
  },
  draw(c) {
    // fondo: bruma violeta con runas que ascienden
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b0714'); g.addColorStop(.6, '#1a0f28'); g.addColorStop(1, '#2a1038');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 26; i++) {
      const x = (hash(i, 3) * W + Math.sin(this.t * .5 + i) * 12) % W;
      const y = (H - ((this.t * (12 + hash(i, 4) * 26) + hash(i, 5) * H) % (H + 40)));
      c.globalAlpha = .18 + hash(i, 6) * .3;
      R(c, x, y, 2, 2, hash(i, 7) > .6 ? PAL.blush : PAL.vio2);
      c.globalAlpha = 1;
    }

    // sigilo giratorio: dos rombos y un círculo
    const cx = W / 2, cy = H / 2 - 22;
    c.save();
    c.translate(cx, cy);
    c.strokeStyle = PAL.gold; c.lineWidth = 1;
    c.globalAlpha = .85;
    c.save(); c.rotate(this.t * .6);
    c.strokeRect(-16, -16, 32, 32); c.restore();
    c.save(); c.rotate(-this.t * .9 + .4);
    c.strokeStyle = PAL.blush; c.strokeRect(-11, -11, 22, 22); c.restore();
    c.strokeStyle = 'rgba(255,206,106,.5)';
    c.beginPath(); c.arc(0, 0, 22 + Math.sin(this.t * 3) * 2, 0, TAU); c.stroke();
    c.restore();
    glow(c, cx, cy, 34 + Math.sin(this.t * 3) * 6, 'rgba(255,206,106,.35)', .6);
    // corazón de dragón en el centro
    R(c, cx - 3, cy - 4, 6, 8, PAL.flame);
    R(c, cx - 1, cy - 6, 2, 12, PAL.sun);

    txt(c, this.label.toUpperCase(), cx, cy + 46,
      { size: 10, col: PAL.cream, align: 'center', bold: true, letterSpacing: 2 });

    // barra
    const bw = 220, bx = (W - bw) / 2, by = cy + 56;
    R(c, bx - 2, by - 2, bw + 4, 9, 'rgba(8,4,14,.9)');
    c.strokeStyle = 'rgba(255,206,106,.45)'; c.lineWidth = 1;
    c.strokeRect(bx - 1.5, by - 1.5, bw + 3, 8);
    const fw = Math.round(bw * U.clamp(this.progress, 0, 1));
    const bg = c.createLinearGradient(bx, 0, bx + bw, 0);
    bg.addColorStop(0, '#8a1f38'); bg.addColorStop(.5, '#d46a8c'); bg.addColorStop(1, '#ffce6a');
    c.fillStyle = bg; c.fillRect(bx, by, fw, 5);
    if (fw > 2) {
      R(c, bx, by, fw, 1, 'rgba(255,255,255,.4)');
      glow(c, bx + fw, by + 2, 10, 'rgba(255,206,106,.8)', .7);
    }
    txt(c, Math.round(U.clamp(this.progress, 0, 1) * 100) + '%', cx, by + 18,
      { size: 7, col: '#b9a8cc', align: 'center' });

    // consejo
    const tips = wrap(c, this.tip, 340, 7);
    txt(c, 'CONSEJO DEL SENDERO', cx, H - 42, { size: 7, col: PAL.gold, align: 'center', bold: true });
    tips.forEach((ln, i) => txt(c, ln, cx, H - 30 + i * 10, { size: 7, col: '#9d8ab0', align: 'center' }));

    if (this.done) {
      const bl = Math.sin(this.t * 5) > 0;
      if (bl) txt(c, 'PULSA ' + Input.label('confirm'), cx, H - 8,
        { size: 8, col: PAL.cream, align: 'center', bold: true });
    }
  }
};

/* =========================================================================
   MAPA DE CONTROLES — teclado y mando de Xbox One, lado a lado.
   ========================================================================= */
const Controls = {
  ROWS: [
    { act: 'left',   what: 'Moverse' },
    { act: 'jump',   what: 'Saltar / Doble salto' },
    { act: 'attack', what: 'Filo del Alba (combo ×3)' },
    { act: 'power2', what: 'Lanza Rúnica (14 maná)' },
    { act: 'power3', what: 'Aura del Bosque (34 maná)' },
    { act: 'dash',   what: 'Impulso (esquiva)' },
    { act: 'dragon', what: 'Corazón de Dragón' },
    { act: 'pause',  what: 'Pausa' }
  ],

  /* Botón de Xbox dibujado: círculo de color con su letra. */
  padButton(c, x, y, label, col) {
    if (label === 'RB' || label === 'LB' || label === 'MENÚ') {
      const w = label === 'MENÚ' ? 24 : 15;
      R(c, x - w / 2, y - 5, w, 10, '#2a2a30');
      c.strokeStyle = '#6a6a78'; c.lineWidth = 1;
      c.strokeRect(x - w / 2 + .5, y - 4.5, w - 1, 9);
      txt(c, label, x, y + 3, { size: 6, col: '#e0e0e8', align: 'center', bold: true });
      return;
    }
    if (label.length > 1) {   // flechas de la cruceta
      R(c, x - 8, y - 5, 16, 10, '#2a2a30');
      txt(c, label, x, y + 3, { size: 7, col: '#e0e0e8', align: 'center' });
      return;
    }
    c.save();
    c.beginPath(); c.arc(x, y, 6, 0, TAU);
    c.fillStyle = col || '#3a3a44'; c.fill();
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1; c.stroke();
    c.restore();
    txt(c, label, x, y + 3, { size: 8, col: '#0d0d12', align: 'center', bold: true, shadow: false });
  },

  keyCap(c, x, y, label) {
    const w = Math.max(16, textWidth(c, label, 7) + 8);
    R(c, x - w / 2, y - 6, w, 12, '#241a33');
    R(c, x - w / 2, y - 6, w, 1, '#4a3a60');
    R(c, x - w / 2, y + 5, w, 1, '#120c1c');
    c.strokeStyle = '#5a4a70'; c.lineWidth = 1;
    c.strokeRect(x - w / 2 + .5, y - 5.5, w - 1, 11);
    txt(c, label, x, y + 3, { size: 7, col: '#d8cce8', align: 'center' });
    return w;
  },

  draw(c, t, opt) {
    opt = opt || {};
    const y0 = opt.y || 44;
    panel(c, 30, y0 - 12, W - 60, 196);
    txt(c, 'CONTROLES', W / 2, y0 + 4, { size: 12, col: PAL.gold, align: 'center', bold: true, letterSpacing: 2 });

    // cabeceras de columna
    txt(c, 'TECLADO', 214, y0 + 22, { size: 8, col: PAL.ice, align: 'center', bold: true });
    txt(c, 'XBOX ONE', 330, y0 + 22, { size: 8, col: PAL.leaf2, align: 'center', bold: true });
    R(c, 44, y0 + 26, W - 88, 1, 'rgba(255,206,106,.25)');

    const padColors = { A: '#6fbf72', B: '#d4425e', X: '#4a7fd4', Y: '#ffce6a' };

    this.ROWS.forEach((row, i) => {
      const y = y0 + 40 + i * 17;
      const zebra = i % 2 === 0;
      if (zebra) { c.save(); c.globalAlpha = .12; R(c, 44, y - 9, W - 88, 16, '#ffffff'); c.restore(); }
      txt(c, row.what, 50, y + 3, { size: 8, col: '#e0d4f0' });

      // teclado
      if (row.act === 'left') {
        this.keyCap(c, 196, y, 'A / ←');
        this.keyCap(c, 234, y, 'D / →');
      } else {
        this.keyCap(c, 214, y, Input.keyLabel[row.act]);
      }
      // mando
      const pl = Input.padLabel[row.act];
      if (row.act === 'left') {
        this.padButton(c, 312, y, '◀▶', null);
        txt(c, 'palanca', 340, y + 3, { size: 7, col: '#8a7a9a' });
      } else if (row.act === 'dash') {
        this.padButton(c, 318, y, 'RB', null);
        txt(c, 'o RT', 340, y + 3, { size: 7, col: '#8a7a9a' });
      } else if (row.act === 'dragon') {
        this.padButton(c, 318, y, 'LB', null);
        txt(c, 'o LT', 340, y + 3, { size: 7, col: '#8a7a9a' });
      } else {
        this.padButton(c, 330, y, pl, padColors[pl]);
      }
    });

    // estado del mando, dentro del panel
    const sy = y0 + 40 + this.ROWS.length * 17 + 8;
    const on = Input.padConnected;
    R(c, 50, sy - 4, 5, 5, on ? PAL.leaf2 : '#5a4a60');
    if (on) glow(c, 52, sy - 2, 8, 'rgba(110,190,110,.6)', .6);
    txt(c, on ? 'Mando conectado — vibración activa'
              : 'Sin mando: conéctalo en cualquier momento y se detecta solo',
      60, sy + 1, { size: 7, col: on ? PAL.leaf2 : '#8a7a9a' });

    // aviso de volver, ya fuera del marco
    if (opt.hint !== false && Math.sin(t * 5) > 0) {
      txt(c, 'PULSA ' + Input.label('back') + ' PARA VOLVER', W / 2, H - 10,
        { size: 8, col: PAL.cream, align: 'center', bold: true });
    }
  }
};

/* =========================================================================
   VIÑETAS DE LA INTRODUCCIÓN
   Cada una se dibuja por completo con código y se anima sola. `k` va de 0 a 1
   a lo largo de la viñeta; `t` es el tiempo absoluto para los bucles.
   ========================================================================= */
const IntroArt = {

  /* 1 · El bosque de Eldrehal, cuando el mundo aún era verde. */
  eldrehal(c, t, k) {
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#16324a'); g.addColorStop(.5, '#2a5a5e'); g.addColorStop(1, '#1e3a34');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    // luna entre la fronda
    glow(c, 360, 50, 60, 'rgba(220,240,200,.35)', .7);
    ell(c, 360, 50, 13, 13, '#e8f4d0');
    // capas de bosque
    for (let L = 0; L < 3; L++) {
      const col = ['#14282c', '#0f2024', '#0a181a'][L];
      const base = 150 + L * 28;
      for (let i = 0; i < 16; i++) {
        const x = i * 34 - 20 + L * 12;
        const h = 60 + hash(i, L * 7) * 50;
        const sw = Math.sin(t * .7 + i + L) * (2 + L);
        R(c, x + sw * .4, base - h, 4 - L, h, col);
        ell(c, x + sw, base - h, 16 - L * 2, 12 - L, col);
        ell(c, x - 9 + sw, base - h + 6, 10, 7, col);
        ell(c, x + 10 + sw, base - h + 5, 10, 7, col);
      }
    }
    R(c, 0, 206, W, H - 206, '#122420');
    R(c, 0, 206, W, 4, '#245c3e');
    // luciérnagas
    for (let i = 0; i < 40; i++) {
      const x = (hash(i, 11) * W + Math.sin(t * .6 + i) * 22) % W;
      const y = 90 + hash(i, 12) * 110 + Math.sin(t * .9 + i * 2) * 10;
      const a = .3 + Math.sin(t * 2.4 + i * 1.7) * .45;
      if (a <= 0) continue;
      c.globalAlpha = a; R(c, x, y, 2, 2, '#d8ff9a'); c.globalAlpha = 1;
      if (a > .6) glow(c, x, y, 7, 'rgba(200,255,140,.5)', .5);
    }
    // Denzel niño entrenando con una rama
    const sx = 130, sy = 206;
    const sw2 = Math.sin(t * 2.6) * .5;
    c.save(); c.translate(sx, sy); c.scale(.62, .62);
    Denzel.draw(c, { t: t * 1.4, state: 'attack', dir: 1, run: 0, airborne: false, vy: 0,
      atkT: (t * 1.4) % .5, atkDur: .5, combo: 1, dashT: 0 });
    c.restore();
    c.globalAlpha = .25 + sw2 * .1;
    glow(c, sx + 14, sy - 24, 26, 'rgba(255,233,168,.5)', .5);
    c.globalAlpha = 1;
  },

  /* 2 · El río de las luciérnagas: la noche en que se conocieron. */
  encuentro(c, t, k) {
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0f1a38'); g.addColorStop(.6, '#2a2a58'); g.addColorStop(1, '#3a2a4a');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 60; i++) {
      const x = hash(i, 21) * W, y = hash(i, 22) * 120;
      c.globalAlpha = .3 + Math.sin(t * 2 + i) * .3;
      R(c, x, y, 1, 1, PAL.cream); c.globalAlpha = 1;
    }
    glow(c, 92, 44, 52, 'rgba(255,240,210,.3)', .7);
    ell(c, 92, 44, 15, 15, '#fdf3c9');
    ell(c, 86, 40, 13, 13, '#1a2040');
    // orilla y bosque: copas anchas, troncos cortos
    for (let i = 0; i < 14; i++) {
      const x = i * 38 - 10, h = 26 + hash(i, 31) * 26;
      const sw = Math.sin(t * .6 + i) * 2;
      const r = 18 + hash(i, 32) * 9;
      R(c, x + sw * .3, 168 - h, 4, h, '#16142c');
      ell(c, x + sw, 168 - h - r * .3, r, r * .68, '#16142c');
      ell(c, x - r * .7 + sw, 168 - h + r * .1, r * .6, r * .46, '#16142c');
      ell(c, x + r * .7 + sw, 168 - h + r * .06, r * .58, r * .44, '#16142c');
      ell(c, x + r * .2 + sw, 168 - h - r * .78, r * .52, r * .4, '#16142c');
    }
    R(c, 0, 168, W, 18, '#221a34');
    // río con reflejos
    R(c, 0, 186, W, H - 186, '#16304e');
    for (let i = 0; i < W; i += 4) {
      const wv = Math.sin(i * .07 + t * 1.8) * 2 + Math.sin(i * .16 - t * 2.4) * 1.4;
      R(c, i, 188 + wv, 4, 2, '#245c7a');
      if ((i / 4 | 0) % 4 === 0) R(c, i, 188 + wv - 1, 3, 1, '#3f9fb5');
    }
    c.globalAlpha = .3;
    for (let i = 0; i < 26; i++) {
      const x = hash(i, 41) * W;
      R(c, x, 196 + Math.sin(t * 1.4 + i) * 3, 3, 1, '#a8e6f0');
    }
    c.globalAlpha = 1;
    // luciérnagas densas sobre el agua
    for (let i = 0; i < 55; i++) {
      const x = (hash(i, 51) * W + Math.sin(t * .5 + i * .8) * 30) % W;
      const y = 120 + hash(i, 52) * 80 + Math.sin(t * 1.1 + i) * 12;
      const a = .35 + Math.sin(t * 2.2 + i * 2.1) * .5;
      if (a <= 0) continue;
      c.globalAlpha = a; R(c, x, y, 2, 2, '#ffe9a8'); c.globalAlpha = 1;
      if (a > .65) glow(c, x, y, 8, 'rgba(255,233,168,.55)', .5);
    }
    // ella, sentada en la piedra del centro
    R(c, 250, 176, 40, 14, '#2a2438');
    R(c, 252, 174, 36, 3, '#3a3448');
    c.save(); c.translate(272, 176); c.scale(.95, .95);
    Leslie.draw(c, { t, dir: -1, scale: 1, floating: false, casting: false, crystal: true, hat: true });
    c.restore();
    // él, acercándose por la orilla izquierda
    const walk = U.clamp((k - .15) * 2.2, 0, 1);
    const dx = U.lerp(70, 196, U.ease.outCubic(walk));
    c.save(); c.translate(dx, 186); c.scale(.95, .95);
    Denzel.draw(c, { t, state: walk < 1 ? 'run' : 'idle', dir: 1,
      run: walk < 1 ? .8 : 0, airborne: false, vy: 0, atkT: 0, atkDur: .3, combo: 0, dashT: 0 });
    c.restore();
    if (k > .55) {
      const a = U.clamp((k - .55) * 3, 0, 1);
      glow(c, 236, 158, 34 * a, 'rgba(255,206,106,.35)', .55 * a);
    }
  },

  /* 3 · Bajo el árbol de las runas: el juramento sin palabras. */
  juntos(c, t, k) {
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1b1038'); g.addColorStop(.55, '#3a2058'); g.addColorStop(1, '#4a2a50');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 70; i++) {
      const x = hash(i, 61) * W, y = hash(i, 62) * 150;
      c.globalAlpha = .25 + Math.sin(t * 1.8 + i) * .35;
      R(c, x, y, hash(i, 63) > .9 ? 2 : 1, 1, PAL.cream); c.globalAlpha = 1;
    }
    // el gran árbol
    const tx = 300;
    for (let i = 0; i < 120; i++) {
      const sw = Math.sin(t * .5 + i * .04) * (i / 120) * 5;
      R(c, tx + sw, 200 - i, 12 - i * .05, 1, i > 80 ? '#2a1a28' : '#3b2a33');
    }
    ell(c, tx + 4, 74, 74, 42, '#1f1430');
    ell(c, tx - 40, 92, 44, 26, '#2a1a3e');
    ell(c, tx + 48, 88, 40, 24, '#2a1a3e');
    ell(c, tx + 6, 54, 52, 26, '#33204f');
    // runas que orbitan el tronco
    for (let i = 0; i < 22; i++) {
      const a = (i / 22) * TAU + t * .35;
      const r = 60 + Math.sin(t * .8 + i) * 16;
      const x = tx + Math.cos(a) * r, y = 110 + Math.sin(a) * r * .45;
      const al = .35 + Math.sin(t * 2 + i) * .35;
      c.globalAlpha = al;
      R(c, x - 1, y, 3, 1, PAL.vio2); R(c, x, y - 1, 1, 3, PAL.vio2);
      c.globalAlpha = 1;
      if (al > .55) glow(c, x, y, 7, 'rgba(192,127,240,.4)', .45);
    }
    R(c, 0, 200, W, H - 200, '#1d1830');
    R(c, 0, 200, W, 3, '#2f5a45');
    for (let i = 0; i < W; i += 6) {
      const gs = Math.sin(i * .3 + t * 1.2) * 1.2;
      R(c, i + gs, 196, 1, 5, '#2f5a45');
    }
    // los dos, sentados hombro con hombro
    c.save(); c.translate(200, 200); c.scale(.92, .92);
    Denzel.draw(c, { t: t * .6, state: 'idle', dir: 1, run: 0, airborne: false, vy: 0,
      atkT: 0, atkDur: .3, combo: 0, dashT: 0 });
    c.restore();
    c.save(); c.translate(222, 200);
    Leslie.draw(c, { t: t * .7, dir: -1, scale: .92, floating: false, casting: false, crystal: false, hat: true });
    c.restore();
    // el hilo de luz que los une
    const pulse = .5 + Math.sin(t * 2) * .5;
    c.save(); c.globalAlpha = .4 + pulse * .3;
    c.strokeStyle = PAL.blush; c.lineWidth = 1;
    c.beginPath();
    for (let i = 0; i <= 20; i++) {
      const p = i / 20;
      const x = U.lerp(202, 220, p), y = 178 - Math.sin(p * Math.PI) * 10 + Math.sin(t * 3 + p * 6) * 1.5;
      i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
    }
    c.stroke(); c.restore();
    glow(c, 211, 172, 22 + pulse * 6, 'rgba(242,148,180,.4)', .55);
  },

  /* 4 · La sombra sobre Eldrehal. */
  sombra(c, t, k) {
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a0410'); g.addColorStop(.45, '#4a0c20'); g.addColorStop(1, '#7a1a20');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    // nubes de ceniza
    for (let i = 0; i < 10; i++) {
      const x = ((hash(i, 71) * 700 - t * (8 + i)) % 700 + 700) % 700 - 110;
      c.globalAlpha = .4;
      ell(c, x, 30 + hash(i, 72) * 50, 40, 10, '#2a0a14');
      ell(c, x + 22, 36 + hash(i, 73) * 44, 30, 8, '#38101c');
      c.globalAlpha = 1;
    }
    // bosque ardiendo
    for (let i = 0; i < 18; i++) {
      const x = i * 30 - 10, h = 46 + hash(i, 81) * 44;
      R(c, x, 200 - h, 3, h, '#1a0a10');
      ell(c, x, 200 - h, 12, 8, '#2a0e16');
      if (hash(i, 82) > .4) {
        const fh = 8 + U.noise1(t * 5 + i, i) * 6;
        R(c, x - 2, 200 - h - fh, 5, fh, PAL.flame);
        R(c, x - 1, 200 - h - fh * .7, 3, fh * .7, PAL.ember);
        glow(c, x, 200 - h - fh * .4, 22, 'rgba(255,90,60,.4)', .5);
      }
    }
    R(c, 0, 200, W, H - 200, '#1a0810');
    // brasas ascendentes
    for (let i = 0; i < 45; i++) {
      const x = (hash(i, 91) * W + Math.sin(t + i) * 18) % W;
      const y = (H - ((t * (20 + hash(i, 92) * 40) + hash(i, 93) * H) % (H + 30)));
      c.globalAlpha = .5 + hash(i, 94) * .5;
      R(c, x, y, 2, 2, hash(i, 95) > .5 ? PAL.ember : PAL.flame);
      c.globalAlpha = 1;
    }
    // Malakor desciende: silueta alada creciendo
    const app = U.clamp(k * 1.5, 0, 1);
    const s = U.lerp(.35, 1.15, U.ease.outCubic(app));
    const dy = U.lerp(-40, 96, U.ease.outCubic(app));
    c.save();
    c.translate(W / 2, dy);
    c.scale(s, s);
    const flap = Math.sin(t * 3.4);
    const wa = -.5 + flap * .7;
    tri(c, -10, 0, -10 - Math.cos(wa) * 70, Math.sin(wa) * 60, -6, 40, '#2a0c1c');
    tri(c, 10, 0, 10 + Math.cos(wa) * 70, Math.sin(wa) * 60, 6, 40, '#38101f');
    ell(c, 0, 16, 16, 24, '#160610');
    ell(c, 0, -8, 12, 10, '#160610');
    tri(c, -8, -12, -20, -34, -3, -14, '#160610');
    tri(c, 8, -12, 20, -34, 3, -14, '#160610');
    R(c, -7, -9, 5, 3, PAL.flame);
    R(c, 2, -9, 5, 3, PAL.flame);
    c.restore();
    glow(c, W / 2, dy + 6, 60 * s, 'rgba(255,58,74,.35)', .6);
    if (k > .4) {
      c.save();
      c.globalAlpha = (k - .4) * .7;
      c.fillStyle = '#7a0a1a'; c.fillRect(0, 0, W, H);
      c.restore();
    }
  },

  /* 5 · El rapto: la torre se la lleva y el cristal cae. */
  rapto(c, t, k) {
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0d0614'); g.addColorStop(.5, '#2a0c22'); g.addColorStop(1, '#4a0f2a');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    Sky.t = t;
    Sky.drawTower(c, 0, 300, 220, 1.25, true);
    R(c, 0, 220, W, H - 220, '#150810');
    for (let i = 0; i < 12; i++) {
      const x = i * 42 - 10;
      R(c, x, 206, 3, 16, '#0d0510');
      ell(c, x, 206, 11, 7, '#0d0510');
    }
    // ella, arrastrada hacia la torre por una espiral de sombra
    const up = U.ease.inOut(U.clamp(k * 1.25, 0, 1));
    const lx = U.lerp(130, 296, up), ly = U.lerp(206, 112, up);
    for (let i = 0; i < 26; i++) {
      const p = i / 25;
      const a = t * 3 + p * 9;
      const x = U.lerp(130, 296, up * p + (1 - up) * 0) + Math.cos(a) * (10 + p * 14);
      const y = U.lerp(206, 112, up * p) + Math.sin(a) * 5;
      c.globalAlpha = .5 * (1 - p);
      R(c, x, y, 3, 3, PAL.vio); c.globalAlpha = 1;
    }
    c.save(); c.translate(lx, ly);
    c.rotate(Math.sin(t * 2) * .12);
    Leslie.draw(c, { t, dir: -1, scale: .9, floating: true, casting: false, crystal: false, hat: true });
    c.restore();
    glow(c, lx, ly - 16, 30, 'rgba(242,148,180,.4)', .6);
    // el cristal que se le escapa de la mano y cae
    const fall = U.clamp((k - .35) * 2, 0, 1);
    const cxp = U.lerp(lx, 150, fall);
    const cyp = U.lerp(ly - 14, 214, U.ease.inCubic(fall));
    if (k > .3) {
      c.save(); c.translate(cxp, cyp); c.rotate(t * 3);
      R(c, -2, -5, 4, 10, PAL.gold); R(c, -1, -7, 2, 14, PAL.sun);
      c.restore();
      glow(c, cxp, cyp, 16, 'rgba(255,206,106,.6)', .7);
      if (Math.random() < .5)
        FX.spawn({ x: cxp, y: cyp, vx: U.rand(20, -20), vy: U.rand(10, -20),
          life: .7, size: 2, col: PAL.sun, kind: 'holy', glow: 5 });
    }
    // él, abajo, alcanzando lo que ya no puede tocar
    c.save(); c.translate(96, 220);
    Denzel.draw(c, { t, state: 'cast', dir: 1, run: 0, airborne: false, vy: 0,
      atkT: 0, atkDur: .3, combo: 0, dashT: 0 });
    c.restore();
  },

  /* 6 · El juramento: recoge el cristal y se pone en marcha. */
  juramento(c, t, k) {
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b0714'); g.addColorStop(.6, '#241438'); g.addColorStop(1, '#3a2040');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 50; i++) {
      const x = hash(i, 101) * W, y = hash(i, 102) * 130;
      c.globalAlpha = .3 + Math.sin(t * 2 + i) * .3;
      R(c, x, y, 1, 1, PAL.cream); c.globalAlpha = 1;
    }
    Sky.t = t;
    Sky.drawTower(c, 0, 380, 190, .78, true);
    for (let i = 0; i < 16; i++) {
      const x = i * 32 - 10, h = 30 + hash(i, 111) * 34;
      const sw = Math.sin(t * .9 + i) * 2;
      R(c, x + sw * .4, 206 - h, 2, h, '#140c1c');
      limb(c, x + sw, 206 - h, 8, -1, 1, '#1a1024');
      limb(c, x + sw, 206 - h + 4, 7, -2.2, 1, '#1a1024');
    }
    R(c, 0, 206, W, H - 206, '#1a1226');
    R(c, 0, 206, W, 3, '#2f4a3c');
    // él, de rodillas -> se alza
    const rise = U.clamp((k - .3) * 2, 0, 1);
    const kneel = 1 - U.ease.outCubic(rise);
    c.save();
    c.translate(178, 206 + kneel * 4);
    c.scale(1, 1 - kneel * .18);
    Denzel.draw(c, { t, state: rise > .6 ? 'idle' : 'cast', dir: 1, run: 0,
      airborne: false, vy: 0, atkT: 0, atkDur: .3, combo: 0, dashT: 0 });
    c.restore();
    // el cristal en su mano, encendiéndose
    const cyp = 206 - 30 - rise * 8;
    const pulse = .6 + Math.sin(t * 4) * .4;
    R(c, 190, cyp - 5, 4, 10, PAL.gold);
    R(c, 191, cyp - 7, 2, 14, PAL.sun);
    glow(c, 192, cyp, (14 + rise * 28) * pulse, 'rgba(255,206,106,.65)', .75);
    if (rise > .2 && Math.random() < .6)
      FX.spawn({ x: 192 + U.rand(10, -10), y: cyp + U.rand(10, -10), vx: 0, vy: -30,
        life: 1, size: 2, col: PAL.sun, col2: PAL.gold, kind: 'holy', glow: 6 });
    // columna de luz al final
    if (k > .7) {
      const a = (k - .7) / .3;
      c.save(); c.globalAlpha = a * .35;
      const lg = c.createLinearGradient(0, 0, 0, H);
      lg.addColorStop(0, 'rgba(255,233,168,0)');
      lg.addColorStop(1, 'rgba(255,233,168,.8)');
      c.fillStyle = lg; c.fillRect(168, 0, 48, H);
      c.restore();
    }
  }
};

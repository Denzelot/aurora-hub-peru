/* =========================================================================
   CORAZÓN DE DRAGÓN — 04-entities.js
   Denzel, sus cuatro poderes, el bestiario, proyectiles y objetos.
   ========================================================================= */
'use strict';

const GRAV = 900, MAXFALL = 420;

/* =========================================================================
   DENZEL — Elfo del bosque, Caballero Paladín de la Orden del Alba.
   ========================================================================= */
class Player {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.w = 12; this.h = 26;                 // caja de colisión (el sprite es más ancho)
    this.vx = 0; this.vy = 0;
    this.dir = 1;
    this.onGround = false; this.wasGround = false;
    this.t = 0;

    this.hp = 6; this.maxHp = 6;
    this.mp = 100; this.maxMp = 100;
    this.lives = 3;

    this.state = 'idle';
    this.atkT = 0; this.atkDur = .28; this.combo = 0; this.comboWindow = 0;
    this.castT = 0; this.hurtT = 0; this.invT = 0;
    this.dashT = 0; this.dashCD = 0;
    this.coyote = 0; this.jumpBuf = 0; this.jumps = 0; this.maxJumps = 2;
    this.shieldT = 0; this.auraCD = 0;
    this.dragonForm = false; this.dragonT = 0; this.dragonUnlocked = false;
    this.dead = false; this.deadT = 0;
    this.hitIds = new Set();                  // evita golpear dos veces con el mismo tajo
    this.stepT = 0;
    this.inWater = false;
    this.spawnGuard = 0;                      // gracia al reaparecer (aura, no parpadeo)
  }

  get box() { return { x: this.x - this.w / 2, y: this.y - this.h, w: this.w, h: this.h }; }
  get cx() { return this.x; }
  get cy() { return this.y - this.h / 2; }

  /* --------------------------------------------------------- daño ------- */
  hurt(dmg, fromX, game) {
    if (this.invT > 0 || this.dead || this.dragonForm) return false;
    if (this.shieldT > 0) {                    // el Aura del Bosque absorbe un golpe
      this.shieldT = 0;
      FX.ring(this.cx, this.cy, { col: PAL.leaf2, speed: 300, life: .4, width: 3 });
      FX.holy(this.cx, this.cy, 16);
      Audio_.sfx('aura');
      FX.text(this.cx, this.y - 34, 'PROTEGIDO', PAL.leaf2, 7);
      this.invT = .7;
      return false;
    }
    this.hp -= dmg;
    this.invT = 1.1; this.hurtT = .3;
    this.state = 'hurt';
    const kb = this.x < fromX ? -1 : 1;
    this.vx = kb * 150; this.vy = -180;
    Audio_.sfx('hurt');
    Screen.flash('rgba(200,40,60,.5)', .14);
    Screen.freeze(.07);
    Cam.shake(2.6, .3);
    FX.gore(this.cx, this.cy, 8, PAL.blood);
    FX.text(this.cx, this.y - 30, '-' + dmg, '#ff6a7a', 8);
    if (this.hp <= 0) this.die(game);
    return true;
  }

  die(game) {
    if (this.dead) return;
    this.dead = true; this.deadT = 0;
    this.state = 'dead';
    this.vy = -260; this.vx = -this.dir * 90;
    Audio_.sfx('die');
    Cam.shake(4, .5);
    FX.gore(this.cx, this.cy, 22, PAL.blood);
    FX.burst(this.cx, this.cy, 18, { col: PAL.plum, life: 1, speed: 130 });
    if (game) { game.save.deaths++; }
  }

  heal(n) {
    this.hp = Math.min(this.maxHp, this.hp + n);
    Audio_.sfx('heal');
    FX.holy(this.cx, this.cy, 18);
    FX.text(this.cx, this.y - 32, '+' + n, PAL.leaf2, 8);
  }
  giveMp(n) {
    this.mp = Math.min(this.maxMp, this.mp + n);
    FX.magic(this.cx, this.cy, 10, PAL.ice);
    FX.text(this.cx, this.y - 32, '+' + n + ' maná', PAL.ice, 7);
  }

  /* ------------------------------------------------------ actualización -- */
  update(dt, game) {
    this.t += dt;
    const ctrl = game.controlEnabled && !this.dead;

    /* temporizadores */
    this.invT = Math.max(0, this.invT - dt);
    this.spawnGuard = Math.max(0, this.spawnGuard - dt);
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.dashCD = Math.max(0, this.dashCD - dt);
    this.auraCD = Math.max(0, this.auraCD - dt);
    this.comboWindow = Math.max(0, this.comboWindow - dt);
    this.shieldT = Math.max(0, this.shieldT - dt);
    if (this.comboWindow <= 0 && this.state !== 'attack') this.combo = 0;

    /* regeneración lenta de maná: premia no abusar de la magia */
    if (!this.dragonForm) this.mp = Math.min(this.maxMp, this.mp + dt * 5.5);

    if (this.dead) { this.updateDead(dt, game); return; }

    /* ---- forma de dragón: control simplificado y vuelo ---- */
    if (this.dragonForm) { this.updateDragon(dt, game, ctrl); return; }

    /* ---- entrada horizontal ---- */
    /* 110 px/s con un vuelo de ~0.6 s da un alcance de unos 68 px de salto
       simple y 120 con el doble: todos los huecos del nivel caben con
       margen, incluso llegando sin carrerilla.                             */
    const ax = ctrl ? Input.axisX() : 0;
    const speed = this.inWater ? 68 : 110;
    const accel = this.onGround ? 900 : 520;
    if (this.state === 'attack' && this.onGround) {
      this.vx = U.approach(this.vx, ax * speed * .35, accel * dt * .6);   // frenado al atacar
    } else if (this.state !== 'hurt' && this.dashT <= 0) {
      this.vx = U.approach(this.vx, ax * speed, accel * dt);
      if (ax !== 0) this.dir = ax;
    } else if (this.state === 'hurt') {
      this.vx = U.approach(this.vx, 0, 320 * dt);
    }

    /* ---- salto con coyote time y buffer (control indulgente) ---- */
    this.coyote = this.onGround ? .12 : Math.max(0, this.coyote - dt);
    if (ctrl && Input.hit('jump')) this.jumpBuf = .14;
    this.jumpBuf = Math.max(0, this.jumpBuf - dt);
    if (this.jumpBuf > 0 && (this.coyote > 0 || this.jumps < this.maxJumps) && this.state !== 'hurt') {
      const first = this.coyote > 0;
      this.vy = first ? -272 : -232;
      this.jumps = first ? 1 : this.jumps + 1;
      this.jumpBuf = 0; this.coyote = 0;
      this.onGround = false;
      Audio_.sfx('jump');
      if (first) FX.dust(this.x, this.y, 6);
      else {
        // doble salto: rueda de hojas del bosque
        FX.ring(this.cx, this.y - 4, { col: PAL.leaf2, speed: 150, life: .32, width: 2, squash: .45 });
        for (let i = 0; i < 9; i++) {
          const a = (i / 9) * TAU;
          FX.spawn({ x: this.x + Math.cos(a) * 8, y: this.y - 6 + Math.sin(a) * 4,
            vx: Math.cos(a) * 60, vy: Math.sin(a) * 30 + 20, life: .6, size: 2,
            col: PAL.leaf2, col2: PAL.moss, grav: 90, kind: 'leaf', tag: i });
        }
      }
    }
    // salto variable: soltar el botón corta el impulso
    if (!Input.held('jump') && this.vy < -110) this.vy += 780 * dt;

    /* ---- impulso (dash) ---- */
    if (ctrl && Input.hit('dash') && this.dashCD <= 0 && this.state !== 'hurt') {
      this.dashT = .17; this.dashCD = .55;
      this.vx = this.dir * 290; this.vy = 0;
      this.invT = Math.max(this.invT, .22);
      Audio_.sfx('dash');
      FX.ring(this.cx, this.cy, { col: PAL.ice, speed: 220, life: .28, width: 2, squash: .6 });
    }
    if (this.dashT > 0) {
      this.dashT -= dt;
      this.vy = 0;
      FX.spawn({ x: this.cx - this.dir * 4, y: this.cy + U.rand(8, -8), vx: -this.dir * 30, vy: 0,
        life: .26, size: 3, col: 'rgba(200,230,255,.8)', kind: 'smoke', drag: .9 });
    }

    /* ---- PODER 1 · Filo del Alba (combo de tres tajos) ---- */
    if (ctrl && Input.hit('attack') && this.state !== 'attack' && this.state !== 'hurt') {
      this.combo = this.comboWindow > 0 ? Math.min(3, this.combo + 1) : 1;
      this.state = 'attack';
      this.atkT = 0;
      this.atkDur = this.combo === 3 ? .38 : .26;
      this.hitIds.clear();
      Audio_.sfx('swing');
      if (this.combo === 3) {
        // el tercer golpe lanza una media luna de luz
        game.projectiles.push(new Projectile(this.x + this.dir * 12, this.cy, this.dir * 230, 0,
          { team: 'player', dmg: 2, kind: 'crescent', life: .75, w: 16, h: 14 }));
        Audio_.sfx('cast');
        this.vx += this.dir * 70;
      } else this.vx += this.dir * 40;
    }
    if (this.state === 'attack') {
      this.atkT += dt;
      // ventana activa del golpe
      const p = this.atkT / this.atkDur;
      if (p > .25 && p < .62) this.swordHit(game);
      if (this.atkT >= this.atkDur) {
        this.state = 'idle';
        this.comboWindow = .34;
      }
    }

    /* ---- PODER 2 · Lanza Rúnica ---- */
    if (ctrl && Input.hit('power2') && this.state !== 'hurt' && this.mp >= 14 && this.castT <= 0) {
      this.mp -= 14;
      this.state = 'cast'; this.castT = .22;
      Audio_.sfx('rune');
      const px = this.x + this.dir * 12, py = this.cy - 2;

      // Los wyvern vuelan alto y en diagonal, fuera del alcance de un disparo
      // recto: contra ellos —y sólo contra ellos— la runa sale apuntada y
      // corrige el rumbo en vuelo. El resto de enemigos exige puntería.
      const presa = this.lockWyvern(game);
      let vx = this.dir * 320, vy = 0;
      if (presa) {
        const a = Math.atan2(presa.cy - py, presa.cx - px);
        vx = Math.cos(a) * 320; vy = Math.sin(a) * 320;
        this.dir = U.sign(presa.cx - this.x) || this.dir;
        Audio_.sfx('cast');
      }
      game.projectiles.push(new Projectile(px, py, vx, vy, {
        team: 'player', dmg: 2, kind: 'rune', life: presa ? 2.2 : 1.4, w: 10, h: 8,
        target: presa, homing: presa ? 6 : 0
      }));
      FX.magic(px, py, 10, PAL.ice);
      FX.ring(px, py, { col: PAL.ice, speed: 180, life: .22, width: 1 });
      this.vx -= this.dir * 26;                 // retroceso
    }
    if (this.castT > 0) {
      this.castT -= dt;
      if (this.castT <= 0 && this.state === 'cast') this.state = 'idle';
    }

    /* ---- PODER 3 · Aura del Bosque (escudo + onda + cura) ---- */
    if (ctrl && Input.hit('power3') && this.auraCD <= 0 && this.mp >= 34 && this.state !== 'hurt') {
      this.mp -= 34; this.auraCD = 2.4;
      this.shieldT = 6;
      this.state = 'cast'; this.castT = .35;
      Audio_.sfx('aura');
      Screen.flash('rgba(120,220,150,.28)', .2);
      Cam.shake(1.8, .25);
      FX.ring(this.cx, this.cy, { col: PAL.leaf2, speed: 420, life: .55, width: 3 });
      FX.ring(this.cx, this.cy, { col: PAL.sun, speed: 300, life: .7, width: 2 });
      FX.holy(this.cx, this.cy, 26);
      // empuja y daña a lo que esté cerca
      for (const e of game.enemies) {
        if (!e.alive) continue;
        const d = U.dist(this.cx, this.cy, e.cx, e.cy);
        if (d < 66) {
          e.hurt(2, this.cx, game);
          e.vx += U.sign(e.cx - this.cx) * 220;
          e.vy -= 90;
        }
      }
      for (const p of game.projectiles) if (p.team === 'enemy' && U.dist(this.cx, this.cy, p.x, p.y) < 66) p.life = 0;
      if (this.hp < this.maxHp && this.mp >= 0) this.heal(1);
    }

    /* ---- PODER 4 · Corazón de Dragón ---- */
    if (ctrl && Input.hit('dragon') && this.dragonUnlocked && !this.dragonForm) {
      game.beginTransformation();
    }

    /* ---- física ---- */
    const wat = World.inWater(this.box);
    this.inWater = !!wat;
    const g = this.inWater ? GRAV * .42 : GRAV;
    this.vy = Math.min(this.vy + g * dt, this.inWater ? 120 : MAXFALL);
    if (this.inWater && Math.random() < .18)
      FX.spawn({ x: this.x + U.rand(5, -5), y: this.y - 6, vx: 0, vy: -20,
        life: .8, size: 1, col: PAL.ice, kind: 'bubble', drag: 1 });

    this.move(dt, game);

    /* ---- estado visual ---- */
    if (this.state !== 'attack' && this.state !== 'cast' && this.state !== 'hurt') {
      if (!this.onGround) this.state = this.vy < 0 ? 'jump' : 'fall';
      else this.state = Math.abs(this.vx) > 12 ? 'run' : 'idle';
    }
    if (this.hurtT <= 0 && this.state === 'hurt') this.state = 'idle';

    /* ---- polvo y pasos ---- */
    if (this.onGround && Math.abs(this.vx) > 40) {
      this.stepT -= dt;
      if (this.stepT <= 0) {
        this.stepT = .26;
        FX.dust(this.x - this.dir * 4, this.y, 2, 'rgba(160,150,170,.5)');
      }
    }
    if (this.onGround && !this.wasGround) {
      Audio_.sfx('land');
      FX.dust(this.x, this.y, 8);
      if (this.vy > 300) Cam.shake(1.2, .16);
    }
    this.wasGround = this.onGround;

    /* ---- peligros y caída al vacío ---- */
    if (World.hazardAt(this.box)) this.hurt(1, this.x - this.dir * 20, game);
    if (this.y > World.L.deathY) { this.hp = 0; this.die(game); }
  }

  /* Wyvern vivo más cercano dentro del alcance de la runa, sin importar en
     qué altura esté volando. Devuelve null si no hay ninguno: entonces la
     Lanza Rúnica se comporta como siempre. */
  lockWyvern(game) {
    let presa = null, mejor = 360;
    for (const e of game.enemies) {
      if (!e.alive || e.kind !== 'wyvern' || !e.awake) continue;
      const d = U.dist(this.cx, this.cy, e.cx, e.cy);
      if (d < mejor) { mejor = d; presa = e; }
    }
    return presa;
  }

  /* golpe de espada: rectángulo frontal según el combo */
  swordHit(game) {
    const reach = this.combo === 3 ? 30 : 24;
    const hb = { x: this.dir > 0 ? this.x + 4 : this.x - 4 - reach, y: this.y - 24, w: reach, h: 22 };
    let hitAny = false;
    for (const e of game.enemies) {
      if (!e.alive || this.hitIds.has(e.id)) continue;
      if (!U.aabb(hb, e.box)) continue;
      this.hitIds.add(e.id);
      const dmg = this.combo === 3 ? 3 : 2;
      e.hurt(dmg, this.x, game);
      hitAny = true;
      FX.sparks(e.cx, e.cy, this.dir, 10);
      FX.ring(e.cx, e.cy, { col: PAL.sun, speed: 190, life: .22, width: 2 });
    }
    if (game.boss && game.boss.alive && !this.hitIds.has('boss') && U.aabb(hb, game.boss.box)) {
      this.hitIds.add('boss');
      game.boss.hurt(this.combo === 3 ? 3 : 2, this.x, game);
      hitAny = true;
      FX.sparks(U.clamp(this.x + this.dir * 20, game.boss.box.x, game.boss.box.x + game.boss.box.w),
                this.cy, this.dir, 12);
    }
    // parar proyectiles enemigos con la espada
    for (const p of game.projectiles) {
      if (p.team !== 'enemy' || !p.alive) continue;
      if (U.aabb(hb, p.box)) {
        p.alive = false;
        FX.sparks(p.x, p.y, this.dir, 8);
        Audio_.sfx('hit');
      }
    }
    if (hitAny) {
      Screen.freeze(this.combo === 3 ? .08 : .045);
      Cam.shake(this.combo === 3 ? 2.6 : 1.4, .18);
      Audio_.sfx(this.combo === 3 ? 'crit' : 'hit');
    }
  }

  /* --------------------------------------------- movimiento y colisión -- */
  move(dt, game) {
    // eje X
    this.x += this.vx * dt;
    let b = this.box;
    let s = World.solidAt(b);
    if (s) {
      if (this.vx > 0) this.x = s.x - this.w / 2 - .01;
      else if (this.vx < 0) this.x = s.x + s.w + this.w / 2 + .01;
      this.vx = 0;
    }
    // límites del nivel y bloqueo de arena del jefe
    const minX = game.arenaLock ? game.arenaLock.x + 8 : 4;
    const maxX = game.arenaLock ? game.arenaLock.x + game.arenaLock.w - 8 : World.L.width - 8;
    this.x = U.clamp(this.x, minX, maxX);

    // eje Y
    const prevBottom = this.y;
    this.y += this.vy * dt;
    this.onGround = false;
    b = this.box;
    s = World.solidAt(b);
    if (s) {
      // los pies se posan JUSTO encima de la superficie: si se quedan dentro,
      // aunque sea una centésima, la colisión horizontal del fotograma
      // siguiente expulsa al personaje de lado.
      if (this.vy > 0) { this.y = s.y - .01; this.onGround = true; this.jumps = 0; }
      else if (this.vy < 0) { this.y = s.y + s.h + this.h + .01; }
      this.vy = 0;
      // arrastre de plataformas móviles
      if (s.dx != null && this.onGround) { this.x += s.dx; this.y += s.dy; }
    }
    // puentes: sólidos sólo al caer sobre ellos
    const bt = World.bridgeTopAt(this.x);
    if (bt !== null && this.vy >= 0 && prevBottom <= bt + 3 && this.y >= bt && this.y <= bt + 14) {
      this.y = bt; this.vy = 0; this.onGround = true; this.jumps = 0;
    }
  }

  updateDead(dt, game) {
    this.deadT += dt;
    this.vy = Math.min(this.vy + GRAV * dt, MAXFALL);
    this.y += this.vy * dt;
    this.x += this.vx * dt;
    this.vx = U.approach(this.vx, 0, 200 * dt);
    if (Math.random() < .3) FX.spawn({ x: this.cx + U.rand(8, -8), y: this.cy, vx: 0, vy: -18,
      life: .9, size: 2, col: PAL.plum, kind: 'magic', glow: 4 });
  }

  /* -------------------------------------------- forma de Gran Dragón ---- */
  updateDragon(dt, game, ctrl) {
    this.dragonT += dt;
    const ax = ctrl ? Input.axisX() : 0;
    const ay = ctrl ? ((Input.held('down') ? 1 : 0) - (Input.held('up') || Input.held('jump') ? 1 : 0)) : 0;
    this.vx = U.approach(this.vx, ax * 175, 900 * dt);
    this.vy = U.approach(this.vy, ay * 135, 700 * dt);
    if (ax !== 0) this.dir = ax;
    this.x = U.clamp(this.x + this.vx * dt, (game.arenaLock ? game.arenaLock.x + 50 : 20),
      (game.arenaLock ? game.arenaLock.x + game.arenaLock.w - 50 : World.L.width - 20));
    this.y = U.clamp(this.y + this.vy * dt, 112, 208);
    this.onGround = false;

    // estela dorada
    if (Math.random() < .7)
      FX.spawn({ x: this.x + U.rand(26, -26), y: this.y - 44 + U.rand(24, -24),
        vx: -this.dir * 30, vy: U.rand(-14, -40), life: .7, size: 2,
        col: PAL.gold, col2: PAL.sun, kind: 'holy', glow: 6 });

    // aliento de fuego dorado
    if (ctrl && Input.held('attack') && this.dragonT > .3) {
      if (!this._breathT || this._breathT <= 0) {
        this._breathT = .07;
        const bx = this.x + this.dir * 52, by = this.y - 80;
        game.projectiles.push(new Projectile(bx, by, this.dir * U.rand(400, 300), U.rand(40, -40),
          { team: 'player', dmg: 2, kind: 'goldfire', life: .6, w: 12, h: 12 }));
        FX.burst(bx, by, 3, { col: PAL.sun, col2: PAL.gold, life: .4, speed: 120, glow: 6, kind: 'fire' });
        if (Math.random() < .25) Audio_.sfx('fire');
      }
    }
    this._breathT = (this._breathT || 0) - dt;

    // embestida con el poder 2
    if (ctrl && Input.hit('power2')) {
      this.vx = this.dir * 420;
      Audio_.sfx('wing');
      FX.ring(this.x, this.y - 44, { col: PAL.gold, speed: 340, life: .4, width: 3 });
      for (const e of game.enemies) if (e.alive && U.dist(this.x, this.y - 44, e.cx, e.cy) < 90) e.hurt(4, this.x, game);
      if (game.boss && game.boss.alive && Math.abs(game.boss.cx - this.x) < 110 && Math.abs(game.boss.cy - (this.y - 44)) < 90)
        game.boss.hurt(4, this.x, game);
    }

    // el cuerpo del dragón daña al contacto
    if (game.boss && game.boss.alive) {
      if (U.aabb(this.dragonBox, game.boss.box) && (!this._ramCD || this._ramCD <= 0)) {
        this._ramCD = .5;
        game.boss.hurt(2, this.x, game);
        Cam.shake(3, .2);
      }
    }
    this._ramCD = (this._ramCD || 0) - dt;
  }

  /* volumen del dragón dorado: el cuerpo entero es un arma */
  get dragonBox() { return { x: this.x - 44, y: this.y - 76, w: 88, h: 76 }; }

  /* ------------------------------------------------------------ dibujo -- */
  draw(c, camx) {
    const x = Math.round(this.x - camx), y = Math.round(this.y);
    // parpadeo de invulnerabilidad; durante la gracia de reaparición no
    // parpadea (dos segundos y medio de intermitencia marean): en su lugar
    // se dibuja un aura, que además informa de que sigues protegido
    if (this.spawnGuard <= 0 && this.invT > 0 &&
        Math.floor(this.invT * 20) % 2 === 0 && !this.dragonForm) return;

    c.save();
    c.translate(x, y);

    if (this.dragonForm) {
      GoldDragon.draw(c, { t: this.t, dir: this.dir, fly: 1 });
      c.restore();
      return;
    }

    // sombra proyectada
    c.restore();
    c.save(); c.globalAlpha = .28;
    ell(c, x, y - 1, 8, 2.5, '#000'); c.restore();
    c.save(); c.translate(x, y);

    if (this.dead) {
      c.rotate(Math.min(1.4, this.deadT * 3));
      c.globalAlpha = Math.max(0, 1 - this.deadT * .5);
    }

    // aura de reaparición: se apaga sola al agotarse la gracia
    if (this.spawnGuard > 0) {
      const k = Math.min(1, this.spawnGuard / 2.5);
      const p = .6 + Math.sin(this.t * 7) * .25;
      c.save();
      c.globalAlpha = .45 * k;
      c.strokeStyle = PAL.gold; c.lineWidth = 1;
      c.beginPath(); c.ellipse(0, -13, 13 * p + 6, 18 * p + 5, 0, 0, TAU); c.stroke();
      c.restore();
      // ya estamos dentro del translate del personaje: coordenadas locales
      glow(c, 0, -13, 26 * p, 'rgba(255,206,106,' + (.3 * k) + ')', .6);
      if (Math.random() < .3)
        FX.spawn({ x: this.x + U.rand(9, -9), y: this.y - U.rand(24), vx: 0, vy: -26,
          life: .6, size: 1, col: PAL.sun, kind: 'holy', glow: 4 });
    }

    // escudo del Aura del Bosque
    if (this.shieldT > 0) {
      const p = .55 + Math.sin(this.t * 6) * .2;
      c.save();
      c.globalAlpha = .30 * Math.min(1, this.shieldT);
      c.strokeStyle = PAL.leaf2; c.lineWidth = 1;
      c.beginPath(); c.ellipse(0, -13, 15 * p + 4, 19 * p + 4, 0, 0, TAU); c.stroke();
      c.globalAlpha = .13 * Math.min(1, this.shieldT);
      c.fillStyle = PAL.leaf2;
      c.beginPath(); c.ellipse(0, -13, 15 * p + 4, 19 * p + 4, 0, 0, TAU); c.fill();
      c.restore();
    }

    Denzel.draw(c, {
      t: this.t, state: this.state, dir: this.dir,
      run: Math.min(1, Math.abs(this.vx) / 100),
      airborne: !this.onGround, vy: this.vy,
      atkT: this.atkT, atkDur: this.atkDur, combo: this.combo, dashT: this.dashT
    });
    c.restore();

    // estela luminosa del tajo
    if (this.state === 'attack') {
      const p = this.atkT / this.atkDur;
      if (p > .2 && p < .7) {
        const k = (p - .2) / .5;
        c.save();
        c.globalAlpha = (1 - k) * .75;
        c.strokeStyle = this.combo === 3 ? PAL.sun : '#dff4ff';
        c.lineWidth = this.combo === 3 ? 3 : 2;
        c.beginPath();
        const r = this.combo === 3 ? 30 : 24;
        const a0 = -1.9 + k * 2.6;
        c.arc(x + this.dir * 4, y - 14, r, this.dir > 0 ? a0 : Math.PI - a0 - .9,
              this.dir > 0 ? a0 + .9 : Math.PI - a0, this.dir < 0);
        c.stroke();
        c.restore();
      }
    }
  }
}

/* =========================================================================
   PROYECTILES — runas, media lunas, fuego, piedras y alientos.
   ========================================================================= */
class Projectile {
  constructor(x, y, vx, vy, o) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.team = o.team; this.dmg = o.dmg || 1; this.kind = o.kind || 'rune';
    this.life = o.life || 1.2; this.maxLife = this.life;
    this.w = o.w || 8; this.h = o.h || 8;
    this.grav = o.grav || 0;
    this.homing = o.homing || 0;
    this.target = o.target || null;      // presa concreta (runa contra wyvern)
    this.alive = true; this.t = 0;
    this.rot = 0;
  }
  get box() { return { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h }; }

  update(dt, game) {
    this.t += dt;
    this.life -= dt;
    if (this.life <= 0) { this.alive = false; return; }
    this.vy += this.grav * dt;
    if (this.homing > 0) {
      // persigue a su presa; si muere, la runa sigue recta y se apaga sola.
      // Un proyectil enemigo sin presa asignada persigue al héroe.
      let tx = null, ty = null;
      if (this.target) {
        if (this.target.alive) { tx = this.target.cx; ty = this.target.cy; }
        else this.target = null;
      } else if (this.team === 'enemy') {
        tx = game.player.cx; ty = game.player.cy;
      }
      if (tx !== null) {
        const a = Math.atan2(ty - this.y, tx - this.x);
        const sp = Math.hypot(this.vx, this.vy) || 190;
        this.vx = U.damp(this.vx, Math.cos(a) * sp, this.homing, dt);
        this.vy = U.damp(this.vy, Math.sin(a) * sp, this.homing, dt);
      }
    }
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.rot += dt * 9;

    // estela
    if (this.kind === 'rune' || this.kind === 'crescent')
      FX.spawn({ x: this.x, y: this.y, vx: 0, vy: 0, life: .3, size: 2,
        col: this.kind === 'crescent' ? PAL.sun : PAL.ice, kind: 'magic', glow: 5 });
    else if (this.kind === 'fire' || this.kind === 'goldfire' || this.kind === 'darkfire')
      FX.spawn({ x: this.x + U.rand(3, -3), y: this.y + U.rand(3, -3), vx: 0, vy: -12,
        life: .35, size: 3,
        col: this.kind === 'goldfire' ? PAL.sun : (this.kind === 'darkfire' ? PAL.vio2 : PAL.ember),
        col2: this.kind === 'goldfire' ? PAL.gold : (this.kind === 'darkfire' ? PAL.vio : PAL.flame),
        kind: 'fire', glow: 6 });

    // Choque con el terreno. La runa que persigue a un wyvern lo atraviesa:
    // esos bichos vuelan pegados a los salientes y, si no, casi todos los
    // disparos morirían contra una repisa en vez de llegar a su presa.
    if (!this.target && World.solidAt(this.box) && this.kind !== 'crescent') { this.burst(); return; }

    // impactos
    if (this.team === 'player') {
      for (const e of game.enemies) {
        if (!e.alive) continue;
        if (U.aabb(this.box, e.box)) {
          e.hurt(this.dmg, this.x, game);
          if (this.kind !== 'crescent' && this.kind !== 'goldfire') { this.burst(); return; }
        }
      }
      if (game.boss && game.boss.alive && U.aabb(this.box, game.boss.box)) {
        game.boss.hurt(this.dmg, this.x, game);
        if (this.kind !== 'crescent' && this.kind !== 'goldfire') { this.burst(); return; }
      }
    } else {
      const p = game.player;
      if (!p.dead && U.aabb(this.box, p.box)) {
        if (p.hurt(this.dmg, this.x, game) || p.shieldT > 0) { this.burst(); return; }
        this.burst(); return;
      }
    }
  }

  burst() {
    this.alive = false;
    const col = this.kind === 'goldfire' ? PAL.gold
      : this.kind === 'darkfire' ? PAL.vio2
      : this.kind === 'fire' ? PAL.ember
      : this.kind === 'rock' ? PAL.bark2 : PAL.ice;
    FX.burst(this.x, this.y, 9, { col, life: .45, speed: 120, glow: 5, kind: 'spark' });
    FX.ring(this.x, this.y, { col, speed: 200, life: .25, width: 1 });
    Audio_.sfx('hit');
  }

  draw(c, camx) {
    const x = Math.round(this.x - camx), y = Math.round(this.y);
    switch (this.kind) {
      case 'rune': {
        c.save(); c.translate(x, y); c.rotate(this.rot);
        R(c, -4, -1, 8, 2, PAL.ice); R(c, -1, -4, 2, 8, PAL.ice);
        R(c, -2, -2, 4, 4, PAL.white);
        c.restore();
        glow(c, x, y, 12, 'rgba(168,230,240,.6)', .6);
        break;
      }
      case 'crescent': {
        c.save(); c.translate(x, y); c.scale(U.sign(this.vx), 1);
        c.globalAlpha = U.clamp(this.life / this.maxLife, 0, 1);
        c.strokeStyle = PAL.sun; c.lineWidth = 3;
        c.beginPath(); c.arc(0, 0, 9, -1.2, 1.2); c.stroke();
        c.strokeStyle = PAL.white; c.lineWidth = 1;
        c.beginPath(); c.arc(0, 0, 11, -.9, .9); c.stroke();
        c.restore();
        glow(c, x, y, 18, 'rgba(255,233,168,.55)', .6);
        break;
      }
      case 'rock': {
        c.save(); c.translate(x, y); c.rotate(this.rot * .4);
        R(c, -4, -4, 8, 8, PAL.bark2); R(c, -4, -4, 8, 2, PAL.moss); R(c, 2, -2, 2, 6, PAL.bark);
        c.restore();
        break;
      }
      default: {  // fuego
        const col = this.kind === 'goldfire' ? PAL.sun : this.kind === 'darkfire' ? PAL.vio2 : PAL.ember;
        const col2 = this.kind === 'goldfire' ? PAL.gold : this.kind === 'darkfire' ? PAL.vio : PAL.flame;
        const s = 3 + Math.sin(this.t * 22) * 1.2;
        R(c, x - s, y - s, s * 2, s * 2, col2);
        R(c, x - s / 2, y - s / 2, s, s, col);
        glow(c, x, y, 16, this.kind === 'darkfire' ? 'rgba(139,59,214,.6)' : 'rgba(255,138,92,.6)', .65);
      }
    }
  }
}

/* =========================================================================
   BESTIARIO — enemigos del sendero.
   ========================================================================= */
let ENEMY_ID = 1;

class Enemy {
  constructor(x, y, kind) {
    this.id = ENEMY_ID++;
    this.x = x; this.y = y; this.kind = kind;
    this.homeX = x; this.homeY = y;
    this.vx = 0; this.vy = 0;
    this.dir = -1; this.t = U.rand(10);
    this.alive = true; this.hurtT = 0; this.stun = 0;
    this.state = 'patrol'; this.cd = 0;
    this.awake = false;

    const S = {
      imp:    { hp: 4,  w: 12, h: 18, dmg: 1, sp: 46,  score: 'Duende Ceniza' },
      bat:    { hp: 3,  w: 12, h: 12, dmg: 1, sp: 62,  score: 'Murciélago Sombra' },
      golem:  { hp: 10, w: 22, h: 32, dmg: 2, sp: 22,  score: 'Golem de Raíz' },
      wyvern: { hp: 16, w: 26, h: 24, dmg: 2, sp: 58,  score: 'Wyvern de Ceniza' }
    }[kind];
    this.hp = this.maxHp = S.hp;
    this.w = S.w; this.h = S.h; this.dmg = S.dmg; this.sp = S.sp;
    this.name = S.score;
    this.flying = (kind === 'bat' || kind === 'wyvern');
  }

  get box() { return { x: this.x - this.w / 2, y: this.y - this.h, w: this.w, h: this.h }; }
  get cx() { return this.x; }
  get cy() { return this.y - this.h / 2; }

  hurt(dmg, fromX, game) {
    if (!this.alive) return;
    this.hp -= dmg;
    this.hurtT = .18; this.stun = .16;
    this.vx += U.sign(this.x - fromX) * 120;
    if (!this.flying) this.vy -= 60;
    FX.text(this.cx, this.y - this.h - 4, String(dmg), PAL.sun, 7);
    if (this.hp <= 0) this.kill(game);
  }

  kill(game) {
    this.alive = false;
    const col = this.kind === 'golem' ? PAL.moss : this.kind === 'wyvern' ? PAL.rose : PAL.plum;
    FX.gore(this.cx, this.cy, this.kind === 'golem' ? 20 : 12, col);
    FX.burst(this.cx, this.cy, 12, { col: PAL.vio2, life: .6, speed: 130, glow: 5, kind: 'magic' });
    FX.ring(this.cx, this.cy, { col, speed: 240, life: .4, width: 2 });
    Audio_.sfx(this.kind === 'wyvern' ? 'roar' : 'crit');
    Cam.shake(this.kind === 'golem' || this.kind === 'wyvern' ? 3 : 1.2, .22);
    Screen.freeze(.05);
    game.onEnemyKilled(this);
  }

  update(dt, game) {
    if (!this.alive) return;
    this.t += dt;
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.stun = Math.max(0, this.stun - dt);
    this.cd = Math.max(0, this.cd - dt);

    const p = game.player;
    const dx = p.cx - this.cx, dy = p.cy - this.cy;
    const dist = Math.hypot(dx, dy);

    if (this.stun <= 0) {
      switch (this.kind) {
        case 'imp':    this.aiImp(dt, game, dx, dist); break;
        case 'bat':    this.aiBat(dt, game, dx, dy, dist); break;
        case 'golem':  this.aiGolem(dt, game, dx, dist); break;
        case 'wyvern': this.aiWyvern(dt, game, dx, dy, dist); break;
      }
    }

    // física
    if (!this.flying) {
      this.vy = Math.min(this.vy + GRAV * dt, MAXFALL);
      this.x += this.vx * dt;
      let s = World.solidAt(this.box);
      if (s) {
        this.x -= this.vx * dt;
        this.vx = 0; this.dir *= -1;
      }
      this.y += this.vy * dt;
      s = World.solidAt(this.box);
      if (s) {
        if (this.vy > 0) { this.y = s.y - .01; this.onGround = true; }
        else this.y = s.y + s.h + this.h + .01;
        this.vy = 0;
      } else this.onGround = false;
      // no se despeña: comprueba el suelo por delante
      if (this.onGround && this.state === 'patrol') {
        const probe = { x: this.x + this.dir * (this.w / 2 + 3), y: this.y + 2, w: 2, h: 6 };
        if (!World.solidAt(probe)) { this.dir *= -1; this.vx = 0; }
      }
      this.vx = U.approach(this.vx, 0, 400 * dt);
    } else {
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.vx = U.approach(this.vx, 0, 100 * dt);
      this.vy = U.approach(this.vy, 0, 100 * dt);
    }

    // contacto con el héroe
    if (!p.dead && !p.dragonForm && U.aabb(this.box, p.box)) p.hurt(this.dmg, this.cx, game);
    if (p.dragonForm && U.aabb(this.box, p.dragonBox)) this.hurt(3, p.x, game);

    if (this.y > World.L.deathY + 60) this.alive = false;
  }

  aiImp(dt, game, dx, dist) {
    if (dist < 120 && Math.abs(game.player.y - this.y) < 50) {
      this.state = 'chase';
      this.dir = U.sign(dx) || this.dir;
      this.vx = U.approach(this.vx, this.dir * this.sp * 1.9, 500 * dt);
      // salto de embestida
      if (dist < 46 && this.onGround && this.cd <= 0) {
        this.vy = -200; this.vx = this.dir * 150; this.cd = 1.3;
      }
    } else {
      this.state = 'patrol';
      this.vx = U.approach(this.vx, this.dir * this.sp, 300 * dt);
      if (Math.abs(this.x - this.homeX) > 70) this.dir = U.sign(this.homeX - this.x);
    }
  }

  aiBat(dt, game, dx, dy, dist) {
    this.dir = U.sign(dx) || this.dir;
    if (dist < 150) {
      this.state = 'chase';
      const a = Math.atan2(dy, dx);
      this.vx = U.damp(this.vx, Math.cos(a) * this.sp * 1.5, 3, dt);
      this.vy = U.damp(this.vy, Math.sin(a) * this.sp * 1.5, 3, dt);
    } else {
      this.state = 'patrol';
      this.vx = Math.cos(this.t * 1.2) * this.sp;
      this.vy = Math.sin(this.t * 2.4) * 30 + (this.homeY - this.y) * .8;
    }
  }

  aiGolem(dt, game, dx, dist) {
    this.dir = U.sign(dx) || this.dir;
    if (dist < 190 && this.cd <= 0 && Math.abs(dx) > 40) {
      this.cd = 2.4;
      this.state = 'throw';
      const a = Math.atan2((game.player.cy - 30) - this.cy, dx);
      game.projectiles.push(new Projectile(this.cx + this.dir * 10, this.cy - 8,
        Math.cos(a) * 150, Math.sin(a) * 150 - 60,
        { team: 'enemy', dmg: this.dmg, kind: 'rock', life: 3, grav: 300, w: 9, h: 9 }));
      Audio_.sfx('swing');
    }
    if (dist < 150) this.vx = U.approach(this.vx, this.dir * this.sp, 160 * dt);
    else {
      this.vx = U.approach(this.vx, this.dir * this.sp * .5, 120 * dt);
      if (Math.abs(this.x - this.homeX) > 60) this.dir = U.sign(this.homeX - this.x);
    }
  }

  aiWyvern(dt, game, dx, dy, dist) {
    this.dir = U.sign(dx) || this.dir;
    if (dist < 230) {
      // mantiene altura sobre el héroe y escupe fuego
      const targetY = game.player.cy - 54 + Math.sin(this.t * 1.4) * 16;
      this.vy = U.damp(this.vy, (targetY - this.cy) * 2.2, 3, dt);
      this.vx = U.damp(this.vx, U.clamp(dx, -1, 1) * this.sp, 2, dt);
      if (this.cd <= 0) {
        this.cd = 1.7;
        const a = Math.atan2(game.player.cy - this.cy, dx);
        for (let i = -1; i <= 1; i++)
          game.projectiles.push(new Projectile(this.cx + this.dir * 16, this.cy,
            Math.cos(a + i * .22) * 190, Math.sin(a + i * .22) * 190,
            { team: 'enemy', dmg: this.dmg, kind: 'fire', life: 2.2, w: 9, h: 9 }));
        Audio_.sfx('fire');
      }
      // embestida ocasional
      if (dist < 90 && this.cd > 1.3 && Math.random() < .02) {
        this.vx = U.sign(dx) * 260; this.vy = dy * 2;
        Audio_.sfx('wing');
      }
    } else {
      this.vx = Math.cos(this.t * .8) * this.sp;
      this.vy = (this.homeY - this.y) * 1.2 + Math.sin(this.t * 2) * 20;
    }
  }

  draw(c, camx) {
    if (!this.alive) return;
    const x = Math.round(this.x - camx), y = Math.round(this.y);
    if (x < -60 || x > W + 60) return;

    // sombra
    if (!this.flying) { c.save(); c.globalAlpha = .25; ell(c, x, y - 1, this.w / 2, 2, '#000'); c.restore(); }

    c.save(); c.translate(x, y);
    if (this.hurtT > 0) { c.globalAlpha = .9; }
    const st = { t: this.t, dir: this.dir, angry: this.state === 'chase' };
    switch (this.kind) {
      case 'imp':    Bestiary.imp(c, st); break;
      case 'bat':    Bestiary.bat(c, st); break;
      case 'golem':  Bestiary.golem(c, st); break;
      case 'wyvern': Bestiary.wyvern(c, st); break;
    }
    c.restore();

    // destello blanco al recibir daño
    if (this.hurtT > 0) {
      c.save();
      c.globalAlpha = this.hurtT / .18 * .8;
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = 'rgba(255,220,220,.9)';
      c.fillRect(x - this.w / 2 - 2, y - this.h - 6, this.w + 4, this.h + 8);
      c.restore();
    }

    // barra de vida para los enemigos grandes
    if ((this.kind === 'golem' || this.kind === 'wyvern') && this.hp < this.maxHp) {
      const bw = this.w + 8;
      R(c, x - bw / 2, y - this.h - 12, bw, 3, '#1a0f20');
      R(c, x - bw / 2, y - this.h - 12, bw * (this.hp / this.maxHp), 3,
        this.hp / this.maxHp > .4 ? PAL.rose : PAL.blood);
      R(c, x - bw / 2, y - this.h - 12, bw, 1, 'rgba(255,255,255,.2)');
    }
  }
}

/* =========================================================================
   OBJETOS RECOGIBLES — corazones, viales y ecos de memoria.
   ========================================================================= */
class Pickup {
  constructor(x, y, kind, id) {
    this.x = x; this.y = y; this.kind = kind; this.id = id;
    this.t = U.rand(10); this.taken = false; this.w = 12; this.h = 12;
  }
  get box() { return { x: this.x - 7, y: this.y - 7, w: 14, h: 14 }; }

  update(dt, game) {
    if (this.taken) return;
    this.t += dt;
    if (this.kind === 'memory' && Math.random() < .3)
      FX.spawn({ x: this.x + U.rand(7, -7), y: this.y + U.rand(7, -7), vx: 0, vy: -14,
        life: .8, size: 1, col: PAL.blush, kind: 'magic', glow: 4 });
    if (U.aabb(this.box, game.player.box)) this.take(game);
  }

  take(game) {
    this.taken = true;
    const p = game.player;
    if (this.kind === 'hp') { p.heal(2); Audio_.sfx('pickup'); FX.burst(this.x, this.y, 10, { col: PAL.blush, glow: 5 }); }
    else if (this.kind === 'mp') { p.giveMp(35); Audio_.sfx('pickup'); FX.burst(this.x, this.y, 10, { col: PAL.ice, glow: 5 }); }
    else if (this.kind === 'memory') game.collectMemory(this.id, this.x, this.y);
  }

  draw(c, camx) {
    if (this.taken) return;
    const x = Math.round(this.x - camx), y = Math.round(this.y + Math.sin(this.t * 2.2) * 2.5);
    if (x < -30 || x > W + 30) return;
    if (this.kind === 'hp') {
      R(c, x - 4, y - 3, 3, 3, PAL.blush); R(c, x + 1, y - 3, 3, 3, PAL.blush);
      R(c, x - 4, y, 8, 3, PAL.blush); R(c, x - 2, y + 3, 4, 2, PAL.rose);
      R(c, x - 1, y + 5, 2, 1, PAL.rose); R(c, x - 3, y - 2, 2, 2, PAL.pink);
      glow(c, x, y, 13, 'rgba(212,106,140,.55)', .55);
    } else if (this.kind === 'mp') {
      R(c, x - 3, y - 5, 6, 2, PAL.steel);
      R(c, x - 4, y - 3, 8, 8, PAL.ice);
      R(c, x - 3, y, 6, 5, PAL.aqua);
      R(c, x - 2, y - 2, 2, 3, PAL.white);
      glow(c, x, y, 13, 'rgba(168,230,240,.55)', .55);
    } else {
      // Eco de memoria: fragmento de cristal con el recuerdo dentro
      const p = .8 + Math.sin(this.t * 3) * .2;
      c.save(); c.translate(x, y); c.rotate(this.t * .6);
      R(c, -3, -6, 6, 12, PAL.blush);
      R(c, -5, -3, 10, 6, PAL.pink);
      R(c, -1, -5, 2, 10, PAL.cream);
      c.restore();
      glow(c, x, y, 22 * p, 'rgba(242,148,180,.65)', .6);
      glow(c, x, y, 44 * p, 'rgba(212,106,140,.2)', .5);
    }
  }
}

/* Farol de memoria — punto de control. */
class Checkpoint {
  constructor(x, y, id, name) {
    this.x = x; this.y = y; this.id = id; this.name = name;
    this.lit = false; this.t = U.rand(10); this.pulse = 0;
  }
  update(dt, game) {
    this.t += dt;
    this.pulse = Math.max(0, this.pulse - dt);
    if (this.lit) { if (Math.random() < .25) FX.ember(this.x, this.y - 26, 1); return; }
    if (Math.abs(game.player.x - this.x) < 22 && Math.abs(game.player.y - this.y) < 40)
      game.lightCheckpoint(this);
  }
  draw(c, camx) {
    const x = Math.round(this.x - camx);
    if (x < -40 || x > W + 40) return;
    Props.lantern(c, x, this.y, this.t, this.lit);
    if (this.pulse > 0) {
      c.save(); c.globalAlpha = this.pulse;
      c.strokeStyle = PAL.gold; c.lineWidth = 2;
      c.beginPath(); c.arc(x, this.y - 24, (1 - this.pulse) * 60, 0, TAU); c.stroke();
      c.restore();
    }
  }
}

/* =========================================================================
   CORAZÓN DE DRAGÓN — 08-game.js
   Escenas, pantalla de título, partida, batalla final y créditos.
   ========================================================================= */
'use strict';

/* =========================================================================
   ARTE DE LA PANTALLA DE TÍTULO
   Un castillo al amanecer, cielo celeste, campo de girasoles y el caballero
   mirando el horizonte desde la montaña.
   ========================================================================= */
const TitleArt = {
  draw(c, t) {
    /* --- cielo celeste --- */
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#54b4e4');
    g.addColorStop(.34, '#8ad4f0');
    g.addColorStop(.66, '#c9ecf7');
    g.addColorStop(1, '#f6ecc8');
    c.fillStyle = g; c.fillRect(0, 0, W, H);

    /* --- sol y su halo --- */
    const sx = 372, sy = 54;
    glow(c, sx, sy, 92, 'rgba(255,245,200,.55)', .8);
    glow(c, sx, sy, 40, 'rgba(255,255,235,.8)', .9);
    ell(c, sx, sy, 16, 16, '#fffce8');

    /* --- bandadas lejanas --- */
    for (let f = 0; f < 3; f++) {
      const fx = ((t * (9 + f * 5) + f * 180) % (W + 160)) - 80;
      const fy = 40 + f * 22 + Math.sin(t * .6 + f) * 6;
      for (let i = 0; i < 6 - f; i++) {
        const bx = fx + i * 10 - (i % 2) * 4, by = fy + (i % 3) * 5;
        const fl = Math.sin(t * 7 + i * 1.2 + f);
        c.globalAlpha = .45;
        R(c, bx - 2, by - Math.round(fl * 1.4), 2, 1, '#3a5a70');
        R(c, bx + 1, by - Math.round(fl * 1.4), 2, 1, '#3a5a70');
        c.globalAlpha = 1;
      }
    }

    /* --- nubes blancas en tres profundidades --- */
    const cloud = (x, y, s, col, a) => {
      c.globalAlpha = a;
      ell(c, x, y, 26 * s, 8 * s, col);
      ell(c, x - 18 * s, y + 3 * s, 15 * s, 5 * s, col);
      ell(c, x + 19 * s, y + 3 * s, 14 * s, 5 * s, col);
      ell(c, x + 4 * s, y - 6 * s, 14 * s, 7 * s, col);
      ell(c, x - 8 * s, y - 4 * s, 11 * s, 6 * s, col);
      c.globalAlpha = 1;
    };
    for (let i = 0; i < 6; i++) {
      const x = ((hash(i, 201) * 900 - t * (5 + i * 1.5)) % 900 + 900) % 900 - 160;
      cloud(x, 28 + hash(i, 202) * 34, .7 + hash(i, 203) * .5, '#ffffff', .9);
    }
    for (let i = 0; i < 4; i++) {
      const x = ((hash(i, 211) * 800 - t * 3) % 800 + 800) % 800 - 140;
      cloud(x, 74 + hash(i, 212) * 18, .55, '#eaf6ff', .65);
    }

    /* --- cordillera lejana azulada --- */
    c.fillStyle = '#8ab0c8';
    c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W; x += 6) {
      const h = 132 - Math.abs(Math.sin(x * .0055)) * 44 - Math.abs(Math.sin(x * .014)) * 16;
      c.lineTo(x, h);
    }
    c.lineTo(W, H); c.closePath(); c.fill();
    // nieve en las cimas
    c.fillStyle = '#e8f4ff';
    for (let x = 0; x <= W; x += 6) {
      const h = 132 - Math.abs(Math.sin(x * .0055)) * 44 - Math.abs(Math.sin(x * .014)) * 16;
      if (h < 104) R(c, x, h, 6, 4, '#e8f4ff');
    }

    /* --- el castillo en el horizonte, a la derecha --- */
    this.castle(c, 322, 158, .92, t);

    /* --- colinas verdes escalonadas --- */
    const hill = (base, amp, col, freq, off) => {
      c.fillStyle = col;
      c.beginPath(); c.moveTo(0, H);
      for (let x = 0; x <= W; x += 5)
        c.lineTo(x, base - Math.sin((x + off) * freq) * amp - Math.sin((x + off) * freq * 2.7) * amp * .35);
      c.lineTo(W, H); c.closePath(); c.fill();
    };
    hill(168, 8, '#6fae63', .006, 0);
    hill(186, 10, '#589a52', .0075, 120);
    hill(206, 12, '#457f45', .009, 260);

    const wind = Math.sin(t * .9) * .6 + .7;

    /* --- mariposas sobre el valle --- */
    for (let i = 0; i < 5; i++) {
      const bx = (hash(i, 261) * W + Math.sin(t * .8 + i * 2) * 36) % W;
      const by = 186 + hash(i, 262) * 34 + Math.sin(t * 2.2 + i) * 8;
      const fl = Math.abs(Math.sin(t * 12 + i));
      R(c, bx, by, 1, 2, '#3a2a30');
      R(c, bx - 1 - fl * 2, by - 1, 2, 2, '#ffce6a');
      R(c, bx + 1 + fl * 2, by - 1, 2, 2, '#ffce6a');
    }

    /* --- la montaña del mirador, a la izquierda --- */
    // el promontorio desde el que él contempla el horizonte
    c.fillStyle = '#5c7a68';
    c.beginPath();
    c.moveTo(-10, H); c.lineTo(-10, 214);
    c.lineTo(40, 186); c.lineTo(96, 178); c.lineTo(132, 196);
    c.lineTo(150, 236); c.lineTo(150, H);
    c.closePath(); c.fill();
    // cara iluminada y sombra
    c.fillStyle = '#6d8f77';
    c.beginPath();
    c.moveTo(-10, 214); c.lineTo(40, 186); c.lineTo(96, 178); c.lineTo(88, 196); c.lineTo(-10, 226);
    c.closePath(); c.fill();
    c.fillStyle = '#425c4e';
    c.beginPath();
    c.moveTo(132, 196); c.lineTo(150, 236); c.lineTo(150, H); c.lineTo(112, H);
    c.closePath(); c.fill();
    // roca desnuda asomando
    for (let i = 0; i < 9; i++) {
      const rx = 4 + hash(i, 271) * 126, ry = 208 + hash(i, 272) * 46;
      R(c, rx, ry, 8 + hash(i, 273) * 10, 3, '#4a6455');
      R(c, rx, ry, 5, 1, '#7d9d87');
    }
    // hierba en el filo del mirador
    for (let i = 0; i < 46; i++) {
      const gx = -6 + hash(i, 281) * 150;
      const gy = 214 - (gx < 96 ? (gx + 10) * .34 : 0) - (gx >= 96 ? -(gx - 96) * .5 : 0);
      const sw = Math.sin(t * 1.9 + i) * wind * 1.6;
      R(c, gx + sw, Math.max(178, gy) - 5, 1, 6, '#6aa864');
    }

    /* --- él, de espaldas, mirando el castillo --- */
    c.save();
    c.translate(74, 184);
    c.scale(1.9, 1.9);
    this.knightBack(c, t, wind);
    c.restore();
    // brisa a su alrededor: hojas que cruzan el mirador
    if (Math.random() < .25)
      FX.spawn({ x: 30 + U.rand(90), y: 160 + U.rand(30), vx: U.rand(60, 24), vy: U.rand(-14, -30),
        life: 2.4, size: 2, col: '#8fd07a', col2: '#ffce6a', kind: 'leaf', grav: 12, drag: 1, tag: U.rand(9) });

    /* --- campo de girasoles en primer plano, bien pegado al borde --- */
    for (let i = 0; i < 170; i++) {
      const x = hash(i, 221) * W;
      const y = 224 + hash(i, 222) * 50;
      const sw = Math.sin(t * 1.6 + x * .05) * wind * 2;
      R(c, x + sw, y - 6, 1, 7, '#3e7a4e');
    }
    const rows = [
      { y: 228, s: .55, n: 24, seed: 231 },
      { y: 248, s: .8,  n: 19, seed: 241 },
      { y: 272, s: 1.1, n: 14, seed: 251 }
    ];
    rows.forEach(row => {
      for (let i = 0; i < row.n; i++) {
        const x = (i + hash(i, row.seed) * .8) * (W / row.n) + 4;
        this.sunflower(c, x, row.y, row.s, t + hash(i, row.seed + 1) * 6, wind);
      }
    });
    FX.draw(c, 'over');
  },

  /* Girasol del campo: con escala propia para las tres hileras y viento. */
  sunflower(c, x, y, s, t, wind) {
    const sway = Math.sin(t * 1.4 + x * .03) * wind * (2 + s * 2);
    const h = (16 + Math.sin(x) * 4) * s;
    const S = v => v * s;
    // tallo curvado por el viento
    for (let i = 0; i < h; i++) {
      const p = i / h;
      R(c, x + sway * p * p, y - i, Math.max(1, S(1.6)), 1, p > .5 ? '#3e7a4e' : '#4f9159');
    }
    // hojas
    const lx = x + sway * .35, ly = y - h * .5;
    ell(c, lx - S(5), ly, S(5), S(2.2), '#4a8f5c');
    ell(c, lx + S(5), ly - S(4), S(5), S(2.2), '#5ea862');
    // corola
    const cx = x + sway, cy = y - h - S(3);
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * TAU + t * .12 + x;
      ell(c, cx + Math.cos(a) * S(5), cy + Math.sin(a) * S(5), S(3.2), S(2.6),
        i % 2 ? '#ffce6a' : '#ffb840');
    }
    ell(c, cx, cy, S(4), S(3.4), '#8a5a22');
    ell(c, cx - S(1), cy - S(1), S(2.4), S(2), '#a87038');
    if (s > .9) glow(c, cx, cy, S(14), 'rgba(255,206,106,.28)', .5);
  },

  /* Castillo con torres, banderas y puente — la meta del viaje. */
  castle(c, x, y, s, t) {
    const S = v => v * s;
    // peñasco sobre el que se asienta
    c.fillStyle = '#7a93a8';
    tri(c, x - S(78), y + S(34), x + S(78), y + S(34), x, y + S(6), '#7a93a8');
    R(c, x - S(64), y + S(16), S(128), S(24), '#7a93a8');
    R(c, x - S(64), y + S(16), S(128), S(3), '#94adc0');

    const wall = '#dfe6ee', wallD = '#b9c4d2', wallS = '#94a2b4', roof = '#4a6fa8', roofL = '#6a92c8';
    // muralla
    R(c, x - S(52), y - S(14), S(104), S(32), wall);
    R(c, x - S(52), y - S(14), S(104), S(3), '#f2f6fa');
    R(c, x - S(52), y + S(14), S(104), S(4), wallS);
    for (let i = 0; i < 13; i++) R(c, x - S(52) + i * S(8), y - S(19), S(5), S(6), wallD);
    // puerta
    R(c, x - S(8), y + S(2), S(16), S(16), '#4a3a44');
    ell(c, x, y + S(2), S(8), S(7), '#4a3a44');
    R(c, x - S(6), y + S(6), S(12), S(12), '#2f2530');
    // torres laterales
    const tower = (tx, h, w) => {
      R(c, tx - w / 2, y - h, w, h + S(18), wall);
      R(c, tx - w / 2, y - h, w * .3, h + S(18), '#f2f6fa');
      R(c, tx + w * .2, y - h, w * .3, h + S(18), wallD);
      for (let i = 0; i < 5; i++) R(c, tx - w / 2, y - h + i * S(9), w, 1, wallS);
      R(c, tx - w / 2 - S(3), y - h - S(5), w + S(6), S(6), wallD);
      for (let i = 0; i < 4; i++) R(c, tx - w / 2 - S(2) + i * S(6), y - h - S(9), S(4), S(5), wall);
      tri(c, tx - w / 2 - S(4), y - h - S(9), tx + w / 2 + S(4), y - h - S(9), tx, y - h - S(30), roof);
      tri(c, tx - w / 2 - S(4), y - h - S(9), tx, y - h - S(9), tx - S(2), y - h - S(28), roofL);
      // ventanas
      R(c, tx - S(2), y - h + S(12), S(4), S(6), '#3a4a66');
      R(c, tx - S(2), y - h + S(26), S(4), S(6), '#3a4a66');
      // bandera
      const fw = Math.sin(t * 3 + tx) * S(2);
      R(c, tx, y - h - S(30), 1, S(10), '#6a5a4a');
      tri(c, tx + 1, y - h - S(30), tx + S(10) + fw, y - h - S(27), tx + 1, y - h - S(23), '#d4425e');
    };
    tower(x - S(46), S(52), S(18));
    tower(x + S(46), S(52), S(18));
    // torre del homenaje
    R(c, x - S(20), y - S(62), S(40), S(52), wall);
    R(c, x - S(20), y - S(62), S(12), S(52), '#f2f6fa');
    R(c, x + S(10), y - S(62), S(10), S(52), wallD);
    for (let i = 0; i < 6; i++) R(c, x - S(20), y - S(62) + i * S(9), S(40), 1, wallS);
    R(c, x - S(24), y - S(68), S(48), S(7), wallD);
    for (let i = 0; i < 6; i++) R(c, x - S(23) + i * S(8), y - S(73), S(5), S(6), wall);
    tri(c, x - S(25), y - S(73), x + S(25), y - S(73), x, y - S(104), roof);
    tri(c, x - S(25), y - S(73), x, y - S(73), x - S(4), y - S(100), roofL);
    R(c, x - S(6), y - S(50), S(12), S(14), '#3a4a66');
    ell(c, x, y - S(50), S(6), S(5), '#3a4a66');
    glow(c, x, y - S(44), S(16), 'rgba(255,220,150,.35)', .5);
    // estandarte principal
    const fw2 = Math.sin(t * 2.6) * S(3);
    R(c, x, y - S(104), 1, S(12), '#6a5a4a');
    tri(c, x + 1, y - S(104), x + S(14) + fw2, y - S(100), x + 1, y - S(94), '#ffce6a');
    // resplandor general
    glow(c, x, y - S(40), S(90), 'rgba(255,250,220,.18)', .5);
  },

  /* El caballero visto de espaldas, capa al viento. */
  knightBack(c, t, wind) {
    const C = Denzel.C;
    const breath = Math.sin(t * 1.6) * .5;
    // capa ondeando (de espaldas ocupa casi todo)
    for (let i = 0; i < 16; i++) {
      const p = i / 15;
      const sway = Math.sin(t * 2.2 - p * 2.6) * (1 + p * 5) * wind;
      const wid = 11 - p * 4;
      R(c, -wid / 2 + sway, -26 + i * 1.7, wid, 2,
        i < 3 ? C.capeL : (i > 11 ? C.capeD : C.cape));
    }
    // piernas
    R(c, -4, -9, 3, 9, C.mailD);
    R(c, 1, -9, 3, 9, C.mail);
    R(c, -5, -2, 5, 3, C.boot);
    R(c, 1, -2, 5, 3, C.bootL);
    // torso
    R(c, -5, -22 + breath * .3, 10, 13, C.mail);
    R(c, -5, -22 + breath * .3, 10, 2, C.mailL);
    R(c, -6, -23, 4, 4, C.plate);
    R(c, 2, -23, 4, 4, C.plate);
    // cabeza de espaldas: pelo y diadema
    R(c, -4, -31 + breath * .3, 8, 9, C.hair);
    R(c, -4, -31 + breath * .3, 8, 2, C.hairL);
    R(c, 4, -28, 3, 3, C.skinL);     // oreja élfica
    R(c, -7, -28, 3, 3, C.skinL);
    R(c, -5, -32 + breath * .3, 10, 1, C.trim);
    // espada clavada en la roca a su lado
    R(c, 9, -20, 2, 20, C.blade);
    R(c, 8, -20, 4, 2, C.hilt);
    R(c, 9, -24, 2, 5, C.blade);
    glow(c, 10, -18, 12, 'rgba(255,233,168,.3)', .45);
  }
};

const Game = {
  cv: null, c: null, scene: 'boot', t: 0, sceneT: 0,
  save: null, player: null, enemies: [], projectiles: [], pickups: [], checkpoints: [],
  boss: null, towerLeslie: null,
  controlEnabled: true, arenaLock: null,
  menuIdx: 0, optIdx: 0, pendingScene: null, introIdx: 0, introT: 0, introFade: 0,
  lastBiome: '', bossPhaseCine: 0, crystalDone: false, endT: 0, creditT: 0,
  memoryPopup: null, paused: false, pauseIdx: 0,

  /* ------------------------------------------------------------- inicio -- */
  init() {
    this.cv = document.getElementById('game');
    this.c = this.cv.getContext('2d', { alpha: false });
    this.c.imageSmoothingEnabled = false;
    Input.init();
    FX.init();
    Lights.init();
    this.save = Save.load();
    this.resize();
    addEventListener('resize', () => this.resize());

    // el navegador exige un gesto del usuario para arrancar el audio
    const boot = document.getElementById('boot');
    const go = () => {
      boot.classList.add('gone');
      Audio_.init(); Audio_.resume();
      this.toScene('loading');
      Loading.start('Despertando Eldrehal');
      this.pendingScene = 'title';
      boot.removeEventListener('pointerdown', go);
      removeEventListener('keydown', go);
    };
    boot.addEventListener('pointerdown', go);
    addEventListener('keydown', go);

    Loop.start((dt) => this.update(dt), () => this.render());
  },

  /* Escala del lienzo.
     La escala entera mantiene el píxel perfectamente cuadrado, pero si deja
     mucho hueco sin usar (p. ej. 1280x760 da ×2 y desperdicia un tercio de
     la ventana) el juego se ve pequeño sin motivo. Cuando la escala entera
     aprovecha menos del 85 % del alto, se usa la fraccionaria: con
     `image-rendering: pixelated` sigue viéndose nítida.                     */
  resize() {
    const libre = Math.min(innerWidth / W, innerHeight / H);
    const entera = Math.max(1, Math.floor(libre));
    const sc = (entera / libre >= .85) ? entera : libre;
    this.cv.style.width = Math.floor(W * sc) + 'px';
    this.cv.style.height = Math.floor(H * sc) + 'px';
  },

  toScene(s) {
    this.scene = s; this.sceneT = 0;
    Input.pressed = {};
  },
  toast(msg, col) { HUD.toast(msg, col); },

  /* ======================================================== actualizar == */
  update(dt) {
    this.t += dt; this.sceneT += dt;
    Screen.update(dt);
    if (Screen.freezeT > 0 && this.scene === 'play') { FX.update(dt * .15); return; }

    switch (this.scene) {
      case 'boot': break;
      case 'loading':  this.updLoading(dt); break;
      case 'title':    this.updTitle(dt); break;
      case 'controls': this.updControls(dt); break;
      case 'options':  this.updOptions(dt); break;
      case 'intro':    this.updIntro(dt); break;
      case 'play':     this.updPlay(dt); break;
      case 'gameover': this.updGameOver(dt); break;
      case 'ending':   this.updEnding(dt); break;
      case 'credits':  this.updCredits(dt); break;
    }
    FX.update(dt);
    HUD.update(dt);
  },

  /* ---------------------------------------------------------- carga ----- */
  updLoading(dt) {
    Loading.update(dt);
    // progreso simulado por etapas, con un trabajo real detrás
    const step = Math.min(1, Loading.t / 1.6);
    Loading.setTarget(step);
    if (Loading.t > .4 && !this._preDone) {
      this._preDone = true;
      LEVEL1.buildDecor();                 // precálculo real del decorado
    }
    if (Loading.done && (Input.hit('confirm') || Loading.t > 3.4)) {
      this._preDone = false;
      const next = this.pendingScene || 'title';
      this.pendingScene = null;
      if (next === 'play') this.startLevel();
      else if (next === 'intro') {
        this.introIdx = 0; this.introT = 0; this.introFade = 0;
        this.toScene('intro'); Audio_.playMusic('story');
      }
      else { this.toScene('title'); Audio_.playMusic('title'); }
      Screen.fadeA = 1; Screen.fadeTo(0, 1.4);
    }
  },

  /* --------------------------------------------------------- título ----- */
  updTitle(dt) {
    const items = this.titleItems();
    if (Input.hit('up'))   { this.menuIdx = (this.menuIdx - 1 + items.length) % items.length; Audio_.sfx('menu'); }
    if (Input.hit('down')) { this.menuIdx = (this.menuIdx + 1) % items.length; Audio_.sfx('menu'); }
    if (Input.hit('confirm')) {
      Audio_.sfx('select');
      const it = items[this.menuIdx];
      if (it.id === 'new') {
        Save.wipe(); this.save = Save.load();
        this.toScene('loading'); Loading.start('Escribiendo el prólogo');
        this.pendingScene = 'intro';
        Screen.fadeTo(0, 2);
      } else if (it.id === 'continue') {
        this.toScene('loading'); Loading.start('Volviendo al sendero');
        this.pendingScene = 'play';
      } else if (it.id === 'controls') { this.toScene('controls'); }
      else if (it.id === 'options') { this.optIdx = 0; this.toScene('options'); }
    }
  },
  titleItems() {
    const it = [];
    if (Save.has() && (this.save.checkpoint > 0 || this.save.seenIntro)) it.push({ id: 'continue', label: 'CONTINUAR' });
    it.push({ id: 'new', label: 'NUEVA PARTIDA' });
    it.push({ id: 'controls', label: 'CONTROLES' });
    it.push({ id: 'options', label: 'OPCIONES' });
    return it;
  },

  updControls(dt) {
    if (Input.hit('back') || Input.hit('confirm')) { Audio_.sfx('menu'); this.toScene(this.paused ? 'play' : 'title'); }
  },

  updOptions(dt) {
    const n = 4;
    if (Input.hit('up'))   { this.optIdx = (this.optIdx - 1 + n) % n; Audio_.sfx('menu'); }
    if (Input.hit('down')) { this.optIdx = (this.optIdx + 1) % n; Audio_.sfx('menu'); }
    const d = (Input.hit('right') ? 1 : 0) - (Input.hit('left') ? 1 : 0);
    if (d !== 0) {
      Audio_.sfx('menu');
      if (this.optIdx === 0) { this.save.music = U.clamp(this.save.music + d * .08, 0, .8); Audio_.setMusicVol(this.save.music); }
      if (this.optIdx === 1) { this.save.sfx = U.clamp(this.save.sfx + d * .08, 0, .9); Audio_.setSfxVol(this.save.sfx); Audio_.sfx('hit'); }
      if (this.optIdx === 2) { this.save.rumble = !this.save.rumble; Input.rumbleOn = this.save.rumble; if (this.save.rumble) Input.rumble(.6, .4, 200); }
      Save.write();
    }
    if (this.optIdx === 3 && Input.hit('confirm')) {
      Save.wipe(); this.save = Save.load();
      Audio_.sfx('die'); this.toast('Partida borrada', PAL.blush);
    }
    if (Input.hit('back')) { Audio_.sfx('menu'); Save.write(); this.toScene('title'); }
  },

  /* ------------------------------------------------------ introducción --
     Ninguna viñeta avanza sola: el texto se revela línea a línea y luego
     espera. Es una historia, no una cuenta atrás.
     Primera pulsación: muestra de golpe las líneas que falten.
     Segunda: pasa a la viñeta siguiente.                                   */
  INTRO_POR_LINEA: 1.15,          // segundos entre la aparición de dos líneas

  introRevealTime(sc) {
    return .35 + (sc.lines.length - 1) * this.INTRO_POR_LINEA + .6;
  },

  updIntro(dt) {
    this.introT += dt;
    const sc = STORY.intro[this.introIdx];
    if (!sc) { this.finishIntro(); return; }

    if (Input.hit('pause') || Input.hit('back')) { this.finishIntro(); return; }

    // fundido de salida antes de cambiar de viñeta
    if (this.introFade > 0) {
      this.introFade -= dt;
      if (this.introFade <= 0) this.nextIntro();
      return;
    }

    const listo = this.introT >= this.introRevealTime(sc);
    if (Input.hit('confirm') || Input.hit('attack') || Input.hit('jump')) {
      if (!listo) {
        this.introT = this.introRevealTime(sc);   // revela el resto del texto
        Audio_.sfx('menu');
      } else {
        this.introFade = .45;
        Audio_.sfx('page');
      }
    }
  },
  nextIntro() {
    this.introIdx++;
    this.introT = 0;
    this.introFade = 0;
    if (this.introIdx >= STORY.intro.length) this.finishIntro();
  },
  finishIntro() {
    this.save.seenIntro = true; Save.write();
    this.toScene('loading'); Loading.start('El sendero que recuerda');
    this.pendingScene = 'play';
    Screen.fadeTo(0, 1.6);
  },

  /* ======================================================= la partida === */
  startLevel() {
    World.load(LEVEL1);
    FX.clear();

    const s = this.save;
    this.player = new Player(0, 0);
    // al retomar la partida se empieza entero: el farol cura, como una
    // hoguera. Volver con un corazón a medias sólo encadena muertes.
    this.player.maxHp = s.maxHp; this.player.hp = s.maxHp;
    this.player.lives = s.lives; this.player.mp = this.player.maxMp;
    this.player.invT = 2;
    this.player.spawnGuard = 2;

    this.checkpoints = LEVEL1.checkpoints.map(cp => new Checkpoint(cp.x, cp.y, cp.id, cp.name));
    this.checkpoints.forEach(cp => { if (cp.id <= s.checkpoint) cp.lit = true; });

    this.pickups = LEVEL1.pickups.map(p => new Pickup(p.x, p.y, p.kind));
    LEVEL1.memories.forEach(m => {
      if (!s.memories.includes(m.id)) this.pickups.push(new Pickup(m.x, m.y, 'memory', m.id));
    });

    this.enemies = LEVEL1.spawns.map(sp => new Enemy(sp.x, sp.y, sp.kind));
    this.projectiles = [];
    this.boss = null; this.towerLeslie = null;
    this.arenaLock = null; this.controlEnabled = true;
    this.bossPhaseCine = 0; this.crystalDone = false;
    this.memoryPopup = null; this.paused = false;

    const cp = LEVEL1.checkpoints[s.checkpoint] || LEVEL1.checkpoints[0];
    this.player.x = cp.x; this.player.y = cp.y;
    Cam.minX = 0; Cam.maxX = LEVEL1.width - W;
    Cam.snap(this.player.x);

    this.toScene('play');
    Audio_.playMusic('forest');
    Screen.fadeA = 1; Screen.fadeTo(0, 1.2);
    this.lastBiome = '';

    if (s.checkpoint === 0 && !this._greeted) {
      this._greeted = true;
      Dialog.start(STORY.levelStart);
    }
  },

  updPlay(dt) {
    /* --- pausa --- */
    if (this.paused) { this.updPause(dt); return; }
    if (Input.hit('pause') && !Dialog.active && this.controlEnabled) {
      this.paused = true; this.pauseIdx = 0;
      Audio_.sfx('menu'); Audio_.duck(.3);
      return;
    }

    /* --- diálogo en curso: el mundo sigue vivo pero el héroe no responde --- */
    if (Dialog.active) {
      Dialog.update(dt);
      this.controlEnabled = false;
    } else if (!this._cineLock) {
      this.controlEnabled = true;
    }

    /* --- ventana emergente del eco de memoria: se cierra sólo al pulsar,
           nunca por tiempo: son los textos que cuentan la historia --- */
    if (this.memoryPopup) {
      this.memoryPopup.t += dt;
      if (this.memoryPopup.t > .4 && (Input.hit('confirm') || Input.hit('attack') || Input.hit('jump'))) {
        this.memoryPopup = null;
        Audio_.unduck();
      }
      return;
    }

    World.update(dt);
    Sky.update(dt, Cam.x);
    this.player.update(dt, this);

    for (const e of this.enemies) {
      if (!e.alive) continue;
      // sólo se activan cerca de la cámara: el nivel no se agota antes de llegar
      if (!e.awake) {
        if (Math.abs(e.x - this.player.x) < W * .72) e.awake = true;
        else continue;
      }
      e.update(dt, this);
    }
    this.enemies = this.enemies.filter(e => e.alive || e.awake === false ? true : e.alive);

    for (const p of this.projectiles) p.update(dt, this);
    this.projectiles = this.projectiles.filter(p => p.alive);

    for (const p of this.pickups) p.update(dt, this);
    for (const cp of this.checkpoints) cp.update(dt, this);

    if (this.boss) this.boss.update(dt, this);
    if (this.towerLeslie) this.towerLeslie.update(dt, this);

    /* --- cámara: mira hacia donde avanzas --- */
    const lead = U.clamp(this.player.vx * .32, -46, 46);
    Cam.follow(this.player.x, this.player.y, dt, lead);

    /* --- anuncio de zona --- */
    const bio = biomeAt(this.player.x);
    const nm = bio.t > .5 ? bio.b.name : bio.a.name;
    if (nm !== this.lastBiome) { this.lastBiome = nm; HUD.showZone(nm); }

    /* --- puerta del jefe --- */
    if (!this.boss && this.player.x > LEVEL1.bossGate) this.startBossFight();

    /* --- secuencias de la batalla --- */
    if (this.boss) this.updBossSequences(dt);

    /* --- muerte --- */
    if (this.player.dead && this.player.deadT > 1.6) this.onPlayerDead();

    this.save.time += dt;
  },

  updPause(dt) {
    const opts = ['CONTINUAR', 'CONTROLES', 'REINICIAR EN EL FAROL', 'VOLVER AL TÍTULO'];
    if (Input.hit('up'))   { this.pauseIdx = (this.pauseIdx - 1 + opts.length) % opts.length; Audio_.sfx('menu'); }
    if (Input.hit('down')) { this.pauseIdx = (this.pauseIdx + 1) % opts.length; Audio_.sfx('menu'); }
    if (Input.hit('pause') || Input.hit('back')) { this.paused = false; Audio_.unduck(); return; }
    if (Input.hit('confirm')) {
      Audio_.sfx('select');
      if (this.pauseIdx === 0) { this.paused = false; Audio_.unduck(); }
      else if (this.pauseIdx === 1) { this.toScene('controls'); }
      else if (this.pauseIdx === 2) { this.paused = false; Audio_.unduck(); this.respawn(); }
      else {
        this.paused = false; Audio_.unduck();
        this.persist();
        Audio_.playMusic('title');
        this.toScene('title'); this.menuIdx = 0;
      }
    }
  },

  /* ------------------------------------------------- puntos de control -- */
  lightCheckpoint(cp) {
    cp.lit = true; cp.pulse = 1;
    this.save.checkpoint = Math.max(this.save.checkpoint, cp.id);
    // encender un farol restaura al caballero por completo
    const p = this.player;
    const curado = p.hp < p.maxHp || p.mp < p.maxMp;
    p.hp = p.maxHp; p.mp = p.maxMp;
    if (curado) FX.holy(p.cx, p.cy, 20);
    this.persist();
    Audio_.sfx('check');
    HUD.toast('Farol encendido · ' + cp.name, PAL.gold);
    FX.ring(cp.x, cp.y - 24, { col: PAL.gold, speed: 260, life: .7, width: 2 });
    FX.holy(cp.x, cp.y - 24, 24);
    Screen.flash('rgba(255,206,106,.22)', .2);
    Input.rumble(.3, .2, 180);
  },

  persist() {
    const p = this.player;
    if (p) {
      this.save.hp = Math.max(1, p.hp);
      this.save.lives = p.lives;
      this.save.mp = p.mp;
      this.save.maxHp = p.maxHp;
    }
    Save.write();
  },

  collectMemory(id, x, y) {
    if (this.save.memories.includes(id)) return;
    this.save.memories.push(id);
    this.persist();
    Audio_.sfx('crystal');
    Audio_.duck(.35);
    Screen.flash('rgba(242,148,180,.3)', .3);
    FX.ring(x, y, { col: PAL.blush, speed: 300, life: .8, width: 2 });
    FX.burst(x, y, 24, { col: PAL.pink, col2: PAL.blush, life: 1.2, speed: 160, glow: 7, kind: 'magic' });
    Cam.shake(1.4, .3);
    this.memoryPopup = { t: 0, data: STORY.memories[id] };
    // cada eco fortalece el corazón del héroe
    if (this.save.memories.length % 2 === 0 && this.player.maxHp < 12) {
      this.player.maxHp += 2; this.player.hp = this.player.maxHp;
      HUD.toast('El recuerdo te da fuerza · +1 corazón', PAL.blush);
    }
  },

  onEnemyKilled(e) {
    // pequeña recompensa de maná por combate
    if (this.player && !this.player.dead) this.player.mp = Math.min(this.player.maxMp, this.player.mp + 6);
  },

  /* --------------------------------------------------- muerte y reinicio */
  onPlayerDead() {
    this.player.lives--;
    if (this.player.lives < 0) {
      this.save.lives = 3;
      this.persist();
      this.toScene('gameover');
      Audio_.stopMusic();
      Audio_.sfx('die');
      Screen.fadeTo(.55, 1.2);
      return;
    }
    this.persist();
    this.respawn();
  },

  respawn() {
    const s = this.save;
    const cp = LEVEL1.checkpoints[s.checkpoint] || LEVEL1.checkpoints[0];
    const lives = this.player ? this.player.lives : s.lives;
    const maxHp = this.player ? this.player.maxHp : s.maxHp;

    this.player = new Player(cp.x, cp.y);
    // se vuelve siempre entero: con la vida a la mitad, reaparecer junto a un
    // wyvern era morir otra vez antes de poder reaccionar
    this.player.maxHp = maxHp; this.player.hp = maxHp;
    this.player.lives = lives; this.player.mp = this.player.maxMp;
    // margen de gracia: 2,5 s intocable para orientarse al reaparecer
    this.player.invT = 2.5;
    this.player.spawnGuard = 2.5;

    // el mundo vuelve a su sitio, pero los faroles y los ecos siguen encendidos
    this.enemies = LEVEL1.spawns.map(sp => new Enemy(sp.x, sp.y, sp.kind));
    this.projectiles = [];
    this.pickups = LEVEL1.pickups.map(p => new Pickup(p.x, p.y, p.kind));
    LEVEL1.memories.forEach(m => {
      if (!s.memories.includes(m.id)) this.pickups.push(new Pickup(m.x, m.y, 'memory', m.id));
    });
    this.boss = null; this.towerLeslie = null; this.arenaLock = null;
    this.bossPhaseCine = 0; this.crystalDone = false;
    this._cineLock = false; this.controlEnabled = true;
    FX.clear();
    Cam.snap(this.player.x);
    Cam.minX = 0; Cam.maxX = LEVEL1.width - W;
    Screen.fadeA = 1; Screen.fadeTo(0, 1.6);
    Audio_.playMusic('forest');
    HUD.toast('Vidas restantes: ' + this.player.lives, PAL.leaf2);
  },

  updGameOver(dt) {
    if (this.sceneT > 1 && (Input.hit('confirm') || Input.hit('jump'))) {
      Audio_.sfx('select');
      this.player = null;
      this.toScene('loading'); Loading.start('El alba vuelve a intentarlo');
      this.pendingScene = 'play';
      Screen.fadeTo(0, 1.4);
    }
    if (this.sceneT > 1 && Input.hit('back')) {
      this.toScene('title'); Audio_.playMusic('title');
      Screen.fadeTo(0, 1.4);
    }
  },

  /* ===================================================== batalla final == */
  startBossFight() {
    this.arenaLock = { x: LEVEL1.bossArena.x, w: LEVEL1.bossArena.w };
    Cam.minX = this.arenaLock.x;
    Cam.maxX = this.arenaLock.x + this.arenaLock.w - W;
    this.boss = new Boss(this.arenaLock.x + this.arenaLock.w - 140, 200);
    this.towerLeslie = new TowerLeslie(LEVEL1.width + 60, 86);
    this.enemies = this.enemies.filter(e => e.x > this.arenaLock.x - 200 && e.alive);
    Audio_.playMusic('boss');
    Cam.shake(4, .8);
    Screen.flash('rgba(139,59,214,.35)', .4);
    this._cineLock = true;
    this.controlEnabled = false;
    this.bossPhaseCine = 1;
    HUD.showZone('Arena de la Torre Escarlata');
  },

  updBossSequences(dt) {
    const b = this.boss;

    /* 1 · entrada + diálogo inicial */
    if (this.bossPhaseCine === 1 && !b.entrance && !Dialog.active) {
      this.bossPhaseCine = 2;
      this.towerLeslie.mood = 'hope';
      Dialog.start(STORY.bossIntro, () => {
        this._cineLock = false;
        this.controlEnabled = true;
        this.bossPhaseCine = 3;
      });
    }

    /* 2 · fase 2: el caballero revela su forma verdadera */
    if (this.bossPhaseCine === 4 && !Dialog.active) {
      this.bossPhaseCine = 5;
      b.startPhase2();
      Audio_.playMusic('dragon');
      this._cineLock = false;
      this.controlEnabled = true;
    }

    /* 3 · el momento del cristal: cuando el dragón está debilitado */
    if (b.phase === 2 && !b.transforming && !this.crystalDone && b.hpPct <= .28 && b.alive) {
      this.crystalDone = true;
      this._cineLock = true;
      this.controlEnabled = false;
      this.towerLeslie.mood = 'summon';
      this.towerLeslie.crystal = true;
      this.towerLeslie.glowT = 1;
      Audio_.duck(.3);
      Audio_.sfx('crystal');
      Dialog.start(STORY.crystal, () => this.beginTransformation());
    }
  },

  beginBossTransformation() {
    this.boss.hp = 1;                    // se queda en pie para la cinemática
    this._cineLock = true;
    this.controlEnabled = false;
    this.bossPhaseCine = 4;
    this.towerLeslie.mood = 'worry';
    Audio_.duck(.35);
    Dialog.start(STORY.phase2);
  },

  /* --- Denzel se convierte en el Gran Dragón Dorado --- */
  beginTransformation() {
    const p = this.player;
    p.dragonUnlocked = true;
    this._cineLock = true;
    this.controlEnabled = false;

    Audio_.sfx('transform');
    Audio_.unduck();
    Screen.flash('#fff', .9);
    Cam.shake(7, 1.6);

    // el cristal de Leslie desciende hasta él
    const startX = W + Cam.x, startY = 70;
    FX.bolt(startX - 40, startY, p.cx, p.cy, { col: PAL.gold, col2: PAL.white, width: 3, life: .5, segs: 10 });
    FX.ring(p.cx, p.cy, { col: PAL.gold, speed: 520, life: 1.2, width: 4 });
    FX.ring(p.cx, p.cy, { col: PAL.white, speed: 760, life: 1.4, width: 2 });
    FX.burst(p.cx, p.cy, 70, { col: PAL.sun, col2: PAL.gold, life: 1.8, speed: 260, glow: 9, kind: 'holy' });

    setTimeout(() => {
      p.dragonForm = true; p.dragonT = 0;
      p.hp = p.maxHp; p.invT = 1.5;
      p.y = Math.min(p.y, 180);
      this._cineLock = false;
      this.controlEnabled = true;
      Audio_.playMusic('dragon');
      HUD.toast('CORAZÓN DE DRAGÓN · ' + Input.label('attack') + ' para el aliento dorado', PAL.gold);
      Screen.flash('rgba(255,206,106,.5)', .5);
      Cam.shake(5, 1);
      Input.rumble(1, .8, 600);
    }, 900);
  },

  onBossDefeated() {
    this.save.bossBeaten = true;
    this.persist();
    this._cineLock = true;
    this.controlEnabled = false;
    this.towerLeslie.mood = 'free';
    Audio_.stopMusic();
    Audio_.sfx('victory');
    setTimeout(() => {
      this.endT = 0;
      this.toScene('ending');
      Audio_.playMusic('ending');
    }, 3600);
  },

  /* -------------------------------------------------------- epílogo ----- */
  updEnding(dt) {
    this.endT += dt;
    if (this.endT > 1.6 && !this._endDialog) {
      this._endDialog = true;
      Dialog.start(STORY.ending, () => {
        this.save.finished = true; this.persist();
        this.creditT = 0;
        this.toScene('credits');
      });
    }
    if (Dialog.active) Dialog.update(dt);
  },

  updCredits(dt) {
    this.creditT += dt;
    if (this.creditT > 3 && (Input.hit('confirm') || Input.hit('back') || this.creditT > 34)) {
      this._endDialog = false;
      this.toScene('title');
      this.menuIdx = 0;
      Audio_.playMusic('title');
      Screen.fadeTo(0, 1.4);
    }
  },

  /* ========================================================== dibujar === */
  render() {
    const c = this.c;
    c.imageSmoothingEnabled = false;
    c.setTransform(1, 0, 0, 1, 0, 0);

    switch (this.scene) {
      case 'boot':     c.fillStyle = '#07040e'; c.fillRect(0, 0, W, H); break;
      case 'loading':  Loading.draw(c); break;
      case 'title':    this.drawTitle(c); break;
      case 'controls': this.drawControlsScene(c); break;
      case 'options':  this.drawOptions(c); break;
      case 'intro':    this.drawIntro(c); break;
      case 'play':     this.drawPlay(c); break;
      case 'gameover': this.drawPlay(c); this.drawGameOver(c); break;
      case 'ending':   this.drawEnding(c); break;
      case 'credits':  this.drawCredits(c); break;
    }
    Screen.drawOver(c);
  },

  /* ------------------------------------------------------ escena título -- */
  drawTitle(c) {
    TitleArt.draw(c, this.t);

    // velo superior ligero: el logo necesita contraste, el cielo seguir siendo cielo
    const g = c.createLinearGradient(0, 0, 0, 96);
    g.addColorStop(0, 'rgba(12,8,26,.42)');
    g.addColorStop(.7, 'rgba(12,8,26,.14)');
    g.addColorStop(1, 'rgba(12,8,26,0)');
    c.fillStyle = g; c.fillRect(0, 0, W, 96);

    // logotipo
    const bob = Math.sin(this.t * 1.2) * 1.5;
    txt(c, 'CORAZÓN', W / 2, 46 + bob, {
      size: 30, col: PAL.gold, align: 'center', letterSpacing: 6,
      glow: 'rgba(255,138,92,.85)', glowSize: 14, shadowCol: 'rgba(40,12,6,.95)'
    });
    txt(c, 'DE DRAGÓN', W / 2, 74 + bob, {
      size: 21, col: PAL.cream, align: 'center', letterSpacing: 5,
      glow: 'rgba(255,206,106,.6)', glowSize: 10, shadowCol: 'rgba(40,12,6,.95)'
    });
    R(c, W / 2 - 96, 81 + bob, 192, 1, 'rgba(255,206,106,.6)');
    // banda oscura tras el subtítulo para que se lea sobre el castillo
    c.save(); c.globalAlpha = .58;
    R(c, W / 2 - 104, 84 + bob, 208, 13, 'rgba(10,5,16,1)');
    c.restore();
    txt(c, 'La Balada de Denzel y Leslie', W / 2, 93 + bob,
      { size: 9, col: '#ffeccf', align: 'center', letterSpacing: 1, shadowCol: 'rgba(0,0,0,.95)' });

    // menú, a la derecha para no tapar al caballero
    const items = this.titleItems();
    const mx = 358, my = 168;
    panel(c, mx - 92, my - 22, 184, items.length * 22 + 18,
      { alpha: .6, fill: 'rgba(10,6,16,.8)' });
    items.forEach((it, i) => {
      const y = my + i * 22;
      const on = i === this.menuIdx;
      if (on) {
        const p = .5 + Math.sin(this.t * 5) * .5;
        R(c, mx - 87, y - 14, 174, 20, 'rgba(255,206,106,' + (.16 + p * .12) + ')');
        txt(c, '▶', mx - 82, y, { size: 12, col: PAL.gold });
        glow(c, mx, y - 5, 60, 'rgba(255,206,106,.22)', .5);
      }
      txt(c, it.label, mx, y, {
        size: 12, col: on ? PAL.cream : '#b3a2c4', align: 'center'
      });
    });

    // pie, sobre una banda para que se lea encima de los girasoles
    const foot = Input.padConnected
      ? 'Mando detectado · ' + Input.padLabel.confirm + ' para elegir'
      : 'Flechas para elegir · ' + Input.keyLabel.confirm + ' para confirmar';
    c.save(); c.globalAlpha = .55;
    R(c, W / 2 - textWidth(c, foot, 7) / 2 - 8, H - 18, textWidth(c, foot, 7) + 16, 13, 'rgba(10,5,16,1)');
    c.restore();
    txt(c, foot, W / 2, H - 9, { size: 7, col: 'rgba(255,240,215,.95)', align: 'center' });
    if (this.save.finished)
      txt(c, '✦ Sendero completado ✦', W - 8, 12, { size: 7, col: PAL.gold, align: 'right' });
  },

  drawControlsScene(c) {
    if (this.paused) { this.drawPlay(c); c.fillStyle = 'rgba(6,3,12,.8)'; c.fillRect(0, 0, W, H); }
    else { TitleArt.draw(c, this.t); c.fillStyle = 'rgba(6,3,12,.78)'; c.fillRect(0, 0, W, H); }
    Controls.draw(c, this.t, { y: 34 });
  },

  drawOptions(c) {
    TitleArt.draw(c, this.t);
    c.fillStyle = 'rgba(6,3,12,.78)'; c.fillRect(0, 0, W, H);
    panel(c, 90, 60, 300, 150);
    txt(c, 'OPCIONES', W / 2, 82, { size: 13, col: PAL.gold, align: 'center', bold: true, letterSpacing: 3 });
    R(c, 120, 88, 240, 1, 'rgba(255,206,106,.3)');

    const bar = (x, y, w, v, col) => {
      R(c, x, y - 4, w, 6, '#1a1024');
      R(c, x, y - 4, Math.round(w * v), 6, col);
      c.strokeStyle = 'rgba(255,255,255,.2)'; c.lineWidth = 1;
      c.strokeRect(x + .5, y - 3.5, w - 1, 5);
    };
    const rows = [
      { label: 'MÚSICA',    draw: y => bar(240, y, 100, this.save.music / .8, PAL.blush) },
      { label: 'EFECTOS',   draw: y => bar(240, y, 100, this.save.sfx / .9, PAL.ice) },
      { label: 'VIBRACIÓN', draw: y => txt(c, this.save.rumble ? 'ACTIVADA' : 'DESACTIVADA', 240, y + 2,
          { size: 8, col: this.save.rumble ? PAL.leaf2 : '#6a5a75' }) },
      { label: 'BORRAR PARTIDA', draw: y => txt(c, Input.label('confirm') + ' para borrar', 240, y + 2,
          { size: 8, col: '#c9556a' }) }
    ];
    rows.forEach((r, i) => {
      const y = 112 + i * 22;
      const on = i === this.optIdx;
      if (on) { R(c, 104, y - 10, 272, 16, 'rgba(255,206,106,.12)'); txt(c, '▶', 110, y + 2, { size: 8, col: PAL.gold }); }
      txt(c, r.label, 124, y + 2, { size: 8, col: on ? PAL.cream : '#9d8ab0', bold: on });
      r.draw(y);
    });
    txt(c, '← → ajustar · ' + Input.label('back') + ' volver', W / 2, 200,
      { size: 7, col: '#8a7a9a', align: 'center' });
  },

  /* ------------------------------------------------- escena de la intro -- */
  drawIntro(c) {
    const sc = STORY.intro[this.introIdx];
    if (!sc) { c.fillStyle = '#000'; c.fillRect(0, 0, W, H); return; }
    const full = this.introRevealTime(sc);
    const k = U.clamp(this.introT / Math.max(1, full), 0, 1);   // avance de la viñeta

    IntroArt[sc.art](c, this.t, k);
    FX.draw(c, 'over');

    // franjas cinematográficas: la inferior crece con el texto de la viñeta
    const banda = Math.max(52, sc.lines.length * 11 + 22);
    c.fillStyle = '#07040e';
    c.fillRect(0, 0, W, 22); c.fillRect(0, H - banda, W, banda);

    // texto que aparece línea a línea, sin prisa
    const baseY = H - banda + 14;
    let todas = true;
    sc.lines.forEach((ln, i) => {
      const start = .35 + i * this.INTRO_POR_LINEA;
      const a = U.clamp((this.introT - start) / .6, 0, 1);
      if (a < 1) todas = false;
      if (a <= 0) return;
      c.save(); c.globalAlpha = a;
      txt(c, ln, W / 2, baseY + i * 11, {
        size: 8, col: i === sc.lines.length - 1 ? PAL.cream : '#cbbcd8',
        align: 'center', shadowCol: 'rgba(0,0,0,.95)'
      });
      c.restore();
    });

    // aviso de continuar: sólo cuando ya se puede leer todo
    if (todas) {
      const bl = Math.sin(this.t * 3.4) > -.2;
      c.save(); c.globalAlpha = bl ? 1 : .35;
      const ultima = this.introIdx === STORY.intro.length - 1;
      txt(c, '▼ ' + Input.label('confirm') + (ultima ? ' · comenzar la aventura' : ' · continuar'),
        W / 2, H - 6, { size: 7, col: PAL.gold, align: 'center' });
      c.restore();
    }

    // fundidos: al entrar en la viñeta y al salir de ella
    if (this.introT < .5) {
      c.save(); c.globalAlpha = 1 - this.introT / .5;
      c.fillStyle = '#000'; c.fillRect(0, 0, W, H); c.restore();
    }
    if (this.introFade > 0) {
      c.save(); c.globalAlpha = U.clamp(1 - this.introFade / .45, 0, 1);
      c.fillStyle = '#000'; c.fillRect(0, 0, W, H); c.restore();
    }

    // progreso e indicaciones
    for (let i = 0; i < STORY.intro.length; i++) {
      R(c, W / 2 - STORY.intro.length * 5 + i * 10, 14, 6, 2,
        i === this.introIdx ? PAL.gold : (i < this.introIdx ? 'rgba(255,206,106,.4)' : 'rgba(255,255,255,.18)'));
    }
    txt(c, Input.label('pause') + ' saltar', W - 8, 17,
      { size: 6, col: 'rgba(200,190,210,.55)', align: 'right' });
  },

  /* ----------------------------------------------------- escena de juego */
  drawPlay(c) {
    if (!this.player) { c.fillStyle = '#07040e'; c.fillRect(0, 0, W, H); return; }
    const camx = Cam.rx, camy = Cam.ry;
    const bio = currentBiome(Cam.x + W / 2);

    /* fondo */
    World.drawBackground(c, camx, bio);
    World.drawDecorBack(c, camx, bio);

    /* Leslie en la torre, al fondo de la arena */
    if (this.towerLeslie) this.towerLeslie.draw(c, camx);

    /* mundo */
    World.drawBridges(c, camx);
    World.drawTerrain(c, camx, bio);
    World.drawHazards(c, camx);
    FX.draw(c, 'under', camx, camy);

    /* entidades */
    for (const cp of this.checkpoints) cp.draw(c, camx);
    for (const p of this.pickups) p.draw(c, camx);
    for (const e of this.enemies) e.draw(c, camx);
    if (this.boss) this.boss.draw(c, camx);
    this.player.draw(c, camx);
    for (const p of this.projectiles) p.draw(c, camx);

    /* marca de puntería: avisa de que la Lanza Rúnica irá sola a por el
       wyvern, esté donde esté volando */
    if (!this.player.dragonForm && !this.player.dead && this.player.mp >= 14) {
      const presa = this.player.lockWyvern(this);
      if (presa) {
        const mx = Math.round(presa.cx - camx), my = Math.round(presa.cy - camy);
        const p = .5 + Math.sin(this.t * 6) * .5;
        const r = 16 + p * 3;
        c.save();
        c.globalAlpha = .45 + p * .35;
        c.strokeStyle = PAL.ice; c.lineWidth = 1;
        // cuatro escuadras girando lentamente
        for (let i = 0; i < 4; i++) {
          const a = (i / 4) * TAU + this.t * .8;
          const cx2 = mx + Math.cos(a) * r, cy2 = my + Math.sin(a) * r;
          c.beginPath();
          c.moveTo(cx2 - Math.cos(a + .5) * 4, cy2 - Math.sin(a + .5) * 4);
          c.lineTo(cx2, cy2);
          c.lineTo(cx2 - Math.cos(a - .5) * 4, cy2 - Math.sin(a - .5) * 4);
          c.stroke();
        }
        c.restore();
        glow(c, mx, my, 14 * p, 'rgba(168,230,240,.35)', .5);
        txt(c, Input.label('power2'), mx, my - r - 4,
          { size: 7, col: PAL.ice, align: 'center' });
      }
    }

    /* delante */
    World.drawWater(c, camx, bio);
    World.drawDecorFront(c, camx);
    FX.draw(c, 'over', camx, camy);

    /* luces: oscurece el ambiente y suma los focos vivos */
    const lights = [];
    const P = this.player;
    lights.push({ x: P.x - camx, y: P.cy - camy, r: P.dragonForm ? 120 : 74,
      col: P.dragonForm ? 'rgba(255,206,106,.95)' : 'rgba(255,225,170,.75)' });
    if (P.shieldT > 0) lights.push({ x: P.x - camx, y: P.cy - camy, r: 46, col: 'rgba(110,190,110,.7)' });
    for (const cp of this.checkpoints) {
      if (!cp.lit) continue;
      const lx = cp.x - camx;
      if (lx > -80 && lx < W + 80) lights.push({ x: lx, y: cp.y - 24 - camy, r: 96, col: 'rgba(255,190,110,.9)' });
    }
    for (const o of World.L.decor) {
      if (o.t !== 'torch') continue;
      const lx = o.x - camx;
      if (lx > -60 && lx < W + 60)
        lights.push({ x: lx, y: o.y - camy, r: 62 + U.noise1(this.t * 6, o.s) * 8, col: 'rgba(255,138,92,.85)' });
    }
    for (const p of this.projectiles) {
      const lx = p.x - camx;
      if (lx > -40 && lx < W + 40)
        lights.push({ x: lx, y: p.y - camy, r: 40,
          col: p.kind === 'darkfire' ? 'rgba(160,90,220,.8)'
             : p.kind === 'goldfire' ? 'rgba(255,220,140,.9)'
             : p.kind === 'rune' || p.kind === 'crescent' ? 'rgba(180,230,255,.8)'
             : 'rgba(255,150,90,.8)' });
    }
    if (this.boss && this.boss.alive) {
      lights.push({ x: this.boss.cx - camx, y: this.boss.cy - camy, r: this.boss.phase === 1 ? 80 : 130,
        col: this.boss.phase === 1 ? 'rgba(200,60,80,.55)' : 'rgba(150,70,220,.6)' });
    }
    Lights.render(c, lights, bio.ambient, bio.light);

    /* niebla de primer plano en las zonas oscuras */
    if (bio.light > .5) {
      c.save(); c.globalAlpha = .1;
      for (let i = 0; i < 4; i++) {
        const fx = ((hash(i, 301) * 900 - camx * .85 - this.t * 14) % 900 + 900) % 900 - 220;
        ell(c, fx, 210 + i * 14, 150, 12, mixHex(bio.sky[2], '#ffffff', .5));
      }
      c.restore();
    }

    /* interfaz */
    HUD.draw(c, this);
    Dialog.draw(c, this.t);
    if (this.memoryPopup) this.drawMemoryPopup(c);
    if (this.paused) this.drawPause(c);

    /* aviso de controles al empezar */
    if (this.save.checkpoint === 0 && this.player.x < 260 && !Dialog.active) {
      const a = U.clamp(1 - (this.player.x - 160) / 100, 0, 1);
      c.save(); c.globalAlpha = a;
      txt(c, Input.label('left') + '  moverse    ' + Input.label('jump') + '  saltar (×2)    ' +
             Input.label('attack') + '  espada', W / 2, 150,
        { size: 7, col: 'rgba(255,240,210,.9)', align: 'center' });
      c.restore();
    }
  },

  drawMemoryPopup(c) {
    const m = this.memoryPopup;
    const k = U.clamp(m.t / .45, 0, 1);
    const e = U.ease.outBack(k);
    c.save();
    c.fillStyle = 'rgba(8,4,14,.55)'; c.fillRect(0, 0, W, H);
    c.translate(W / 2, H / 2);
    c.scale(e, e);
    c.translate(-W / 2, -H / 2);
    // casi a pantalla completa: son los textos más largos del juego y el
    // momento en que conviene que el jugador se pare a leer
    const bw = 428, bh = 216, bx = Math.round((W - bw) / 2), by = 28;
    panel(c, bx, by, bw, bh, { border: PAL.blush, border2: 'rgba(212,106,140,.3)' });
    // cristal decorativo
    const t = this.t;
    c.save(); c.translate(bx + 38, by + 118); c.rotate(t * .6);
    R(c, -5, -12, 11, 24, PAL.blush); R(c, -9, -6, 19, 11, PAL.pink); R(c, -2, -11, 3, 22, PAL.cream);
    c.restore();
    glow(c, bx + 38, by + 118, 34, 'rgba(242,148,180,.5)', .6);

    txt(c, 'ECO DE MEMORIA RECUPERADO', bx + 74, by + 26, { size: 8, col: PAL.gold });
    txt(c, m.data.title, bx + 74, by + 48, { size: 14, col: PAL.blush });
    R(c, bx + 74, by + 54, textWidth(c, m.data.title, 14), 1, 'rgba(212,106,140,.4)');
    const lines = wrap(c, m.data.text, bw - 96, 12);
    lines.slice(0, 8).forEach((ln, i) =>
      txt(c, ln, bx + 74, by + 76 + i * 18, { size: 12, col: '#e8dcf0' }));
    if (m.t > .6 && Math.sin(t * 5) > 0)
      txt(c, Input.label('confirm') + ' continuar', bx + bw - 14, by + bh - 8,
        { size: 8, col: '#9d8ab0', align: 'right' });
    c.restore();
  },

  drawPause(c) {
    c.fillStyle = 'rgba(6,3,12,.72)'; c.fillRect(0, 0, W, H);
    const opts = ['CONTINUAR', 'CONTROLES', 'REINICIAR EN EL FAROL', 'VOLVER AL TÍTULO'];
    panel(c, 130, 62, 220, 146);
    txt(c, 'PAUSA', W / 2, 86, { size: 14, col: PAL.gold, align: 'center', bold: true, letterSpacing: 4 });
    R(c, 160, 92, 160, 1, 'rgba(255,206,106,.3)');
    opts.forEach((o, i) => {
      const y = 114 + i * 18;
      const on = i === this.pauseIdx;
      if (on) { R(c, 142, y - 10, 196, 15, 'rgba(255,206,106,.14)'); txt(c, '▶', 150, y + 2, { size: 8, col: PAL.gold }); }
      txt(c, o, W / 2, y + 2, { size: 8, col: on ? PAL.cream : '#9d8ab0', align: 'center', bold: on });
    });
    const p = this.player;
    txt(c, 'Ecos ' + this.save.memories.length + '/5   ·   Vidas ' + p.lives +
           '   ·   Muertes ' + this.save.deaths, W / 2, 196,
      { size: 7, col: '#8a7a9a', align: 'center' });
  },

  drawGameOver(c) {
    c.fillStyle = 'rgba(10,2,8,.72)'; c.fillRect(0, 0, W, H);
    const k = U.clamp(this.sceneT / 1.2, 0, 1);
    c.save(); c.globalAlpha = k;
    txt(c, 'EL ALBA SE APAGA', W / 2, 108, {
      size: 20, col: '#c9556a', align: 'center', bold: true, letterSpacing: 4,
      glow: 'rgba(200,40,60,.7)', glowSize: 12
    });
    txt(c, 'Pero la torre sigue encendida.', W / 2, 130,
      { size: 9, col: '#d8c0cc', align: 'center' });
    txt(c, 'Leslie sigue esperando.', W / 2, 143, { size: 9, col: PAL.blush, align: 'center' });
    if (this.sceneT > 1.4 && Math.sin(this.t * 4) > 0) {
      txt(c, Input.label('confirm') + ' · VOLVER AL ÚLTIMO FAROL', W / 2, 176,
        { size: 9, col: PAL.gold, align: 'center', bold: true });
    }
    txt(c, Input.label('back') + ' · volver al título', W / 2, 192, { size: 7, col: '#8a7a9a', align: 'center' });
    c.restore();
  },

  /* ---------------------------------------------------------- epílogo --- */
  drawEnding(c) {
    const t = this.t, k = U.clamp(this.endT / 3, 0, 1);
    // amanecer sobre Eldrehal
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, mixHex('#2a1038', '#4aa8d8', k));
    g.addColorStop(.5, mixHex('#5a1030', '#ffce6a', k));
    g.addColorStop(1, mixHex('#2a0a18', '#ffe9a8', k));
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    glow(c, 240, 150, 120 * k, 'rgba(255,233,168,.5)', .7);

    Sky.t = t;
    Sky.drawTower(c, 0, 300, 176, .95, false);
    // la torre ya no arde: se derrumba en silencio
    R(c, 0, 176, W, H - 176, mixHex('#1a1226', '#3a5a3e', k));
    R(c, 0, 176, W, 4, mixHex('#2f4a3c', '#5ea862', k));
    for (let i = 0; i < 60; i++) {
      const x = hash(i, 401) * W;
      const sw = Math.sin(t * 1.4 + i) * 1.5;
      R(c, x + sw, 170, 1, 8, mixHex('#2f4a3c', '#5ea862', k));
    }
    // girasoles que vuelven a abrirse, plantados en la línea del suelo
    if (k > .4) {
      c.save(); c.globalAlpha = (k - .4) / .6;
      for (let i = 0; i < 16; i++) {
        const sx2 = 12 + i * 31 + hash(i, 421) * 10;
        if (sx2 > 196 && sx2 < 262) continue;        // deja libre el centro
        TitleArt.sunflower(c, sx2, 178 + hash(i, 422) * 4, .62 + hash(i, 423) * .3, t, .9);
      }
      c.restore();
    }
    // los dos, juntos otra vez
    c.save(); c.translate(214, 177);
    Denzel.draw(c, { t: t * .6, state: 'idle', dir: 1, run: 0, airborne: false, vy: 0,
      atkT: 0, atkDur: .3, combo: 0, dashT: 0 });
    c.restore();
    c.save(); c.translate(238, 177);
    Leslie.draw(c, { t: t * .7, dir: -1, scale: .92, floating: false, casting: false, crystal: true, hat: true });
    c.restore();
    glow(c, 228, 156, 40 + Math.sin(t * 2) * 6, 'rgba(255,206,106,.35)', .6);
    // pétalos que caen
    if (Math.random() < .4)
      FX.spawn({ x: U.rand(W), y: -6, vx: U.rand(14, -14), vy: U.rand(24, 10),
        life: 5, size: 2, col: PAL.pink, col2: PAL.blush, kind: 'leaf', drag: 1, tag: U.rand(10) });
    FX.draw(c, 'over');

    c.fillStyle = '#07040e';
    c.fillRect(0, 0, W, 20); c.fillRect(0, H - 20, W, 20);
    Dialog.draw(c, t);
  },

  drawCredits(c) {
    const t = this.creditT;
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b0714'); g.addColorStop(1, '#2a1038');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 60; i++) {
      const x = hash(i, 411) * W, y = hash(i, 412) * H;
      c.globalAlpha = .2 + Math.sin(t * 2 + i) * .3;
      R(c, x, y, 1, 1, PAL.cream); c.globalAlpha = 1;
    }
    const lines = [
      { s: 16, c: PAL.gold, t: 'CORAZÓN DE DRAGÓN' },
      { s: 8, c: '#cbbcd8', t: 'La Balada de Denzel y Leslie' },
      { s: 0, t: '' },
      { s: 9, c: PAL.cream, t: 'NIVEL I · EL SENDERO QUE RECUERDA' },
      { s: 8, c: PAL.leaf2, t: 'COMPLETADO' },
      { s: 0, t: '' },
      { s: 8, c: '#9d8ab0', t: 'Ecos de memoria: ' + this.save.memories.length + ' de 5' },
      { s: 8, c: '#9d8ab0', t: 'Caídas en el camino: ' + this.save.deaths },
      { s: 8, c: '#9d8ab0', t: 'Tiempo: ' + Math.floor(this.save.time / 60) + 'm ' + Math.floor(this.save.time % 60) + 's' },
      { s: 0, t: '' },
      { s: 9, c: PAL.blush, t: 'Denzel · Paladín del Alba' },
      { s: 9, c: PAL.blush, t: 'Leslie · La Bruja de Ámbar' },
      { s: 9, c: '#c9556a', t: 'Malakor · Señor Dragón Caballero Oscuro' },
      { s: 0, t: '' },
      { s: 8, c: PAL.gold, t: 'Al este, sobre el mar de ceniza,' },
      { s: 8, c: PAL.gold, t: 'tres torres siguen encendidas.' },
      { s: 0, t: '' },
      { s: 10, c: PAL.cream, t: 'CONTINUARÁ' }
    ];
    const scroll = H - t * 22;
    lines.forEach((ln, i) => {
      if (!ln.t) return;
      const y = scroll + i * 15;
      if (y < -10 || y > H + 10) return;
      txt(c, ln.t, W / 2, y, { size: ln.s, col: ln.c, align: 'center',
        bold: ln.s >= 9, letterSpacing: ln.s > 12 ? 3 : 0,
        glow: ln.s > 12 ? 'rgba(255,138,92,.6)' : null });
    });
    if (t > 3 && Math.sin(this.t * 4) > 0)
      txt(c, Input.label('confirm') + ' para volver', W / 2, H - 8,
        { size: 7, col: '#8a7a9a', align: 'center' });
  }
};

/* ------------------------------------------------------------- arranque -- */
window.addEventListener('load', () => Game.init());

</script>
<div id="ah-demo" style="position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:2147483000;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:999px;background:rgba(3,9,15,.86);border:1px solid rgba(44,245,200,.45);box-shadow:0 6px 24px -8px rgba(0,0,0,.6);font:500 12px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;color:#eefcf8;max-width:calc(100vw - 24px);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Concepto de diseño · Aurora Hub Perú</span><a href="https://www.aurorahubperu.com/#proyectos" style="flex:none;color:#03140f;background:linear-gradient(90deg,#2cf5c8,#7cf9e0);border-radius:999px;padding:6px 11px;text-decoration:none;font-weight:700">Ver portafolio</a></div></body>

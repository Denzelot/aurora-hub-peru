};

/* ------------------------------------------------- utilidades de dibujo -- */
/* Todo se redondea a enteros: el pixel art no admite medios píxeles.        */
function R(c, x, y, w, h, col) {
  c.fillStyle = col;
  c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
/* Segmento rasterizado a mano: mantiene los bordes duros pese al ángulo.    */
function limb(c, x, y, len, ang, thick, col, col2) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  for (let t = 0; t <= len; t++) {
    const px = Math.round(x + dx * t), py = Math.round(y + dy * t);
    R(c, px, py, thick, 1, col);
    if (col2 && t > len * .55) R(c, px, py, 1, 1, col2);   // sombra en el extremo
  }
}
/* Elipse rellena en píxeles enteros (cuerpos de dragón, nubes, copas).      */
function ell(c, cx, cy, rx, ry, col) {
  c.fillStyle = col;
  for (let y = -Math.ceil(ry); y <= Math.ceil(ry); y++) {
    const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
    if (w > 0) c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 1);
  }
}
/* Triángulo pixelado (alas, cuernos, picos de montaña).                     */
function tri(c, x1, y1, x2, y2, x3, y3, col) {
  c.fillStyle = col;
  const minY = Math.round(Math.min(y1, y2, y3)), maxY = Math.round(Math.max(y1, y2, y3));
  const edge = (ax, ay, bx, by, y) => (by === ay) ? null : ax + (bx - ax) * (y - ay) / (by - ay);
  for (let y = minY; y <= maxY; y++) {
    const xs = [];
    [[x1, y1, x2, y2], [x2, y2, x3, y3], [x3, y3, x1, y1]].forEach(e => {
      const [ax, ay, bx, by] = e;
      if ((y >= Math.min(ay, by)) && (y <= Math.max(ay, by))) {
        const v = edge(ax, ay, bx, by, y);
        if (v !== null) xs.push(v);
      }
    });
    if (xs.length < 2) continue;
    const a = Math.round(Math.min.apply(null, xs)), b = Math.round(Math.max.apply(null, xs));
    c.fillRect(a, y, Math.max(1, b - a), 1);
  }
}
/* Aura luminosa (gradiente radial). Se usa con moderación: cuesta relleno.  */
function glow(c, x, y, r, col, alpha = .5) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  c.save(); c.globalAlpha = alpha; c.globalCompositeOperation = 'lighter';
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  c.restore();
}

/* ---------------------------------------- fábrica de sprites cacheados --- */
const SpriteCache = {};
/* rows: array de strings. map: {char: color}. '.' = transparente.           */
function makeSprite(key, rows, map) {
  if (SpriteCache[key]) return SpriteCache[key];
  const h = rows.length, w = rows[0].length;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const c = cv.getContext('2d');
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === '.' || ch === ' ') continue;
      const col = map[ch];
      if (!col) continue;
      c.fillStyle = col; c.fillRect(x, y, 1, 1);
    }
  }
  SpriteCache[key] = cv;
  return cv;
}
/* Dibuja un sprite cacheado, opcionalmente espejado.                        */
function blit(c, cv, x, y, flip) {
  x = Math.round(x); y = Math.round(y);
  if (!flip) { c.drawImage(cv, x, y); return; }
  c.save(); c.translate(x + cv.width, y); c.scale(-1, 1); c.drawImage(cv, 0, 0); c.restore();
}

/* =========================================================================
   DENZEL — Elfo del bosque, Caballero Paladín.
   Se dibuja por partes para animar de verdad: la capa ondea, el pelo se
   mueve, los brazos rotan. Origen (0,0) en los PIES, centrado en X.
   ========================================================================= */
const Denzel = {
  // colores del héroe
  C: {
    cape: '#1f4d3a', capeL: '#2e7a52', capeD: '#143224',
    mail: '#2f6b4f', mailL: '#47966b', mailD: '#1d4433',
    plate: '#8e8bab', plateL: '#d3d1e6', trim: '#ffce6a',
    skin: PAL.skin, skinL: PAL.skinL, skinD: PAL.skin2,
    hair: '#2a1a18', hairL: '#4a2f28',
    boot: '#4a3226', bootL: '#6b4a33',
    blade: '#dff4ff', bladeL: '#ffffff', hilt: '#ffce6a'
  },

  /* st = { t, state, dir, run, airborne, atkT, castT, hurtT, dashT, crouch } */
  draw(c, st) {
    const C = this.C, t = st.t, dir = st.dir || 1;
    const run = st.run || 0;                       // 0..1 intensidad de carrera
    const air = st.airborne;
    // respiración y balanceo
    const breath = Math.sin(t * 2.4) * .5;
    const bob = air ? 0 : Math.abs(Math.sin(t * 11 * (0.4 + run))) * run * 1.6;
    const lean = dir * (run * 1.2 + (st.dashT > 0 ? 2.4 : 0));

    c.save();
    c.scale(dir, 1);                                // espejo: trabajamos siempre mirando a +X
    const y0 = -bob;                                // desplazamiento vertical del cuerpo

    /* ---- capa (detrás de todo), ondula con viento y velocidad ---- */
    const windAmp = 2 + run * 5 + (air ? 3 : 0);
    c.fillStyle = C.cape;
    for (let i = 0; i < 13; i++) {
      const p = i / 12;
      const sway = Math.sin(t * 6 - p * 3.1) * windAmp * p;
      const wid = 7 - p * 4;
      const cy = y0 - 22 + i * 1.5;
      R(c, -5 - sway * .6 - wid * .3, cy, wid, 2, i < 3 ? C.capeL : (i > 9 ? C.capeD : C.cape));
    }

    /* ---- piernas ---- */
    const legPhase = t * 11 * (0.5 + run);
    const legA = air ? (st.vy < 0 ? -.55 : .35) : Math.sin(legPhase) * run * .85;
    const legB = air ? (st.vy < 0 ? .30 : -.15) : Math.sin(legPhase + Math.PI) * run * .85;
    limb(c, -1, y0 - 10, 7, Math.PI / 2 + legB, 3, C.mailD);       // pierna trasera
    R(c, Math.round(-1 + Math.cos(Math.PI / 2 + legB) * 7) - 1, Math.round(y0 - 3 + Math.sin(Math.PI / 2 + legB) * 7), 4, 3, C.boot);
    limb(c, 1, y0 - 10, 7, Math.PI / 2 + legA, 3, C.mail);         // pierna delantera
    R(c, Math.round(1 + Math.cos(Math.PI / 2 + legA) * 7) - 1, Math.round(y0 - 3 + Math.sin(Math.PI / 2 + legA) * 7), 4, 3, C.bootL);

    /* ---- torso: peto élfico con emblema ---- */
    const ty = y0 - 21 + breath * .4 + lean * .1;
    R(c, -4, ty, 9, 11, C.mail);
    R(c, -4, ty, 9, 2, C.mailL);                    // luz superior
    R(c, -4, ty + 9, 9, 2, C.mailD);                // sombra inferior
    R(c, 3, ty + 2, 2, 8, C.mailD);                 // costado
    R(c, -1, ty + 3, 3, 4, C.trim);                 // emblema: hoja de oro
    R(c, 0, ty + 2, 1, 6, C.plateL);
    R(c, -4, ty + 5, 9, 1, C.trim);                 // cinturón
    // hombreras
    R(c, -5, ty - 1, 4, 4, C.plate);
    R(c, -5, ty - 1, 4, 1, C.plateL);
    R(c, 2, ty - 1, 4, 4, C.plate);
    R(c, 2, ty - 1, 4, 1, C.plateL);

    /* ---- brazo trasero ---- */
    const armBack = air ? -.9 : (Math.sin(legPhase + Math.PI) * run * .9 + .25);
    limb(c, -3, ty + 2, 7, Math.PI / 2 + armBack, 2, C.mailD);

    /* ---- cabeza: elfo con barba y diadema ---- */
    const hy = ty - 8 + breath * .3;
    R(c, -3, hy, 7, 8, C.skin);                     // cara
    R(c, 2, hy + 1, 2, 6, C.skinD);                 // sombra lateral
    R(c, -3, hy, 7, 2, C.hair);                     // flequillo
    R(c, -4, hy + 1, 2, 5, C.hair);                 // pelo lateral
    R(c, -3, hy + 5, 6, 3, C.hair);                 // barba
    R(c, -2, hy + 5, 4, 1, C.hairL);
    R(c, 3, hy + 2, 3, 2, C.skinL);                 // oreja puntiaguda
    R(c, 5, hy + 2, 1, 1, C.skin);
    // ojo (brillo verde del linaje del bosque)
    R(c, 1, hy + 3, 2, 1, PAL.leaf2);
    R(c, 2, hy + 3, 1, 1, PAL.cream);
    // diadema dorada de hojas
    R(c, -4, hy - 1, 8, 1, C.trim);
    R(c, -1, hy - 2, 2, 1, C.trim);
    R(c, -5, hy, 1, 2, PAL.leaf2);
    R(c, 4, hy, 1, 2, PAL.leaf2);

    /* ---- brazo delantero + arma ---- */
    let armAng = Math.PI / 2 - .2 + (air ? -.5 : Math.sin(legPhase) * run * .9);
    let swordAng = -.9;
    let bladeLen = 13;
    if (st.state === 'attack') {
      // tres tiempos de combo: carga, tajo, recuperación
      const p = U.clamp(st.atkT / st.atkDur, 0, 1);
      const sw = st.combo === 2 ? 1 : 0;
      if (p < .25) { armAng = -1.1 - sw * .4; swordAng = -2.2; }
      else if (p < .55) { armAng = U.lerp(-1.1, .55, (p - .25) / .3); swordAng = U.lerp(-2.2, .5, (p - .25) / .3); }
      else { armAng = U.lerp(.55, Math.PI / 2 - .2, (p - .55) / .45); swordAng = U.lerp(.5, -.9, (p - .55) / .45); }
      if (st.combo === 3) { armAng -= .5; swordAng -= .3; bladeLen = 15; }
    } else if (st.state === 'cast') {
      armAng = -1.35; swordAng = -1.5;
    }
    const sx = -1, sy = ty + 2;
    limb(c, sx, sy, 7, armAng, 2, C.mail, C.mailD);
    const hx = sx + Math.cos(armAng) * 7, hy2 = sy + Math.sin(armAng) * 7;
    R(c, Math.round(hx) - 1, Math.round(hy2) - 1, 3, 3, C.skin);   // guante/mano

    if (st.state !== 'cast') this.sword(c, hx, hy2, swordAng, bladeLen, st);
    c.restore();
  },

  /* Espada del Alba: hoja clara con filo luminoso */
  sword(c, x, y, ang, len, st) {
    const C = this.C;
    R(c, Math.round(x) - 2, Math.round(y) - 1, 4, 2, C.hilt);       // guarda
    limb(c, x, y, len, ang, 2, C.blade);
    limb(c, x + Math.cos(ang), y + Math.sin(ang), len - 1, ang, 1, C.bladeL);
    const tipX = x + Math.cos(ang) * len, tipY = y + Math.sin(ang) * len;
    if (st && st.state === 'attack') glow(c, tipX, tipY, 9, 'rgba(255,230,160,.65)', .55);
  }
};

/* =========================================================================
   FORMA DRAGÓN DORADO — la transformación final (ojos verdes).
   ========================================================================= */
const GoldDragon = {
  C: { body: '#ffce6a', bodyL: '#ffe9a8', bodyD: '#d19a3c', wing: '#f5b94f', wingL: '#ffe9a8',
       horn: '#fff3d6', eye: '#6fff9b', claw: '#fff3d6', belly: '#ffeccf' },

  /* Origen en los pies, mira a +X antes del espejo.
     Del mismo tamaño que el Gran Dragón Oscuro: el clímax no funciona si el
     héroe transformado parece más pequeño que su enemigo.                   */
  draw(c, st) {
    const C = this.C, t = st.t, dir = st.dir || 1;
    const fly = st.fly || 0;
    c.save(); c.scale(dir, 1);
    const flap = Math.sin(t * 5.2);
    const hover = Math.sin(t * 1.8) * 2.5;
    const y0 = hover;

    /* --- ala trasera --- */
    const wa = -.52 + flap * .8, wr = 62;
    tri(c, -12, y0 - 56, -12 - Math.cos(wa) * wr, y0 - 56 + Math.sin(wa) * wr * .85, -6, y0 - 22, C.wing);
    tri(c, -12, y0 - 56, -12 - Math.cos(wa + .3) * wr * .68, y0 - 50 + Math.sin(wa + .3) * wr * .6, -6, y0 - 30, C.bodyD);

    /* --- cola larga con aleta --- */
    for (let i = 0; i < 17; i++) {
      const p = i / 16;
      const tx = -20 - i * 4;
      const ty = y0 - 46 + Math.sin(t * 3.4 - p * 4) * 11 * p + p * 20;
      const s = 6.5 - p * 5.2;
      ell(c, tx, ty, s, s, p > .65 ? C.bodyL : C.body);
      if (i % 3 === 0 && i > 3)
        tri(c, tx, ty - s, tx + 3, ty - s, tx + 1, ty - s - 6 + p * 3, C.horn);
    }
    // aleta del extremo
    tri(c, -84, y0 - 24, -98, y0 - 34, -92, y0 - 18, C.bodyL);
    tri(c, -84, y0 - 24, -96, y0 - 14, -90, y0 - 26, C.body);

    /* --- cuerpo --- */
    ell(c, -3, y0 - 44, 24, 19, C.body);
    ell(c, -1, y0 - 38, 19, 12, C.belly);
    ell(c, -7, y0 - 52, 20, 11, C.bodyD);
    for (let i = 0; i < 6; i++) R(c, -13 + i * 6, y0 - 34, 5, 3, C.bodyL);   // placas ventrales
    // cresta de luz sobre el lomo
    for (let i = 0; i < 7; i++)
      tri(c, -14 + i * 5, y0 - 58, -10 + i * 5, y0 - 58, -12 + i * 5, y0 - 68 - Math.sin(t * 4 + i) * 2, C.horn);

    /* --- patas y garras --- */
    limb(c, -11, y0 - 28, 22, Math.PI / 2 + .34, 7, C.bodyD);
    limb(c, 9, y0 - 28, 22, Math.PI / 2 - .10, 7, C.body);
    R(c, -20, y0 - 6, 12, 5, C.claw);
    R(c, 5, y0 - 6, 12, 5, C.claw);
    for (let i = 0; i < 3; i++) {
      tri(c, -20 + i * 4, y0 - 1, -18 + i * 4, y0 - 1, -19 + i * 4, y0 + 4, C.claw);
      tri(c, 5 + i * 4, y0 - 1, 7 + i * 4, y0 - 1, 6 + i * 4, y0 + 4, C.claw);
    }

    /* --- cuello erguido --- */
    const neck = Math.sin(t * 2.4) * 3;
    for (let i = 0; i < 10; i++) {
      const p = i / 9;
      ell(c, 15 + i * 2.9, y0 - 56 - i * 2.7 + neck * p, 7.5 - p * 3.2, 6.5 - p * 2.8, C.body);
      if (i % 2 === 0)
        tri(c, 13 + i * 2.9, y0 - 62 - i * 2.7 + neck * p, 17 + i * 2.9, y0 - 62 - i * 2.7 + neck * p,
            15 + i * 2.9, y0 - 70 - i * 2.7 + neck * p, C.horn);
    }

    /* --- cabeza --- */
    const hx = 45, hy = y0 - 82 + neck;
    ell(c, hx, hy, 13, 9, C.body);
    R(c, hx + 6, hy - 2, 13, 7, C.bodyL);             // hocico
    R(c, hx + 16, hy, 5, 4, C.bodyD);
    R(c, hx + 8, hy - 4, 3, 2, C.bodyD);              // fosa nasal
    for (let i = 0; i < 4; i++)                        // dientes
      tri(c, hx + 8 + i * 3, hy + 4, hx + 10 + i * 3, hy + 4, hx + 9 + i * 3, hy + 8, C.horn);
    // ojo verde: la marca del linaje del bosque
    R(c, hx, hy - 5, 7, 4, C.eye);
    R(c, hx + 2, hy - 5, 3, 2, PAL.white);
    R(c, hx + 5, hy - 5, 1, 4, '#2e8f52');
    glow(c, hx + 3, hy - 4, 20, 'rgba(110,255,155,.7)', .8);
    // cuernos coronados hacia atrás
    tri(c, hx - 5, hy - 7, hx - 21, hy - 28, hx - 1, hy - 8, C.horn);
    tri(c, hx - 10, hy - 5, hx - 28, hy - 20, hx - 6, hy - 7, C.horn);
    tri(c, hx - 2, hy - 8, hx - 6, hy - 22, hx + 2, hy - 8, C.bodyL);
    // melena, pegada al cuello para que lea como pelaje y no como púas sueltas
    for (let i = 0; i < 6; i++) {
      const a = -2.1 - i * .12, len = 8 - i * .8;
      limb(c, hx - 8, hy + i * 2, len, a, 2, i % 2 ? C.bodyL : C.bodyD);
    }

    /* --- ala delantera, enorme --- */
    const wf = -.62 + flap * .92, wr2 = 76;
    tri(c, 4, y0 - 60, 4 - Math.cos(wf) * wr2, y0 - 60 + Math.sin(wf) * wr2 * .9, 14, y0 - 20, C.wingL);
    tri(c, 4, y0 - 60, 4 - Math.cos(wf + .26) * wr2 * .7, y0 - 54 + Math.sin(wf + .26) * wr2 * .62, 12, y0 - 30, C.wing);
    // varillas del ala: van por dentro de la membrana, en tono más oscuro
    for (let i = 0; i < 4; i++)
      limb(c, 4, y0 - 60, wr2 * (.82 - i * .15), wf + i * .17, 1, C.bodyD);

    c.restore();
    // el aura dorada que lo envuelve
    glow(c, 0, -52, 96, 'rgba(255,206,106,.30)', .6);
    glow(c, 0, -52, 46, 'rgba(255,243,214,.22)', .6);
  }
};

/* =========================================================================
   LESLIE — Princesa bruja. Cabello rubio ondulado, vestido crema,
   sombrero de hechicera y su cristal de ámbar.
   ========================================================================= */
const Leslie = {
  C: { dress: PAL.dress, dressL: '#fffaf0', dressD: PAL.dress2, hair: PAL.hairL,
       hairD: PAL.hairL2, root: PAL.hairD, skin: '#f0c49a', skinD: '#d09a6e',
       hat: '#e8dcc0', hatD: '#b9a986', terra: PAL.terra, gem: '#ffb347' },

  draw(c, st) {
    const C = this.C, t = st.t, dir = st.dir || -1;
    const s = st.scale || 1;
    c.save();
    c.scale(dir * s, s);
    const breath = Math.sin(t * 2) * .6;
    const float = st.floating ? Math.sin(t * 1.6) * 2 : 0;
    const y0 = -float;

    /* vestido largo que ondea */
    for (let i = 0; i < 12; i++) {
      const p = i / 11;
      const sway = Math.sin(t * 3 - p * 2.4) * (1 + p * 3);
      const wid = 4 + p * 5;
      R(c, -wid / 2 + sway, y0 - 14 + i * 1.25, wid, 2, i > 8 ? C.dressD : (i < 3 ? C.dressL : C.dress));
    }
    /* torso */
    R(c, -3, y0 - 20 + breath * .3, 6, 7, C.dress);
    R(c, -3, y0 - 20 + breath * .3, 6, 1, C.dressL);
    R(c, -3, y0 - 16, 6, 1, C.terra);               // cinto terracota
    /* brazos */
    const arm = st.casting ? -1.4 : (Math.PI / 2 - .35 + Math.sin(t * 1.7) * .12);
    limb(c, -2, y0 - 18, 6, arm + .25, 2, C.dressD);
    limb(c, 2, y0 - 18, 6, arm, 2, C.dress);
    const hx = 2 + Math.cos(arm) * 6, hy = y0 - 18 + Math.sin(arm) * 6;
    R(c, Math.round(hx) - 1, Math.round(hy), 2, 2, C.skin);
    /* cabeza */
    const hdy = y0 - 27 + breath * .3;
    R(c, -3, hdy, 6, 7, C.skin);
    R(c, 2, hdy + 1, 1, 5, C.skinD);
    R(c, 0, hdy + 3, 1, 1, '#4a3328');              // ojo
    R(c, -2, hdy + 3, 1, 1, '#4a3328');
    R(c, -1, hdy + 5, 2, 1, '#c9748a');             // sonrisa
    /* cabello rubio ondulado, largo */
    R(c, -4, hdy - 1, 8, 3, C.root);                // raíz más oscura
    R(c, -4, hdy + 1, 8, 2, C.hair);
    for (let i = 0; i < 10; i++) {
      const p = i / 9, sway = Math.sin(t * 2.6 - p * 3) * (1 + p * 2.6);
      R(c, -5 + sway * .5, hdy + 2 + i * 1.3, 3, 2, i % 3 === 0 ? C.hairD : C.hair);
      R(c, 3 + sway * .5, hdy + 2 + i * 1.3, 3, 2, i % 3 === 1 ? C.hairD : C.hair);
    }
    /* sombrero de hechicera, ala ancha y punta caída */
    if (st.hat !== false) {
      R(c, -7, hdy - 2, 14, 2, C.hat);
      R(c, -7, hdy - 1, 14, 1, C.hatD);
      for (let i = 0; i < 9; i++) {
        const p = i / 8, bend = Math.sin(t * 1.9 - p * 2) * (1 + p * 3);
        R(c, -3 + p * 4 + bend, hdy - 3 - i * 1.4, 5 - p * 3.4, 2, i > 5 ? C.hatD : C.hat);
      }
      R(c, -4, hdy - 3, 8, 1, C.terra);             // cinta terracota
    }
    /* cristal de ámbar flotando en la palma */
    if (st.crystal) {
      const cx2 = hx + 2, cy2 = hy - 3 + Math.sin(t * 3) * 1.2;
      R(c, cx2 - 1, cy2 - 2, 3, 5, C.gem);
      R(c, cx2, cy2 - 3, 1, 7, PAL.sun);
      glow(c, cx2, cy2, 10 + Math.sin(t * 4) * 2, 'rgba(255,190,90,.75)', .7);
    }
    c.restore();
  }
};

/* =========================================================================
   MONSTRUOS MENORES — duendes de ceniza, murciélagos sombra, golems.
   ========================================================================= */
const Bestiary = {
  /* Duende Ceniza: pequeño, corre y embiste. */
  imp(c, st) {
    const t = st.t, dir = st.dir || 1;
    c.save(); c.scale(dir, 1);
    const bob = Math.abs(Math.sin(t * 9)) * 1.4;
    const y0 = -bob;
    const bodyCol = st.angry ? PAL.blood : PAL.mauve;
    // patas
    limb(c, -2, y0 - 7, 5, Math.PI / 2 + Math.sin(t * 9) * .7, 2, PAL.dusk);
    limb(c, 1, y0 - 7, 5, Math.PI / 2 - Math.sin(t * 9) * .7, 2, PAL.mauve);
    // cuerpo
    ell(c, 0, y0 - 10, 5, 5, bodyCol);
    R(c, -4, y0 - 12, 8, 2, PAL.plum);
    // brazos con garras
    limb(c, -3, y0 - 11, 5, Math.PI * .85 + Math.sin(t * 9) * .5, 2, PAL.dusk);
    limb(c, 3, y0 - 11, 5, .15 - Math.sin(t * 9) * .5, 2, PAL.plum);
    // cabeza con cuernos y ojos brasa
    ell(c, 1, y0 - 16, 4, 4, PAL.plum);
    tri(c, -2, y0 - 18, -4, y0 - 23, 0, y0 - 19, PAL.dusk);
    tri(c, 3, y0 - 18, 5, y0 - 23, 1, y0 - 19, PAL.dusk);
    R(c, 1, y0 - 17, 2, 1, st.angry ? PAL.flame : PAL.ember);
    R(c, -1, y0 - 17, 1, 1, st.angry ? PAL.flame : PAL.ember);
    c.restore();
    if (st.angry) glow(c, 0, -14, 14, 'rgba(255,90,60,.35)', .5);
  },

  /* Murciélago Sombra: vuela en senoidal, se lanza en picado. */
  bat(c, st) {
    const t = st.t, dir = st.dir || 1;
    c.save(); c.scale(dir, 1);
    const flap = Math.sin(t * 16);
    const wa = -.4 + flap * .9;
    tri(c, -1, -14, -1 - Math.cos(wa) * 13, -14 + Math.sin(wa) * 11, -2, -8, PAL.night);
    tri(c, 1, -14, 1 + Math.cos(wa) * 13, -14 + Math.sin(wa) * 11, 2, -8, PAL.dusk);
    ell(c, 0, -13, 3, 4, PAL.deep);
    R(c, -1, -16, 1, 1, PAL.rose);
    R(c, 1, -16, 1, 1, PAL.rose);
    tri(c, -2, -17, -3, -21, -1, -17, PAL.night);
    tri(c, 2, -17, 3, -21, 1, -17, PAL.night);
    c.restore();
  },

  /* Golem de Raíz: lento, resistente, arroja piedras. */
  golem(c, st) {
    const t = st.t, dir = st.dir || 1;
    c.save(); c.scale(dir, 1);
    const sway = Math.sin(t * 2.2) * 1.2;
    const y0 = -Math.abs(Math.sin(t * 2.2)) * .8;
    // piernas de tronco
    R(c, -7, y0 - 9, 5, 9, PAL.bark);
    R(c, 2, y0 - 9, 5, 9, PAL.bark2);
    // torso de piedra y musgo
    R(c, -9, y0 - 24, 18, 16, PAL.bark);
    R(c, -9, y0 - 24, 18, 3, PAL.moss);
    R(c, -7, y0 - 21, 5, 4, PAL.moss);
    R(c, 3, y0 - 17, 4, 5, PAL.moss);
    R(c, 6, y0 - 22, 3, 12, PAL.bark2);
    // brazos gruesos
    limb(c, -9 + sway, y0 - 22, 13, Math.PI / 2 + .3, 4, PAL.bark2);
    limb(c, 9 - sway, y0 - 22, 13, Math.PI / 2 - .3, 4, PAL.bark);
    // cabeza hundida entre los hombros
    R(c, -5, y0 - 31, 10, 8, PAL.bark2);
    R(c, -5, y0 - 31, 10, 2, PAL.moss);
    R(c, -3, y0 - 28, 3, 2, PAL.leaf2);
    R(c, 1, y0 - 28, 3, 2, PAL.leaf2);
    c.restore();
    glow(c, 0, -28, 16, 'rgba(110,190,110,.18)', .4);
  },

  /* Cría de Wyvern: dragón menor, escupe fuego en vuelo. */
  wyvern(c, st) {
    const t = st.t, dir = st.dir || 1;
    c.save(); c.scale(dir, 1);
    const flap = Math.sin(t * 8);
    const y0 = Math.sin(t * 2) * 2;
    const wa = -.5 + flap * .95;
    // ala trasera
    tri(c, -3, y0 - 20, -3 - Math.cos(wa) * 20, y0 - 20 + Math.sin(wa) * 18, -2, y0 - 8, PAL.plum);
    // cola
    for (let i = 0; i < 9; i++) {
      const p = i / 8;
      R(c, -6 - i * 2, y0 - 16 + Math.sin(t * 6 - p * 3) * 4 * p, 3 - p * 2, 3 - p * 2, PAL.orchid);
    }
    // cuerpo
    ell(c, 0, y0 - 16, 7, 6, PAL.orchid);
    ell(c, 1, y0 - 14, 5, 4, PAL.plum);
    // patas
    limb(c, -2, y0 - 11, 7, Math.PI / 2 + .3, 2, PAL.plum);
    limb(c, 3, y0 - 11, 7, Math.PI / 2 - .2, 2, PAL.orchid);
    // cuello y cabeza
    ell(c, 7, y0 - 21, 4, 3, PAL.orchid);
    ell(c, 12, y0 - 24, 5, 3, PAL.orchid);
    R(c, 15, y0 - 25, 4, 2, PAL.plum);
    R(c, 11, y0 - 26, 2, 1, PAL.flame);
    tri(c, 9, y0 - 26, 6, y0 - 31, 11, y0 - 27, PAL.dusk);
    // ala delantera
    const wf = -.65 + flap * 1.05;
    tri(c, 1, y0 - 21, 1 - Math.cos(wf) * 24, y0 - 21 + Math.sin(wf) * 21, 5, y0 - 8, PAL.rose);
    tri(c, 1, y0 - 21, 1 - Math.cos(wf) * 17, y0 - 20 + Math.sin(wf) * 16, 5, y0 - 12, PAL.orchid);
    c.restore();
  }
};

/* =========================================================================
   PROPS Y DECORADOS — girasoles, árboles, faroles, torres, puentes.
   ========================================================================= */
const Props = {
  sunflower(c, x, y, t, seed) {
    const sway = Math.sin(t * 1.6 + seed) * 2;
    const h = 14 + (seed % 5);
    R(c, x, y - h, 1, h, PAL.grass);                          // tallo
    R(c, x - 3 + sway * .3, y - h * .6, 3, 1, PAL.leaf);      // hoja
    R(c, x + 1 + sway * .3, y - h * .4, 3, 1, PAL.leaf2);
    const cx = x + sway, cy = y - h - 2;
    for (let i = 0; i < 8; i++) {                             // pétalos
      const a = (i / 8) * TAU + t * .25;
      R(c, cx + Math.cos(a) * 3, cy + Math.sin(a) * 3, 2, 2, PAL.gold);
    }
    R(c, cx - 1, cy - 1, 3, 3, '#7a4a20');                    // corazón
  },

  tree(c, x, y, h, t, seed, dark) {
    const sway = Math.sin(t * .9 + seed) * (h * .04);
    const trunk = dark ? PAL.bark : PAL.bark2;
    const th = h * .62;                       // el tronco es parte de la altura
    for (let i = 0; i < th; i++)
      R(c, x + (i / th) * sway, y - i, 3 - (i / th) * 1.2, 1, i > th * .7 ? PAL.bark : trunk);
    // ramas bajas
    limb(c, x + sway * .5, y - th * .72, h * .2, -.6, 1, PAL.bark);
    limb(c, x + sway * .5, y - th * .82, h * .18, -2.5, 1, PAL.bark);
    const cx = x + sway * 1.4, cy = y - th;
    const r = h * .42;
    const c1 = dark ? PAL.night : PAL.moss, c2 = dark ? PAL.dusk : PAL.leaf;
    ell(c, cx, cy - r * .3, r, r * .72, c1);
    ell(c, cx - r * .72, cy + r * .12, r * .62, r * .48, c1);
    ell(c, cx + r * .72, cy + r * .08, r * .6, r * .46, c1);
    ell(c, cx - r * .34, cy - r * .58, r * .56, r * .44, c2);
    ell(c, cx + r * .46, cy - r * .42, r * .5, r * .4, c2);
    ell(c, cx + r * .06, cy - r * .92, r * .44, r * .34, dark ? PAL.mauve : PAL.leaf2);
  },

  deadTree(c, x, y, h, t, seed) {
    const sway = Math.sin(t * 1.1 + seed) * 1.5;
    for (let i = 0; i < h; i++) R(c, x + (i / h) * sway, y - i, 2, 1, PAL.night);
    const bx = x + sway, by = y - h;
    limb(c, bx, by, 9, -.9, 1, PAL.deep);
    limb(c, bx, by + 3, 8, -2.3, 1, PAL.deep);
    limb(c, bx, by + 7, 6, -.6, 1, PAL.night);
    limb(c, bx + 5, by - 5, 5, -1.9, 1, PAL.deep);
  },

  /* Farol de memoria: el checkpoint del nivel. */
  lantern(c, x, y, t, lit) {
    R(c, x - 1, y - 20, 2, 20, PAL.iron);                     // poste
    R(c, x - 4, y - 1, 8, 2, PAL.iron2);                      // base
    R(c, x - 3, y - 27, 6, 7, lit ? PAL.gold : PAL.iron2);    // farol
    R(c, x - 3, y - 28, 6, 1, PAL.iron);
    R(c, x - 4, y - 29, 8, 1, PAL.iron2);
    if (lit) {
      const fl = .8 + U.noise1(t * 6, x) * .2;
      R(c, x - 2, y - 26, 4, 5, PAL.sun);
      R(c, x - 1, y - 25, 2, 3, PAL.white);
      glow(c, x, y - 24, 26 * fl, 'rgba(255,206,106,.55)', .55);
      glow(c, x, y - 24, 60 * fl, 'rgba(255,138,92,.16)', .4);
    } else {
      R(c, x - 2, y - 26, 4, 5, PAL.dusk);
      glow(c, x, y - 24, 12, 'rgba(120,80,160,.25)', .4);
    }
  },

  /* Antorcha de muro, para las ruinas y la torre. */
  torch(c, x, y, t, seed) {
    R(c, x - 1, y, 2, 6, PAL.bark);
    const n = U.noise1(t * 7 + seed, seed);
    const h = 6 + n * 2.5;
    R(c, x - 2, y - h, 4, h, PAL.flame);
    R(c, x - 1, y - h * .8, 2, h * .8, PAL.ember);
    R(c, x - 1, y - h * .5, 1, h * .4, PAL.sun);
    glow(c, x, y - h * .4, 22 + n * 5, 'rgba(255,138,92,.5)', .55);
  },

  /* Runa flotante del bosque: decorado mágico de fondo. */
  rune(c, x, y, t, seed) {
    const a = .35 + Math.sin(t * 2 + seed) * .3;
    const fy = y + Math.sin(t * 1.2 + seed) * 4;
    c.save(); c.globalAlpha = a;
    R(c, x - 2, fy, 5, 1, PAL.vio2);
    R(c, x, fy - 2, 1, 5, PAL.vio2);
    R(c, x - 1, fy - 1, 3, 3, PAL.vio);
    c.restore();
    glow(c, x, fy, 9, 'rgba(139,59,214,.35)', a);
  }
};

/* ===== 02-fx.js ===== */
/* =========================================================================
   CORAZÓN DE DRAGÓN — 02-fx.js
   Partículas, luces, sacudida de cámara, destellos y transiciones.
   ========================================================================= */
'use strict';

/* ----------------------------------------------------------- partículas -- */
/* Pool fijo: nunca asigna memoria durante el juego, así no hay tirones.     */
const FX = {
  pool: [], max: 900, idx: 0,
  rings: [],          // ondas expansivas
  bolts: [],          // rayos/relámpagos
  texts: [],          // números de daño y frases flotantes

  init() {
    for (let i = 0; i < this.max; i++)
      this.pool.push({ alive: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1,
                       size: 1, col: '#fff', col2: null, grav: 0, drag: .99,
                       kind: 'spark', glow: 0, spin: 0, rot: 0, tag: 0 });
  },

  spawn(o) {
    // busca una ranura libre recorriendo el anillo (coste amortizado O(1))
    for (let n = 0; n < this.max; n++) {
      const p = this.pool[this.idx];
      this.idx = (this.idx + 1) % this.max;
      if (p.alive) continue;
      p.alive = true;
      p.x = o.x; p.y = o.y;
      p.vx = o.vx || 0; p.vy = o.vy || 0;
      p.max = p.life = o.life || 1;
      p.size = o.size || 1;
      p.col = o.col || PAL.cream; p.col2 = o.col2 || null;
      p.grav = o.grav == null ? 0 : o.grav;
      p.drag = o.drag == null ? .985 : o.drag;
      p.kind = o.kind || 'spark';
      p.glow = o.glow || 0;
      p.spin = o.spin || 0; p.rot = o.rot || 0;
      p.tag = o.tag || 0;
      return p;
    }
    return null;
  },

  update(dt) {
    for (let i = 0; i < this.max; i++) {
      const p = this.pool[i];
      if (!p.alive) continue;
      p.life -= dt;
      if (p.life <= 0) { p.alive = false; continue; }
      p.vy += p.grav * dt;
      p.vx *= Math.pow(p.drag, dt * 60);
      p.vy *= Math.pow(p.drag, dt * 60);
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.spin * dt;
      // las hojas y cenizas serpentean con el viento
      if (p.kind === 'leaf' || p.kind === 'ash')
        p.x += Math.sin(p.life * 4 + p.tag) * 14 * dt;
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.life -= dt;
      r.r += r.speed * dt;
      if (r.life <= 0) this.rings.splice(i, 1);
    }
    for (let i = this.bolts.length - 1; i >= 0; i--) {
      this.bolts[i].life -= dt;
      if (this.bolts[i].life <= 0) this.bolts.splice(i, 1);
    }
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.life -= dt; t.y += t.vy * dt; t.vy += 60 * dt;
      if (t.life <= 0) this.texts.splice(i, 1);
    }
  },

  /* Dibujo: capa "under" va detrás de las entidades, "over" delante.
     Las partículas viven en coordenadas del MUNDO, así que hay que restar la
     cámara igual que hace el resto del escenario; sin eso, todo efecto
     ocurrido más allá de la primera pantalla se dibuja fuera de cuadro.     */
  draw(c, layer, camx, camy) {
    camx = camx || 0; camy = camy || 0;
    for (let i = 0; i < this.max; i++) {
      const p = this.pool[i];
      if (!p.alive) continue;
      const over = (p.kind === 'magic' || p.kind === 'spark' || p.kind === 'holy' || p.kind === 'fire');
      if (layer === 'over' !== over) continue;
      const px = p.x - camx, py = p.y - camy;
      if (px < -20 || px > W + 20 || py < -20 || py > H + 20) continue;
      const k = p.life / p.max;
      const a = k > .8 ? (1 - k) * 5 : k;         // aparece y se apaga suave
      c.globalAlpha = U.clamp(a, 0, 1);
      const s = Math.max(1, Math.round(p.size * (p.kind === 'smoke' ? (2 - k) : k)));
      const col = (p.col2 && k < .5) ? p.col2 : p.col;
      if (p.kind === 'leaf') {
        R(c, px, py, s + 1, s, col);
        R(c, px + 1, py - 1, 1, 1, PAL.leaf2);
      } else if (p.kind === 'shard') {
        c.save(); c.translate(Math.round(px), Math.round(py)); c.rotate(p.rot);
        R(c, -s / 2, -s / 2, s, s * 1.6, col); c.restore();
      } else {
        R(c, px - s / 2, py - s / 2, s, s, col);
      }
      if (p.glow > 0) glow(c, px, py, p.glow * k, col, .35 * a);
      c.globalAlpha = 1;
    }

    if (layer === 'over') {
      // ondas expansivas
      for (const r of this.rings) {
        const k = r.life / r.maxLife;
        c.save();
        c.globalAlpha = k * (r.alpha || .9);
        c.strokeStyle = r.col;
        c.lineWidth = Math.max(1, r.width * k);
        c.beginPath();
        c.ellipse(Math.round(r.x - camx), Math.round(r.y - camy),
          Math.max(1, Math.round(r.r)), Math.max(1, Math.round(r.r * (r.squash || 1))), 0, 0, TAU);
        c.stroke();
        c.restore();
      }
      // rayos
      for (const b of this.bolts) {
        const k = b.life / b.maxLife;
        c.save(); c.globalAlpha = k;
        c.strokeStyle = b.col; c.lineWidth = b.width;
        c.beginPath(); c.moveTo(b.pts[0] - camx, b.pts[1] - camy);
        for (let i = 2; i < b.pts.length; i += 2) c.lineTo(b.pts[i] - camx, b.pts[i + 1] - camy);
        c.stroke();
        c.globalAlpha = k * .5; c.lineWidth = b.width + 2; c.strokeStyle = b.col2 || b.col;
        c.stroke();
        c.restore();
      }
      // textos flotantes (números de daño, avisos)
      for (const t of this.texts) {
        const k = U.clamp(t.life / t.maxLife, 0, 1);
        c.save(); c.globalAlpha = k;
        txt(c, t.txt, t.x - camx, t.y - camy,
          { size: t.size || 8, col: t.col, align: 'center' });
        c.restore();
      }
    }
  },

  clear() { this.pool.forEach(p => p.alive = false); this.rings.length = 0; this.bolts.length = 0; this.texts.length = 0; },

  /* ---------------- emisores con nombre: el vocabulario visual del juego -- */
  burst(x, y, n, opt) {                     // explosión radial genérica
    opt = opt || {};
    for (let i = 0; i < n; i++) {
      const a = U.rand(TAU), sp = U.rand(opt.speed || 90, (opt.speed || 90) * .25);
      this.spawn({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (opt.lift || 0),
        life: U.rand(opt.life || .6, (opt.life || .6) * .4),
        size: opt.size || 2, col: opt.col || PAL.ember, col2: opt.col2,
        grav: opt.grav == null ? 120 : opt.grav, kind: opt.kind || 'spark',
        glow: opt.glow || 0, drag: opt.drag
      });
    }
  },
  sparks(x, y, dir, n = 8) {                // chispas de impacto de espada
    for (let i = 0; i < n; i++) {
      const a = U.rand(-.9, .9) + (dir > 0 ? 0 : Math.PI);
      const sp = U.rand(190, 60);
      this.spawn({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
        life: U.rand(.4, .16), size: 2, col: PAL.sun, col2: PAL.ember,
        grav: 300, kind: 'spark', glow: 5 });
    }
  },
  dust(x, y, n = 6, col) {                  // polvo al aterrizar o correr
    for (let i = 0; i < n; i++)
      this.spawn({ x: x + U.rand(6, -6), y, vx: U.rand(40, -40), vy: U.rand(-8, -34),
        life: U.rand(.55, .25), size: U.randi(3, 1), col: col || '#6a5a70',
        grav: 30, drag: .93, kind: 'smoke' });
  },
  ember(x, y, n = 3) {                      // brasas ascendentes (antorchas)
    for (let i = 0; i < n; i++)
      this.spawn({ x: x + U.rand(3, -3), y, vx: U.rand(14, -14), vy: U.rand(-22, -46),
        life: U.rand(1.6, .8), size: 1, col: PAL.ember, col2: PAL.flame,
        grav: -8, drag: .99, kind: 'fire', glow: 4 });
  },
  magic(x, y, n = 10, col) {                // estela arcana
    for (let i = 0; i < n; i++) {
      const a = U.rand(TAU);
      this.spawn({ x, y, vx: Math.cos(a) * U.rand(50, 10), vy: Math.sin(a) * U.rand(50, 10) - 18,
        life: U.rand(.85, .35), size: 2, col: col || PAL.vio2, col2: PAL.ice,
        grav: -14, kind: 'magic', glow: 7 });
    }
  },
  holy(x, y, n = 14) {                      // luz del paladín
    for (let i = 0; i < n; i++) {
      const a = U.rand(TAU), r = U.rand(16, 4);
      this.spawn({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r,
        vx: Math.cos(a) * 26, vy: -U.rand(60, 24),
        life: U.rand(1.1, .5), size: 2, col: PAL.sun, col2: PAL.gold,
        grav: -26, kind: 'holy', glow: 8 });
    }
  },
  gore(x, y, n, col) {                      // fragmentos al destruir enemigos
    for (let i = 0; i < n; i++) {
      const a = U.rand(TAU);
      this.spawn({ x, y, vx: Math.cos(a) * U.rand(140, 30), vy: Math.sin(a) * U.rand(120, 30) - 60,
        life: U.rand(.9, .4), size: U.randi(4, 2), col: col || PAL.plum,
        grav: 420, drag: .97, kind: 'shard', spin: U.rand(12, -12), rot: U.rand(TAU) });
    }
  },
  ring(x, y, opt) {                         // onda expansiva
    opt = opt || {};
    this.rings.push({ x, y, r: opt.r0 || 2, speed: opt.speed || 210,
      life: opt.life || .5, maxLife: opt.life || .5,
      col: opt.col || PAL.sun, width: opt.width || 2, squash: opt.squash || 1, alpha: opt.alpha });
  },
  bolt(x1, y1, x2, y2, opt) {               // rayo quebrado
    opt = opt || {};
    const segs = opt.segs || 7, pts = [x1, y1];
    for (let i = 1; i < segs; i++) {
      const p = i / segs;
      pts.push(U.lerp(x1, x2, p) + U.rand(9, -9), U.lerp(y1, y2, p) + U.rand(9, -9));
    }
    pts.push(x2, y2);
    this.bolts.push({ pts, life: opt.life || .18, maxLife: opt.life || .18,
      col: opt.col || PAL.ice, col2: opt.col2 || PAL.white, width: opt.width || 1 });
  },
  text(x, y, txt, col, size) {
    this.texts.push({ x, y, txt, col: col || PAL.cream, size: size || 8,
      vy: -34, life: .9, maxLife: .9 });
  }
};

/* -------------------------------------------------------------- cámara -- */
const Cam = {
  x: 0, y: 0, tx: 0, ty: 0,
  shakeAmt: 0, shakeT: 0, ox: 0, oy: 0,
  minX: 0, maxX: 99999, minY: -400, maxY: 400,
  lockY: true,

  follow(px, py, dt, lead = 0) {
    this.tx = px - W / 2 + lead;
    this.ty = this.lockY ? this.ty : py - H / 2;
    this.x = U.damp(this.x, U.clamp(this.tx, this.minX, this.maxX), 7, dt);
    this.y = U.damp(this.y, U.clamp(this.ty, this.minY, this.maxY), 5, dt);
    if (this.shakeT > 0) {
      this.shakeT -= dt;
      const k = Math.max(0, this.shakeT);
      this.ox = U.rand(this.shakeAmt, -this.shakeAmt) * k * 4;
      this.oy = U.rand(this.shakeAmt, -this.shakeAmt) * k * 4;
    } else { this.ox = 0; this.oy = 0; }
  },
  snap(px) { this.x = U.clamp(px - W / 2, this.minX, this.maxX); },
  /* Toda sacudida de cámara vibra también el mando: un solo punto de verdad
     para el impacto, así ningún golpe se queda sin respuesta háptica.       */
  shake(amt, time) {
    if (amt > this.shakeAmt || this.shakeT <= 0) this.shakeAmt = amt;
    this.shakeT = Math.max(this.shakeT, time);
    Input.rumble(U.clamp(amt / 5, .08, 1), U.clamp(amt / 9, .05, .7),
                 Math.round(U.clamp(time * 1000, 60, 500)));
  },
  get rx() { return Math.round(this.x + this.ox); },
  get ry() { return Math.round(this.y + this.oy); }
};

/* ---------------------------------- destellos, congelado y transiciones -- */
const Screen = {
  flashT: 0, flashMax: 0, flashCol: '#fff',
  freezeT: 0,                     // congelado de impacto (hit-stop)
  fadeA: 0, fadeTarget: 0, fadeSpeed: 1.6, fadeCol: '#000',
  chroma: 0,                      // aberración cromática en momentos épicos

  flash(col = '#fff', time = .16) { this.flashCol = col; this.flashT = this.flashMax = time; },
  freeze(time = .06) { this.freezeT = Math.max(this.freezeT, time); },
  fadeTo(v, speed = 1.6, col = '#000') { this.fadeTarget = v; this.fadeSpeed = speed; this.fadeCol = col; },

  update(dt) {
    if (this.flashT > 0) this.flashT -= dt;
    if (this.freezeT > 0) this.freezeT -= dt;
    this.fadeA = U.approach(this.fadeA, this.fadeTarget, this.fadeSpeed * dt);
    this.chroma = U.approach(this.chroma, 0, dt * 2);
  },
  drawOver(c) {
    if (this.flashT > 0) {
      c.save();
      c.globalAlpha = U.clamp(this.flashT / this.flashMax, 0, 1) * .85;
      c.fillStyle = this.flashCol; c.fillRect(0, 0, W, H);
      c.restore();
    }
    if (this.fadeA > 0.001) {
      c.save(); c.globalAlpha = U.clamp(this.fadeA, 0, 1);
      c.fillStyle = this.fadeCol; c.fillRect(0, 0, W, H); c.restore();
    }
  }
};

/* ------------------------------------------------- capa de luz ambiental -- */
/* Se compone con "multiply" para oscurecer y luego se suman los focos.      */
const Lights = {
  buf: null, ctx: null,
  init() {
    this.buf = document.createElement('canvas');
    this.buf.width = W; this.buf.height = H;
    this.ctx = this.buf.getContext('2d');
  },
  /* lights: [{x,y,r,col,a}] ; ambient: color de la oscuridad general */
  render(target, lights, ambient, strength) {
    if (!this.buf) this.init();
    const c = this.ctx;
    c.globalCompositeOperation = 'source-over';
    c.fillStyle = ambient; c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = 'lighter';
    for (const L of lights) {
      const g = c.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
      g.addColorStop(0, L.col);
      g.addColorStop(.55, L.col2 || 'rgba(70,40,90,.35)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      c.globalAlpha = L.a == null ? 1 : L.a;
      c.fillStyle = g;
      c.beginPath(); c.arc(L.x, L.y, L.r, 0, TAU); c.fill();
    }
    c.globalAlpha = 1;
    target.save();
    target.globalAlpha = strength;
    target.globalCompositeOperation = 'multiply';
    target.drawImage(this.buf, 0, 0);
    target.restore();
  }
};

/* ===== 03-world.js ===== */
/* =========================================================================
   CORAZÓN DE DRAGÓN — 03-world.js
   Cielo dinámico, parallax de seis capas, terreno, agua, puentes y
   el diseño completo del Nivel 1.
   ========================================================================= */
'use strict';

/* Hash determinista: el fondo debe ser idéntico en cada fotograma.          */
function hash(i, s = 0) {
  const v = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453;
  return v - Math.floor(v);
}

/* =========================================================================
   BIOMAS — el color del mundo cambia conforme Denzel se acerca a la torre.
   ========================================================================= */
/* `light` es la fuerza del velo de oscuridad y `ambient` su color. Suben
   juntos conforme te acercas a la torre: el mundo se cierra sobre ti, pero
   nunca al punto de no ver dónde pisas.                                     */
const BIOMES = [
  { at: 0,    name: 'Claro de los Girasoles', sky: ['#6a93bc', '#9dc4d6', '#d6e4c8'], fog: 'rgba(200,210,180,.08)',
    far: '#5a708a', mid: '#46645e', near: '#2e4c44', ground: '#4e9260', soil: '#5a4636', ambient: 'rgba(205,210,190,1)', light: .16 },
  { at: 900,  name: 'Bosque Marchito',        sky: ['#3a3556', '#5e4a72', '#845c80'], fog: 'rgba(120,90,140,.13)',
    far: '#4a3e66', mid: '#372e52', near: '#26203e', ground: '#3d6f57', soil: '#4a3540', ambient: 'rgba(170,150,195,1)', light: .30 },
  { at: 2400, name: 'Cañada de Sombras',      sky: ['#271a42', '#432a66', '#6f4090'], fog: 'rgba(139,59,214,.12)',
    far: '#382456', mid: '#2a1c46', near: '#1d1434', ground: '#35594a', soil: '#3c2c3e', ambient: 'rgba(140,115,180,1)', light: .40 },
  { at: 3900, name: 'Ruinas Anegadas',        sky: ['#16273f', '#274364', '#365f84'], fog: 'rgba(63,159,181,.13)',
    far: '#274364', mid: '#1e3450', near: '#15263a', ground: '#356069', soil: '#364252', ambient: 'rgba(125,155,195,1)', light: .42 },
  { at: 5200, name: 'Torre Escarlata',        sky: ['#22101e', '#4e1533', '#86203e'], fog: 'rgba(212,106,140,.15)',
    far: '#3e162e', mid: '#2c1022', near: '#1d0a18', ground: '#4c2a3e', soil: '#381c2a', ambient: 'rgba(190,110,130,1)', light: .50 }
];

function biomeAt(x) {
  let a = BIOMES[0], b = BIOMES[0];
  for (let i = 0; i < BIOMES.length; i++) {
    if (x >= BIOMES[i].at) { a = BIOMES[i]; b = BIOMES[Math.min(i + 1, BIOMES.length - 1)]; }
  }
  const span = Math.max(1, b.at - a.at);
  const t = a === b ? 0 : U.clamp((x - a.at) / span, 0, 1);
  return { a, b, t };
}
function mixHex(c1, c2, t) {
  const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const A = p(c1), B = p(c2);
  const q = v => Math.round(v).toString(16).padStart(2, '0');
  return '#' + q(U.lerp(A[0], B[0], t)) + q(U.lerp(A[1], B[1], t)) + q(U.lerp(A[2], B[2], t));
}
function mixRgba(c1, c2, t) {
  const p = s => s.match(/[\d.]+/g).map(Number);
  const A = p(c1), B = p(c2);
  return `rgba(${Math.round(U.lerp(A[0], B[0], t))},${Math.round(U.lerp(A[1], B[1], t))},${Math.round(U.lerp(A[2], B[2], t))},${U.lerp(A[3] == null ? 1 : A[3], B[3] == null ? 1 : B[3], t)})`;
}
/* Paleta interpolada del punto de vista actual de la cámara. */
function currentBiome(x) {
  const { a, b, t } = biomeAt(x);
  return {
    name: t > .5 ? b.name : a.name,
    sky: [mixHex(a.sky[0], b.sky[0], t), mixHex(a.sky[1], b.sky[1], t), mixHex(a.sky[2], b.sky[2], t)],
    fog: mixRgba(a.fog, b.fog, t),
    far: mixHex(a.far, b.far, t), mid: mixHex(a.mid, b.mid, t), near: mixHex(a.near, b.near, t),
    ground: mixHex(a.ground, b.ground, t), soil: mixHex(a.soil, b.soil, t),
    ambient: mixRgba(a.ambient, b.ambient, t),
    light: U.lerp(a.light, b.light, t)
  };
}

/* =========================================================================
   FONDO — capas de parallax, cielo, nubes, aves, bandadas y clima.
   ========================================================================= */
const Sky = {
  birds: [], flocks: [], t: 0, wind: 0, windTarget: .5,

  init() {
    this.birds.length = 0; this.flocks.length = 0;
    for (let i = 0; i < 3; i++)
      this.flocks.push({ x: U.rand(W * 2, -W), y: U.rand(90, 20), n: U.randi(9, 4),
        sp: U.rand(26, 12), ph: U.rand(TAU), depth: U.rand(.22, .08) });
  },

  update(dt, camx) {
    this.t += dt;
    // el viento sube y baja: mueve hierba, capas, puentes y partículas
    if (Math.random() < .004) this.windTarget = U.rand(1.4, .15);
    this.wind = U.damp(this.wind, this.windTarget, 1.2, dt);
    for (const f of this.flocks) {
      f.x += f.sp * dt;
      if (f.x > camx * f.depth + W + 120) {
        f.x = camx * f.depth - 140;
        f.y = U.rand(100, 16); f.n = U.randi(10, 4); f.sp = U.rand(28, 11);
      }
    }
  },

  /* --- cielo: degradado + astro + estrellas --- */
  drawSky(c, camx, bio, dayMode) {
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, bio.sky[0]);
    g.addColorStop(.55, bio.sky[1]);
    g.addColorStop(1, bio.sky[2]);
    c.fillStyle = g; c.fillRect(0, 0, W, H);

    if (!dayMode) {
      // estrellas fijas respecto al mundo, con parpadeo suave
      for (let i = 0; i < 70; i++) {
        const sx = (hash(i, 1) * 2400 - camx * .04) % (W + 60);
        const x = sx < 0 ? sx + W + 60 : sx;
        const y = hash(i, 2) * 140;
        const tw = .35 + Math.sin(this.t * 2 + i) * .35;
        c.globalAlpha = tw * (1 - y / 190);
        R(c, x, y, hash(i, 3) > .88 ? 2 : 1, 1, PAL.cream);
      }
      c.globalAlpha = 1;
      // luna creciente
      const mx = 392 - camx * .012, my = 44;
      glow(c, mx, my, 44, 'rgba(255,240,200,.30)', .7);
      ell(c, mx, my, 15, 15, '#fdf3c9');
      ell(c, mx - 6, my - 4, 13, 13, mixHex(bio.sky[0], '#000000', .18));
    } else {
      // sol cálido de la pantalla de título
      const sx = 380 - camx * .02, sy = 52;
      glow(c, sx, sy, 78, 'rgba(255,240,190,.55)', .8);
      ell(c, sx, sy, 17, 17, '#fff6d0');
    }
  },

  /* --- nubes pixeladas en dos profundidades --- */
  drawClouds(c, camx, depth, col, count, yBase, seed) {
    for (let i = 0; i < count; i++) {
      const span = 1800;
      let x = (hash(i, seed) * span - camx * depth - this.t * (4 + depth * 22)) % (span);
      if (x < -250) x += span;
      const y = yBase + hash(i, seed + 1) * 46;
      const s = .6 + hash(i, seed + 2) * 1.1;
      c.globalAlpha = .55 + hash(i, seed + 3) * .35;
      ell(c, x, y, 20 * s, 6 * s, col);
      ell(c, x - 13 * s, y + 2 * s, 12 * s, 4 * s, col);
      ell(c, x + 14 * s, y + 2 * s, 11 * s, 4 * s, col);
      ell(c, x + 3 * s, y - 4 * s, 10 * s, 5 * s, col);
      c.globalAlpha = 1;
    }
  },

  /* --- bandadas de aves: silueta con aleteo --- */
  drawBirds(c, camx) {
    for (const f of this.flocks) {
      for (let i = 0; i < f.n; i++) {
        const bx = f.x - camx * f.depth + i * 11 - (i % 2) * 5;
        const by = f.y + Math.sin(this.t * 1.4 + f.ph + i * .7) * 5 + (i % 3) * 4;
        if (bx < -20 || bx > W + 20) continue;
        const flap = Math.sin(this.t * 9 + i * 1.3);
        c.globalAlpha = .55;
        R(c, bx, by, 1, 1, '#241a30');
        R(c, bx - 2, by - Math.round(flap * 1.6), 2, 1, '#241a30');
        R(c, bx + 1, by - Math.round(flap * 1.6), 2, 1, '#241a30');
        c.globalAlpha = 1;
      }
    }
  },

  /* --- montañas lejanas dentadas --- */
  drawMountains(c, camx, depth, col, base, height, seed) {
    const off = -camx * depth;
    c.fillStyle = col;
    c.beginPath(); c.moveTo(0, H);
    for (let x = -40; x <= W + 40; x += 8) {
      const wx = x - off;
      const h = base
        - Math.abs(Math.sin((wx + seed * 120) * .0042)) * height
        - Math.abs(Math.sin((wx + seed * 330) * .0115)) * height * .35;
      c.lineTo(x, Math.round(h));
    }
    c.lineTo(W, H); c.closePath(); c.fill();
  },

  /* --- silueta de bosque: copas anchas sobre troncos cortos ---
     Troncos largos y copas pequeñas leen como setas; la masa de la copa es
     lo que hace que una silueta parezca bosque.                            */
  drawForestLayer(c, camx, depth, col, baseY, scale, seed, count) {
    const off = camx * depth;
    for (let i = 0; i < count; i++) {
      const span = 2600;
      let x = (hash(i, seed) * span - off) % span;
      if (x < -120) x += span;
      if (x > W + 120) continue;
      const h = (14 + hash(i, seed + 7) * 22) * scale;      // tronco más corto
      const sway = Math.sin(this.t * .7 + i) * this.wind * 1.6 * scale;
      const y = baseY + hash(i, seed + 3) * 10;
      const r = (11 + hash(i, seed + 11) * 7) * scale;       // copa más ancha
      R(c, x + sway * .4, y - h, Math.max(1, 3 * scale), h + 2, col);
      // copa: cúpula de varias masas, más ancha que alta
      ell(c, x + sway, y - h - r * .35, r, r * .72, col);
      ell(c, x - r * .72 + sway, y - h + r * .12, r * .66, r * .5, col);
      ell(c, x + r * .72 + sway, y - h + r * .08, r * .62, r * .48, col);
      ell(c, x + r * .18 + sway, y - h - r * .82, r * .58, r * .44, col);
      ell(c, x - r * .3 + sway, y - h - r * .66, r * .5, r * .4, col);
    }
  },

  /* --- la Torre Escarlata al fondo: siempre visible, siempre esperando --- */
  drawTower(c, camx, worldX, baseY, scale, lit) {
    const x = worldX - camx * .30;
    if (x < -160 || x > W + 160) return;
    const s = scale, top = baseY - 150 * s;
    // peñasco
    c.fillStyle = '#1a1024';
    tri(c, x - 60 * s, baseY, x + 60 * s, baseY, x, baseY - 26 * s, '#1a1024');
    R(c, x - 46 * s, baseY - 8 * s, 92 * s, 20 * s, '#1a1024');
    // fuste
    R(c, x - 20 * s, top, 40 * s, 150 * s, '#2a1526');
    R(c, x - 20 * s, top, 7 * s, 150 * s, '#3a1f34');
    R(c, x + 13 * s, top, 7 * s, 150 * s, '#1a0d18');
    // hiladas de sillares
    for (let i = 0; i < 14; i++) R(c, x - 20 * s, top + i * 11 * s, 40 * s, 1, '#1a0d18');
    // ventanas encendidas
    for (let i = 0; i < 5; i++) {
      const wy = top + 24 * s + i * 24 * s;
      const on = (i === 1 || i === 3);
      R(c, x - 5 * s, wy, 5 * s, 9 * s, on ? PAL.gold : '#140a12');
      if (on) glow(c, x - 2 * s, wy + 4 * s, 16 * s, 'rgba(255,206,106,.4)', .5);
    }
    // corona almenada
    R(c, x - 26 * s, top - 9 * s, 52 * s, 10 * s, '#31182c');
    for (let i = 0; i < 7; i++) R(c, x - 26 * s + i * 8 * s, top - 15 * s, 5 * s, 7 * s, '#3a1f34');
    // aguja y fanal
    tri(c, x - 26 * s, top - 14 * s, x + 26 * s, top - 14 * s, x, top - 46 * s, '#4a1428');
    if (lit) {
      const p = .75 + Math.sin(this.t * 2) * .25;
      R(c, x - 3 * s, top - 26 * s, 6 * s, 8 * s, PAL.blush);
      glow(c, x, top - 22 * s, 40 * s * p, 'rgba(212,106,140,.5)', .6);
      glow(c, x, top - 22 * s, 90 * s * p, 'rgba(212,106,140,.15)', .5);
    }
  }
};

/* =========================================================================
   MUNDO — física del terreno y su dibujo.
   ========================================================================= */
const World = {
  L: null, t: 0, bridgePhase: 0,

  load(level) {
    this.L = level;
    if (!level.decor) level.buildDecor();
    this.movers = level.movers.map(m => Object.assign({}, m));
    this.t = 0;
    Sky.init();
  },

  update(dt) {
    this.t += dt;
    // plataformas móviles con vaivén suave (seno = sin tirones en los extremos)
    for (const m of this.movers) {
      const k = (Math.sin(this.t * m.sp * TAU + m.ph * TAU) + 1) / 2;
      m.px = m.x; m.py = m.y;
      m.x = U.lerp(m.ax, m.bx, k);
      m.y = U.lerp(m.ay, m.by, k);
      m.dx = m.x - m.px; m.dy = m.y - m.py;
    }
  },

  /* --- consultas de colisión --- */
  /* Devuelve el sólido que contiene el rectángulo dado, o null.             */
  solidAt(r) {
    for (const s of this.L.solids) if (U.aabb(r, s)) return s;
    for (const m of this.movers) if (U.aabb(r, m)) return m;
    return null;
  },
  /* Plataformas atravesables desde abajo: sólo frenan si caes sobre ellas.  */
  bridgeTopAt(x) {
    for (const b of this.L.bridges) {
      if (x >= b.x1 && x <= b.x2) {
        const p = (x - b.x1) / (b.x2 - b.x1);
        return b.y + Math.sin(p * Math.PI) * 14 + Math.sin(this.t * 1.6 + p * 4) * Sky.wind * 2.2;
      }
    }
    return null;
  },
  inWater(r) {
    for (const w of this.L.waters) if (U.aabb(r, w)) return w;
    return null;
  },
  hazardAt(r) {
    for (const h of this.L.hazards) if (U.aabb(r, h)) return h;
    return null;
  },

  /* Posición en pantalla de la Torre Escarlata.
     No usa parallax normal: a esa distancia una capa lejana la sacaría de
     cuadro enseguida. En vez de eso crece con el avance del nivel, así el
     jugador la tiene SIEMPRE delante y la ve acercarse paso a paso.         */
  towerScreen(camx) {
    const prog = U.clamp(camx / Math.max(1, this.L.width - W), 0, 1);
    const e = prog * prog;                         // se acerca de golpe al final
    return {
      x: U.lerp(408, 252, e),
      baseY: U.lerp(152, 214, e),
      s: U.lerp(.42, 1.3, e),
      prog
    };
  },

  /* =================================================== dibujo del fondo -- */
  drawBackground(c, camx, bio) {
    Sky.drawSky(c, camx, bio, false);
    Sky.drawClouds(c, camx, .03, mixHex(bio.sky[1], '#ffffff', .18), 9, 22, 31);
    Sky.drawMountains(c, camx, .07, bio.far, 150, 66, 3);
    Sky.drawBirds(c, camx);
    Sky.drawClouds(c, camx, .10, mixHex(bio.sky[1], '#ffffff', .30), 7, 58, 77);
    Sky.drawMountains(c, camx, .14, mixHex(bio.far, bio.mid, .5), 168, 44, 9);
    // la torre: el destino, visible desde el primer paso
    const T = this.towerScreen(camx);
    Sky.drawTower(c, 0, T.x, T.baseY, T.s, true);
    Sky.drawForestLayer(c, camx, .22, bio.mid, 190, .8, 41, 34);
    Sky.drawForestLayer(c, camx, .42, bio.near, 202, 1.05, 61, 26);
    // niebla de valle
    c.fillStyle = bio.fog;
    c.fillRect(0, 150, W, H - 150);
    for (let i = 0; i < 5; i++) {
      const fx = ((hash(i, 91) * 1400 - camx * .5 - this.t * 8) % 1400 + 1400) % 1400 - 200;
      c.globalAlpha = .16;
      ell(c, fx, 176 + i * 9, 120, 9, mixHex(bio.sky[2], '#ffffff', .4));
      c.globalAlpha = 1;
    }
  },

  /* ================================================ dibujo del decorado -- */
  drawDecorBack(c, camx, bio) {
    const d = this.L.decor;
    for (const o of d) {
      const x = o.x - camx;
      if (x < -60 || x > W + 60) continue;
      switch (o.t) {
        case 'tree':   Props.tree(c, x, o.y, o.h, this.t + Sky.wind, o.s, o.dark); break;
        case 'dead':   Props.deadTree(c, x, o.y, o.h, this.t * (.6 + Sky.wind * .5), o.s); break;
        case 'rune':   Props.rune(c, x, o.y, this.t, o.s); break;
        case 'column': {
          R(c, x - 5, o.y - o.h, 10, o.h, '#2f3a44');
          R(c, x - 5, o.y - o.h, 3, o.h, '#42505c');
          R(c, x - 7, o.y - 3, 14, 4, '#2a3340');
          for (let i = 0; i < o.h / 7; i++) R(c, x - 5, o.y - o.h + i * 7, 10, 1, '#1e2630');
          break;
        }
      }
    }
  },

  drawDecorFront(c, camx) {
    for (const o of this.L.decor) {
      const x = o.x - camx;
      if (x < -40 || x > W + 40) continue;
      if (o.t === 'sun') Props.sunflower(c, x, o.y, this.t + Sky.wind, o.s);
      if (o.t === 'torch') {
        Props.torch(c, x, o.y, this.t, o.s);
        if (Math.random() < .25) FX.ember(o.x, o.y - 4, 1);
      }
    }
  },

  /* ==================================================== dibujo del suelo -- */
  drawTerrain(c, camx, bio) {
    const draw = (s) => {
      const x = Math.round(s.x - camx), y = Math.round(s.y);
      if (x + s.w < -20 || x > W + 20) return;
      const type = s.type || 'earth';
      if (type === 'earth') {
        R(c, x, y, s.w, s.h, bio.soil);                       // tierra
        R(c, x, y, s.w, 4, bio.ground);                       // césped/musgo
        R(c, x, y, s.w, 1, mixHex(bio.ground, '#ffffff', .25));
        // hierba que se mece en el borde superior
        for (let i = 0; i < s.w; i += 5) {
          const g = Math.sin((s.x + i) * .3 + this.t * 1.4 + Sky.wind * 3) * (1 + Sky.wind);
          R(c, x + i + g * .5, y - 3, 1, 3, bio.ground);
          if ((i / 5 | 0) % 3 === 0) R(c, x + i + 2 + g, y - 5, 1, 5, mixHex(bio.ground, '#ffffff', .2));
        }
        // vetas de roca
        for (let i = 0; i < s.w; i += 17) {
          const hh = 3 + hash(s.x + i, 33) * 5;
          R(c, x + i + 2, y + 8 + hash(s.x + i, 34) * 14, 9, hh, mixHex(bio.soil, '#000000', .25));
        }
      } else if (type === 'rock' || type === 'stone') {
        R(c, x, y, s.w, s.h, '#3a4452');
        R(c, x, y, s.w, 2, '#5a6878');
        R(c, x, y + s.h - 2, s.w, 2, '#242c36');
        for (let i = 0; i < s.w; i += 9) R(c, x + i, y + 2, 1, s.h - 4, '#2c3440');
        if (type === 'stone') { R(c, x + 1, y + 1, 2, 1, '#8e9aa8'); R(c, x + s.w - 4, y + 1, 2, 1, '#8e9aa8'); }
      } else if (type === 'wood') {
        R(c, x, y, s.w, s.h, PAL.bark2);
        R(c, x, y, s.w, 2, '#6b4a33');
        R(c, x, y + s.h - 1, s.w, 1, '#241a20');
        for (let i = 0; i < s.w; i += 11) R(c, x + i, y, 1, s.h, PAL.bark);
      } else if (type === 'root') {
        R(c, x, y, s.w, s.h, PAL.bark);
        R(c, x, y, s.w, 3, PAL.moss);
        for (let i = 0; i < s.w; i += 7)
          R(c, x + i, y + 3 + hash(i, 44) * 10, 5, 2 + hash(i, 45) * 4, PAL.bark2);
      }
    };
    this.L.solids.forEach(draw);
    this.movers.forEach(m => {
      draw(m);
      // cadenas que sostienen la plataforma
      const mx = Math.round(m.x - camx + m.w / 2);
      for (let y = m.y - 4; y > m.y - 60 && y > 0; y -= 6) R(c, mx, y, 1, 3, PAL.iron2);
    });
  },

  /* --------------------------------------------- puentes colgantes ------- */
  drawBridges(c, camx) {
    for (const b of this.L.bridges) {
      const n = b.planks;
      let prevX = null, prevY = null;
      for (let i = 0; i <= n; i++) {
        const p = i / n;
        const wx = U.lerp(b.x1, b.x2, p);
        const wy = b.y + Math.sin(p * Math.PI) * 14 + Math.sin(this.t * 1.6 + p * 4) * Sky.wind * 2.2;
        const x = Math.round(wx - camx), y = Math.round(wy);
        if (prevX !== null) {
          // cuerdas superior e inferior
          c.strokeStyle = '#4a3226'; c.lineWidth = 1;
          c.beginPath(); c.moveTo(prevX, prevY - 12); c.lineTo(x, y - 12); c.stroke();
          c.beginPath(); c.moveTo(prevX, prevY); c.lineTo(x, y); c.stroke();
        }
        R(c, x - 3, y, 7, 3, i % 2 ? PAL.bark2 : '#6b4a33');   // tablón
        R(c, x, y - 12, 1, 12, '#3b2a33');                     // tirante
        prevX = x; prevY = y;
      }
      // postes de anclaje
      R(c, Math.round(b.x1 - camx) - 3, b.y - 26, 5, 30, PAL.bark);
      R(c, Math.round(b.x2 - camx) - 2, b.y - 26, 5, 30, PAL.bark);
    }
  },

  /* ------------------------------------------------------ agua animada --- */
  drawWater(c, camx, bio) {
    for (const w of this.L.waters) {
      const x = Math.round(w.x - camx);
      if (x + w.w < -20 || x > W + 20) continue;
      // cuerpo traslúcido
      c.save();
      c.globalAlpha = .55;
      R(c, x, w.y, w.w, w.h, PAL.deepsea);
      c.globalAlpha = .35;
      R(c, x, w.y, w.w, 10, PAL.sea);
      c.restore();
      // oleaje: dos senoidales desfasadas
      for (let i = 0; i < w.w; i += 3) {
        const wv = Math.sin((w.x + i) * .09 + this.t * 2.2) * 1.6
                 + Math.sin((w.x + i) * .21 - this.t * 3.1) * 1.1;
        R(c, x + i, w.y + wv, 3, 2, PAL.aqua);
        if (((i / 3) | 0) % 5 === 0) R(c, x + i, w.y + wv - 1, 2, 1, PAL.ice);
      }
      // reflejo tenue de la luna
      c.globalAlpha = .12;
      for (let i = 0; i < w.w; i += 8)
        R(c, x + i, w.y + 6 + Math.sin(this.t * 1.5 + i) * 2, 5, 1, PAL.ice);
      c.globalAlpha = 1;
      // burbujas
      if (Math.random() < .12)
        FX.spawn({ x: w.x + U.rand(w.w), y: w.y + 20, vx: 0, vy: -16,
          life: 1.2, size: 1, col: PAL.ice, kind: 'bubble', drag: 1 });
    }
  },

  drawHazards(c, camx) {
    for (const h of this.L.hazards) {
      const x = Math.round(h.x - camx);
      if (x + h.w < -10 || x > W + 10) continue;
      for (let i = 0; i < h.w; i += 5) {
        tri(c, x + i, h.y + h.h, x + i + 5, h.y + h.h, x + i + 2, h.y - 2, '#4a2a3a');
        tri(c, x + i + 1, h.y + h.h, x + i + 4, h.y + h.h, x + i + 2, h.y + 2, '#7a3f5a');
      }
      R(c, x, h.y + h.h - 2, h.w, 3, '#2a1620');
      glow(c, x + h.w / 2, h.y + 2, 16, 'rgba(168,73,127,.22)', .4);
    }
  }
};

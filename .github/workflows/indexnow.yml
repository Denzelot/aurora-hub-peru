# Avisa a Bing, Yandex y demás buscadores de IndexNow cada vez que
# Vercel termina de publicar en producción.
name: IndexNow

on: deployment_status

jobs:
  avisar:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Enviar URLs a IndexNow
        env:
          KEY: 4819e7fba73e50eefe103330705d6d86
          HOST: www.aurorahubperu.com
        run: |
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":[\"https://$HOST/\",\"https://$HOST/paginas-web/\",\"https://$HOST/proyectos/\",\"https://$HOST/diagnostico/\",\"https://$HOST/guias/\",\"https://$HOST/guias/cuanto-cuesta-una-pagina-web-peru/\",\"https://$HOST/guias/cuanto-cuesta-chatbot-whatsapp-ia-peru/\",\"https://$HOST/guias/cuanto-invertir-meta-ads-peru/\",\"https://$HOST/servicios/chatbot-whatsapp-ia/\",\"https://$HOST/servicios/diseno-web/\",\"https://$HOST/servicios/meta-ads/\",\"https://$HOST/servicios/soporte-tecnico-remoto/\",\"https://$HOST/servicios/seo-google-maps/\",\"https://$HOST/servicios/automatizacion-n8n-kommo/\",\"https://$HOST/pulse/\",\"https://$HOST/pulse/dolarhoy\"]}" \
            -o /dev/null -w 'IndexNow respondió HTTP %{http_code}\n' --fail
